          ctx.strokeStyle = cur.tint;
          ctx.setLineDash([42, 34]);
          for (let r = -1; r <= 1; r++) {
            ctx.beginPath();
            for (let p = 0; p < cur.points.length; p++) {
              const pt = cur.points[p];
              const wave = Math.sin(simTime * 2.3 + p * 1.2 + r * 2.1) * 12;
              const px = pt.x + r * 24 + wave * 0.4;
              const py = pt.y + r * 12 + wave;
              if (p === 0) ctx.moveTo(px, py);
              else {
                const prev = cur.points[p - 1];
                ctx.quadraticCurveTo((prev.x + pt.x) * 0.5 + r * 24, (prev.y + pt.y) * 0.5 + r * 12 + wave, px, py);
              }
            }
            ctx.globalAlpha = cur.progress * (r === 0 ? 0.52 : 0.28);
            ctx.lineWidth = r === 0 ? 7.5 : 3.2;
            ctx.lineDashOffset = -simTime * (88 + r * 14);
            ctx.stroke();
          }
          ctx.restore();
        }

        ctx.fillStyle = '#fffdf2';
        for (let i = 0; i < currentDots.length; i++) {
          const d = currentDots[i];
          const cur = windCurrents[d.ci];
          if (cur.progress <= 0.02 || cur.maxX < minX || cur.minX > maxX) continue;
          const segF = d.t * cur.segs.length;
          const idx = Math.min(cur.segs.length - 1, Math.floor(segF));
          const seg = cur.segs[idx];
          const loc = segF - idx;
          const x = lerp(seg.x1, seg.x2, loc) - seg.dirY * d.off;
          if (x < minX || x > maxX) continue;
          const y = lerp(seg.y1, seg.y2, loc) + seg.dirX * d.off;
          ctx.globalAlpha = cur.progress * Math.sin(d.t * Math.PI) * 0.78;
          ctx.beginPath();
          ctx.arc(x, y, d.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      // 预烘焙丁达尔阳光光束精灵
      function drawWeatherSunbeams(minX, maxX) {
        for (let i = 0; i < weatherPuzzles.length; i++) {
          const wp = weatherPuzzles[i];
          if (wp.beamAlpha <= 0.01 || wp.sx + 260 < minX || wp.sx - 220 > maxX) continue;
          ctx.save();
          ctx.globalAlpha = wp.beamAlpha * (0.68 + Math.sin(simTime * 1.8 + i) * 0.08);
          ctx.drawImage(Sprites.sunbeam, wp.sx - 120, wp.baseY - 720, 340, 740);
          ctx.restore();
        }
      }

      function drawSunflowers(minX, maxX) {
        for (let i = 0; i < weatherPuzzles.length; i++) {
          const wp = weatherPuzzles[i];
          if (wp.sx < minX || wp.sx > maxX) continue;
          const stemH = lerp(52, wp.maxH, wp.growth);
          const sway = Math.sin(simTime * 1.8 + i) * 4 * wp.growth;
          const topX = wp.sx + sway;
          const topY = wp.baseY - stemH;

          ctx.strokeStyle = '#4c893b';
          ctx.lineWidth = lerp(7, 13, wp.growth);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(wp.sx, wp.baseY + 4);
          ctx.quadraticCurveTo(wp.sx + sway * 0.4, wp.baseY - stemH * 0.5, topX, topY);
          ctx.stroke();

          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.7;
          ctx.beginPath();
          ctx.moveTo(wp.sx - 5, wp.baseY);
          ctx.quadraticCurveTo(wp.sx + sway * 0.4 - 5, wp.baseY - stemH * 0.5, topX - 4, topY);
          ctx.stroke();

          if (wp.growth > 0.25) {
            const ls = smoothstep((wp.growth - 0.25) / 0.75);
            for (let l = 0; l < wp.leaves.length; l++) {
              const lf = wp.leaves[l];
              const ly = wp.baseY - stemH * lf.hRatio;
              const len = lf.len * ls;
              ctx.save();
              ctx.translate(wp.sx + sway * lf.hRatio, ly);
              ctx.rotate(lf.side * (0.08 + lf.bend * 0.14));
              ctx.fillStyle = '#6fb04b';
              ctx.strokeStyle = INK;
              ctx.lineWidth = 1.9;
              ctx.beginPath();
              ctx.moveTo(0, 0);
              ctx.quadraticCurveTo(lf.side * len * 0.55, -22 * ls, lf.side * len, -2);
              ctx.quadraticCurveTo(lf.side * len * 0.55, 19 * ls, 0, 5);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.strokeStyle = '#9fd36f';
              ctx.lineWidth = 1.5;
              ctx.beginPath(); ctx.moveTo(lf.side * 6, 1); ctx.lineTo(lf.side * len * 0.82, -2); ctx.stroke();
              ctx.restore();
            }
          }

          ctx.save();
          ctx.translate(topX, topY + wp.headBend * 8);
          if (wp.growth < 0.35) ctx.rotate(0.55 * (1 - wp.growth * 2.5));
          const headR = lerp(18, 34, wp.growth);
          if (wp.growth > 0.6) ctx.drawImage(Sprites.goldGlow, -72, -72, 144, 144);

          ctx.fillStyle = wp.growth > 0.3 ? '#f8ca46' : '#c9b468';
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.6;
          for (let p = 0; p < 12; p++) {
            const ang = (p / 12) * 6.283 + simTime * 0.14 * wp.growth;
            ctx.save();
            ctx.rotate(ang);
            ctx.beginPath();
            ctx.ellipse(headR * 0.92, 0, headR * 0.45, headR * 0.21, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          ctx.fillStyle = '#6e492e';
          ctx.beginPath(); ctx.arc(0, 0, headR * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#3b2415';
          if (wp.growth > 0.5) {
            ctx.beginPath(); ctx.arc(-6, -3, 2, 0, Math.PI * 2); ctx.arc(6, -3, 2, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#f8ca46'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.arc(0, 1, 6, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
          } else {
            ctx.strokeStyle = '#3b2415'; ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(-5, 0, 3, 0, Math.PI); ctx.moveTo(8, 0); ctx.arc(5, 0, 3, 0, Math.PI); ctx.stroke();
          }
          ctx.restore();
        }
      }

      function drawRainclouds(minX, maxX) {
        const spr = Sprites.cloudRain;
        for (let i = 0; i < weatherPuzzles.length; i++) {
          const wp = weatherPuzzles[i];
          if (wp.dispersed || wp.cx + 160 < minX || wp.cx - 160 > maxX) continue;
          const a = clamp(wp.integrity, 0.15, 1);
          const sc = 0.72 + a * 0.34;
          const bob = Math.sin(simTime * 1.9 + i) * 4;

          ctx.save();
          ctx.strokeStyle = `rgba(148, 178, 206, ${(a * 0.54).toFixed(2)})`;
          ctx.lineWidth = 1.5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          for (let r = 0; r < 10; r++) {
            const rx = wp.cx - 68 + r * 15 + ((simTime * 18 + r * 31) % 10);
            const span = Math.max(80, wp.baseY - wp.cy - 25);
            const ry = wp.cy + 26 + ((simTime * 270 + r * 73) % span);
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx - 5, ry + 15);
          }
          ctx.stroke();

          ctx.globalAlpha = a;
          const w = spr.width * sc;
          const h = spr.height * sc;
          ctx.drawImage(spr, wp.cx - w * 0.5, wp.cy + bob - h * 0.54, w, h);
          ctx.restore();
        }
      }

      function drawMailboxes(minX, maxX) {
        for (let i = 0; i < mailboxes.length; i++) {
          const mb = mailboxes[i];
          if (mb.x < minX || mb.x > maxX) continue;
          ctx.save();
          ctx.translate(mb.x, mb.y);
          if (mb.delivered) ctx.drawImage(Sprites.goldGlow, -56, -90, 112, 112);

          ctx.fillStyle = '#9a714a';
          ctx.strokeStyle = INK;
          ctx.lineWidth = 2;
          ctx.fillRect(-5, -34, 10, 38);
          ctx.strokeRect(-5, -34, 10, 38);

          const sway = Math.sin(simTime * 3.4 + mb.phase) * 6;
          ctx.fillStyle = mb.delivered ? '#fff7dc' : '#f5efe0';
          ctx.beginPath();
          ctx.moveTo(0, -68);
          ctx.quadraticCurveTo(22 + sway, -58, 16 + sway * 0.7, -42);
          ctx.lineTo(0, -45);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          ctx.beginPath(); ctx.moveTo(0, -34); ctx.lineTo(0, -72); ctx.stroke();

          ctx.fillStyle = '#f6ebd2';
          ctx.beginPath(); ctx.roundRect(-18, -50, 36, 22, [11, 11, 4, 4]); ctx.fill(); ctx.stroke();
          ctx.fillStyle = mb.col; ctx.fillRect(-17, -38, 34, 6);
          ctx.fillStyle = '#4e3f32'; ctx.fillRect(-10, -45, 20, 3.5);

          ctx.save();
          ctx.translate(16, -42);
          ctx.rotate(lerp(1.2, 0, mb.flag));
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -18); ctx.stroke();
          ctx.fillStyle = mb.col;
          ctx.fillRect(0, -18, 10, 7);
          ctx.strokeRect(0, -18, 10, 7);
          ctx.restore();
          ctx.restore();
        }
      }

      function drawPaperPlanes(alpha, camX) {
        const minX = camX - 220;
        const maxX = camX + viewW + 220;
        for (let i = 0; i < paperPlanes.length; i++) {
          const pl = paperPlanes[i];
          if (pl.state === 'delivered') continue;
          const px = lerp(pl.prevX, pl.x, alpha);
          const py = lerp(pl.prevY, pl.y, alpha);
          if (px < minX || px > maxX) continue;

          if (pl.trailCount > 1) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 252, 240, 0.72)';
            ctx.lineWidth = 2.0;
            ctx.setLineDash([6, 7]);
            ctx.beginPath();
            ctx.moveTo(pl.trailX[0], pl.trailY[0]);
            for (let t = 1; t < pl.trailCount; t++) ctx.lineTo(pl.trailX[t], pl.trailY[t]);
            ctx.lineTo(px, py);
            ctx.stroke();
            ctx.restore();
          }

          if (pl.state === 'idle') {
            const by = py - 34 + Math.sin(simTime * 3 + pl.bob) * 4;
            ctx.save();
            ctx.translate(px, by);
            ctx.fillStyle = 'rgba(255, 252, 244, 0.92)';
            ctx.strokeStyle = pl.col;
            ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.roundRect(-12, -9, 24, 16, 4); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-11, -8); ctx.lineTo(0, 1); ctx.lineTo(11, -8); ctx.stroke();
            ctx.restore();
          }

          const nearP = Math.abs(player.x - px) < 250 && Math.abs(player.y - py) < 210;
          if (pl.state === 'flying' || nearP) {
            const mb = mailboxes[pl.targetId];
            const dx = mb.x - px;
            const dy = (mb.y - 42) - py;
            if (dx * dx + dy * dy > 85 * 85) {
              const ang = Math.atan2(dy, dx);
              ctx.save();
              ctx.translate(px + Math.cos(ang) * 34, py + Math.sin(ang) * 34);
              ctx.rotate(ang);
              ctx.fillStyle = pl.col;
              ctx.strokeStyle = '#fffdf6';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(10, 0); ctx.lineTo(-4, -6); ctx.lineTo(-1, 0); ctx.lineTo(-4, 6);
              ctx.closePath(); ctx.fill(); ctx.stroke();
              ctx.restore();
            }
          }

          ctx.save();
          ctx.translate(px, py + (pl.state === 'idle' ? Math.sin(simTime * 2.5 + pl.bob) * 2 : 0));
          ctx.rotate(pl.angle);
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.8;
          ctx.lineJoin = 'round';
          ctx.fillStyle = '#fffdf7';
          ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-14, -10); ctx.lineTo(-9, 1); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.fillStyle = pl.col;
          ctx.beginPath(); ctx.moveTo(18, 0); ctx.lineTo(-9, 1); ctx.lineTo(-13, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      }

      function drawCloudLinks(minX, maxX) {
        if (cloudLinks.length === 0) return;
        ctx.save();
        ctx.lineCap = 'round';
        ctx.setLineDash([7, 9]);
        ctx.lineDashOffset = -simTime * 26;
        ctx.lineWidth = 2.0;
        for (let i = 0; i < cloudLinks.length; i++) {
          const lnk = cloudLinks[i];
          if (lnk.a.x < minX && lnk.b.x < minX) continue;
          if (lnk.a.x > maxX && lnk.b.x > maxX) continue;
          const ax = lnk.a.x, ay = lnk.a.y + lnk.a.offsetY;
          const bx = lnk.b.x, by = lnk.b.y + lnk.b.offsetY;
          ctx.strokeStyle = `rgba(255, 250, 232, ${(lnk.alpha * 0.62).toFixed(2)})`;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.quadraticCurveTo((ax + bx) * 0.5, (ay + by) * 0.5 - 12 * Math.sin(simTime * 2.4 + i), bx, by);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBouncyClouds(alpha, minX, maxX) {
        for (let i = 0; i < bouncyClouds.length; i++) {
          const c = bouncyClouds[i];
          const cx = lerp(c.prevX, c.x, alpha);
          if (cx + c.r * 2 < minX || cx - c.r * 2 > maxX) continue;
          const cy = lerp(c.prevY, c.y, alpha);
          const offY = lerp(c.prevOffsetY, c.offsetY, alpha);
          const sq = lerp(c.prevSquash, c.squash, alpha);
          const bob = Math.sin(simTime * 1.7 + c.bobPhase) * 3.2;

          const scaleY = clamp(1 + sq, 0.68, 1.35);
          const scaleX = 1 / Math.sqrt(scaleY);
          const spr = c.tier <= 1 ? Sprites.cloudT1 : (c.tier === 2 ? Sprites.cloudT2 : Sprites.cloudT3);
          const growRatio = c.r / cloudRadiusForTier(c.tier);

          ctx.save();
          ctx.translate(cx, cy + offY + bob);
          if (c.tier >= 3 || c.glow > 0.04) {
            ctx.globalAlpha = c.tier >= 3 ? (0.45 + c.glow * 0.35) : c.glow * 0.42;
            const gSize = c.r * 3.0;
            ctx.drawImage(Sprites.goldGlow, -gSize * 0.5, -gSize * 0.5, gSize, gSize);
            ctx.globalAlpha = 1;
          }
          ctx.scale(scaleX * growRatio, scaleY * growRatio);
          ctx.drawImage(spr, -spr.width * 0.5, -spr.height * 0.56);
          ctx.restore();
        }
      }

      // 地形仅绘制视锥范围 [camX - 100, camX + viewW + 100] 内的顶点
      function drawTerrain(camX) {
        const startX = Math.max(0, Math.floor((camX - 100) / 20) * 20);
        const endX = Math.min(WORLD_W, Math.ceil((camX + viewW + 100) / 20) * 20);

        ctx.fillStyle = '#b98c62';
        ctx.beginPath();
        ctx.moveTo(startX, WORLD_H + 60);
        for (let x = startX; x <= endX; x += 20) ctx.lineTo(x, getGroundY(x));
        ctx.lineTo(endX, WORLD_H + 60);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#9c714c';
        ctx.beginPath();
        ctx.moveTo(startX, WORLD_H + 60);
        for (let x = startX; x <= endX; x += 24) ctx.lineTo(x, getGroundY(x) + 88 + Math.sin(x * 0.015) * 14);
        ctx.lineTo(endX, WORLD_H + 60);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#7bb454';
        ctx.beginPath();
        for (let x = startX; x <= endX; x += 20) {
          const y = getGroundY(x);
          if (x === startX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        for (let x = endX; x >= startX; x -= 20) {
          ctx.lineTo(x, getGroundY(x) + 28 + Math.sin(x * 0.036) * 5);
        }
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = 'rgba(61, 51, 43, 0.72)';
        ctx.lineWidth = 2.1;
        ctx.beginPath();
        for (let x = startX; x <= endX; x += 18) {
          const y = getGroundY(x);
          if (x === startX) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      function drawFences(minX, maxX) {
        ctx.fillStyle = '#c59d6e';
        ctx.strokeStyle = 'rgba(61, 51, 43, 0.74)';
        ctx.lineWidth = 1.6;
        for (let i = 0; i < fences.length; i++) {
          const f = fences[i];
          if (f.x + f.posts * f.gap < minX || f.x > maxX) continue;
          const x0 = f.x;
          const x1 = f.x + (f.posts - 1) * f.gap;
          const y0 = getGroundY(x0);
          const y1 = getGroundY(x1);
          ctx.beginPath();
          ctx.moveTo(x0 - 4, y0 - 19); ctx.lineTo(x1 + 4, y1 - 19);
          ctx.moveTo(x0 - 4, y0 - 10); ctx.lineTo(x1 + 4, y1 - 10);
          ctx.stroke();
          for (let p = 0; p < f.posts; p++) {
            const px = f.x + p * f.gap;
            const py = getGroundY(px);
            ctx.fillRect(px - 3, py - 26, 6, 28);
            ctx.strokeRect(px - 3, py - 26, 6, 28);
          }
        }
      }

      function drawIslands(minX, maxX) {
        for (let i = 0; i < islands.length; i++) {
          const isl = islands[i];
          if (isl.cx + isl.halfW < minX || isl.cx - isl.halfW > maxX) continue;
          sampleWind(isl.cx, isl.y + isl.depth, simTime, _qWind);
          const sway = clamp(_qWind.vx * 0.06, -16, 16);

          ctx.strokeStyle = '#5c9347';
          ctx.lineWidth = 2.1;
          ctx.beginPath();
          for (let vi = 0; vi < isl.vines.length; vi++) {
            const vx = isl.cx + isl.vines[vi];
            const vy = isl.y + isl.depth * 0.68;
            const len = 34 + (vi % 3) * 14;
            ctx.moveTo(vx, vy);
            ctx.quadraticCurveTo(vx + sway * 0.6, vy + len * 0.55, vx + sway + Math.sin(simTime * 2 + vi) * 4, vy + len);
          }
          ctx.stroke();

          ctx.fillStyle = '#b4875e';
          ctx.strokeStyle = 'rgba(61, 51, 43, 0.8)';
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(isl.cx - isl.halfW, isl.y + isl.curve);
          ctx.quadraticCurveTo(isl.cx - isl.halfW * 0.6, isl.y + isl.depth, isl.cx, isl.y + isl.depth * 1.05);
          ctx.quadraticCurveTo(isl.cx + isl.halfW * 0.6, isl.y + isl.depth, isl.cx + isl.halfW, isl.y + isl.curve);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#7bb454';
          ctx.beginPath();
          for (let s = -10; s <= 10; s++) {
            const x = isl.cx + (s / 10) * isl.halfW;
            const y = getIslandSurfaceY(isl, x);
            if (s === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          for (let s = 10; s >= -10; s--) {
            const x = isl.cx + (s / 10) * isl.halfW;
            ctx.lineTo(x, getIslandSurfaceY(isl, x) + 22 + Math.sin(s * 1.4) * 4);
          }
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          for (let s = -10; s <= 10; s++) {
            const x = isl.cx + (s / 10) * isl.halfW;
            const y = getIslandSurfaceY(isl, x);
            if (s === -10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
      }

      // 160 簇手绘水彩草丛：每渲染帧更新一次视锥内风弯，严格合并为 3 次批量绘制！
      function updateAndDrawGrassBatched(frameDt, minX, maxX) {
        const smooth = 1 - Math.exp(-8.5 * frameDt);
        const pfY = player.y + 18;

        // 1) 更新视锥内草丛平滑风弯
        for (let i = 0; i < grassTufts.length; i++) {
          const c = grassTufts[i];
          if (c.x < minX || c.x > maxX) continue;
          sampleWind(c.x, c.y - 12, simTime, _qWind);
          let push = 0;
          const dx = c.x - player.x;
          if (Math.abs(dx) < 36 && Math.abs(c.y - pfY) < 36) {
            push = (dx >= 0 ? 1 : -1) * (1 - Math.abs(dx) / 36) * 0.88;
          }
          const target = clamp(Math.atan2(_qWind.vx, 200) + push, -1.02, 1.02);
          c.angle += (target - c.angle) * smooth;
        }

        ctx.lineCap = 'round';

        // 批次 1：后层深绿微弯草叶（1 次 stroke）
        ctx.strokeStyle = '#4e8839';
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        for (let i = 0; i < grassTufts.length; i++) {
          const c = grassTufts[i];
          if (c.x < minX || c.x > maxX) continue;
          const a = c.angle + c.lean0;
          const bx = c.x - 3.5;
          const by = c.y;
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(
            bx + Math.sin(a * 0.45) * c.h0 * 0.56, by - Math.cos(a * 0.45) * c.h0 * 0.56,
            bx + Math.sin(a) * c.h0, by - Math.cos(a) * c.h0
          );
        }
        ctx.stroke();

        // 批次 2：前层嫩绿错落草叶（1 次 stroke）
        ctx.strokeStyle = '#6eab4b';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        for (let i = 0; i < grassTufts.length; i++) {
          const c = grassTufts[i];
          if (c.x < minX || c.x > maxX) continue;
          const a1 = c.angle + c.lean1;
          ctx.moveTo(c.x, c.y);
          ctx.quadraticCurveTo(
            c.x + Math.sin(a1 * 0.45) * c.h1 * 0.56, c.y - Math.cos(a1 * 0.45) * c.h1 * 0.56,
            c.x + Math.sin(a1) * c.h1, c.y - Math.cos(a1) * c.h1
          );
          const a2 = c.angle + c.lean2;
          const bx2 = c.x + 3.8;
          ctx.moveTo(bx2, c.y);
          ctx.quadraticCurveTo(
            bx2 + Math.sin(a2 * 0.45) * c.h2 * 0.56, c.y - Math.cos(a2 * 0.45) * c.h2 * 0.56,
            bx2 + Math.sin(a2) * c.h2, c.y - Math.cos(a2) * c.h2
          );
        }
        ctx.stroke();

        // 批次 3：暖阳小野花圆点（1 次 fill）
        ctx.fillStyle = '#fff2a8';
        ctx.beginPath();
        for (let i = 0; i < grassTufts.length; i++) {
          const c = grassTufts[i];
          if (!c.hasFlower || c.x < minX || c.x > maxX) continue;
          const a1 = c.angle + c.lean1;
          const fx = c.x + Math.sin(a1) * c.h1;
          const fy = c.y - Math.cos(a1) * c.h1;
          ctx.moveTo(fx + 3.2, fy);
          ctx.arc(fx, fy, 3.2, 0, Math.PI * 2);
        }
        ctx.fill();
      }

      function drawWindmills(minX, maxX) {
        for (let i = 0; i < windmills.length; i++) {
          const wm = windmills[i];
          if (wm.x < minX || wm.x > maxX) continue;
          const hubY = wm.baseY - wm.towerH + 14;

          ctx.save();
          if (wm.glow > 0.01 || wm.charge > 0.05) {
            ctx.globalAlpha = wm.glow * 0.7 + wm.charge * 0.28;
            const gSize = 152 + wm.glow * 56;
            ctx.drawImage(Sprites.goldGlow, wm.x - gSize * 0.5, hubY - gSize * 0.5, gSize, gSize);
            ctx.globalAlpha = 1;
          }

          ctx.fillStyle = wm.awakened ? '#f9efd6' : '#ece0c6';
          ctx.strokeStyle = INK;
          ctx.lineWidth = 2.0;
          ctx.beginPath();
          ctx.moveTo(wm.x - 28, wm.baseY + 4);
          ctx.lineTo(wm.x - 16, wm.baseY - wm.towerH + 16);
          ctx.lineTo(wm.x + 16, wm.baseY - wm.towerH + 16);
          ctx.lineTo(wm.x + 28, wm.baseY + 4);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#cf6d53';
          ctx.beginPath();
          ctx.moveTo(wm.x - 22, wm.baseY - wm.towerH + 18);
          ctx.lineTo(wm.x, wm.baseY - wm.towerH - 16);
          ctx.lineTo(wm.x + 22, wm.baseY - wm.towerH + 18);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = wm.awakened ? '#ffdc78' : '#7b6a58';
          ctx.beginPath();
          ctx.arc(wm.x, wm.baseY - wm.towerH * 0.45, 7, Math.PI, 0);
          ctx.lineTo(wm.x + 7, wm.baseY - wm.towerH * 0.45 + 11);
          ctx.lineTo(wm.x - 7, wm.baseY - wm.towerH * 0.45 + 11);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          if (!wm.awakened && wm.charge > 0.02) {
            ctx.strokeStyle = '#e69d2c';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(wm.x, hubY, 22, -1.5708, -1.5708 + wm.charge * 6.2832);
            ctx.stroke();
          }

          ctx.translate(wm.x, hubY);
          ctx.rotate(wm.angle);
          for (let b = 0; b < 4; b++) {
            ctx.rotate(1.5708);
            ctx.fillStyle = wm.awakened ? '#fff6d6' : '#faf2df';
            ctx.strokeStyle = INK;
            ctx.lineWidth = 1.8;
            ctx.beginPath();
            ctx.moveTo(4, -14); ctx.lineTo(22, -16); ctx.lineTo(19, -wm.bladeLen); ctx.lineTo(4, -wm.bladeLen + 3);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.strokeStyle = '#8b6240';
            ctx.lineWidth = 3.0;
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -wm.bladeLen - 4); ctx.stroke();
          }
          ctx.fillStyle = wm.awakened ? '#f2b844' : '#a87d52';
          ctx.strokeStyle = INK;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.restore();
        }
      }

      function drawChimes(minX, maxX) {
        for (let i = 0; i < chimes.length; i++) {
          const c = chimes[i];
          if (c.x < minX || c.x > maxX) continue;
          ctx.save();
          ctx.translate(c.x, c.y);

          if (c.glow > 0.02) {
            ctx.globalAlpha = c.glow * 0.68;
            ctx.drawImage(Sprites.goldGlow, -46, -46, 92, 92);
            ctx.globalAlpha = 1;
            ctx.strokeStyle = `rgba(255, 240, 178, ${(c.glow * 0.82).toFixed(2)})`;
            ctx.lineWidth = 2.4;
            ctx.beginPath();
            ctx.arc(0, 0, 18 + (1 - c.glow) * 46, 0, Math.PI * 2);
            ctx.stroke();
          }

          ctx.rotate(c.sway);
          ctx.strokeStyle = INK;
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, -10); ctx.stroke();

          ctx.fillStyle = c.col;
          ctx.beginPath();
          ctx.arc(0, -2, 10, Math.PI, 0);
          ctx.lineTo(11, 5); ctx.lineTo(-11, 5);
          ctx.closePath();
          ctx.fill(); ctx.stroke();

          ctx.fillStyle = '#fff9ea';
          ctx.fillRect(-4, 9, 8, 17);
          ctx.strokeRect(-4, 9, 8, 17);
          ctx.restore();
        }
      }

      /* =====================================================================
         12. 零闪烁 6 层连续角色绘制 + 三点法线平滑 12 节零拉伸长围巾
         ===================================================================== */
      const _sPts = Array.from({ length: SCARF_NODES }, () => ({ x: 0, y: 0 }));
      const _sRawN = Array.from({ length: SCARF_NODES }, () => ({ x: 0, y: -1 }));
      const _sL = Array.from({ length: SCARF_NODES }, () => ({ x: 0, y: 0 }));
      const _sR = Array.from({ length: SCARF_NODES }, () => ({ x: 0, y: 0 }));

      function drawPlayerAndScarf(alpha) {
        const px = lerp(player.prevX, player.x, alpha);
        const py = lerp(player.prevY, player.y, alpha);
        const g = lerp(player.prevGlideBlend, player.glideBlend, alpha);
        const air = lerp(player.prevAirBlend, player.airBlend, alpha);
        const billow = lerp(player.prevCloakBillow, player.cloakBillow, alpha);
        const tilt = lerp(player.prevBodyTilt, player.bodyTilt, alpha);
        const vf = lerp(player.prevVisualFacing, player.visualFacing, alpha);
        const dir = vf >= 0 ? 1 : -1;
        const runP = lerp(player.prevRunPhase, player.runPhase, alpha);

        for (let i = 0; i < player.puffs.length; i++) {
          const pf = player.puffs[i];
          ctx.strokeStyle = `rgba(255, 252, 238, ${pf.a.toFixed(2)})`;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(pf.x, pf.y, pf.r, pf.r * 0.42, 0, 0, Math.PI * 2);
          ctx.stroke();
        }

        // LAYER 1: 后背连续斗篷 / 滑翔穹顶（无任何 if(isGliding) 分支）
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(tilt);
        const flutter = Math.sin(simTime * 11) * (1.2 + billow * 2.2) * (0.3 + air * 0.7);
        const wingSpan = lerp(11 + billow * 3, 36 + billow * 2.5, g);
        const wingLift = lerp(15 - air * 3, -18, g) + flutter * 0.35;
        const domeY = lerp(-8, -33 - billow * 2, g);
        const hemY = lerp(16, -2, g) + flutter * 0.25;

        ctx.fillStyle = '#d7e6d4';
        ctx.beginPath();
        ctx.moveTo(-wingSpan * 0.92, wingLift + 3);
        ctx.quadraticCurveTo(0, domeY + 8, wingSpan * 0.92, wingLift + 3);
        ctx.quadraticCurveTo(0, hemY + 3, -wingSpan * 0.92, wingLift + 3);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#4e8a7c';
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(-7, -9);
        ctx.quadraticCurveTo(-wingSpan * 0.65, domeY, -wingSpan, wingLift);
        ctx.quadraticCurveTo(0, hemY, wingSpan, wingLift);
        ctx.quadraticCurveTo(wingSpan * 0.65, domeY, 7, -9);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = `rgba(61, 51, 43, ${(0.22 + g * 0.35).toFixed(2)})`;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(0, -10);
        ctx.quadraticCurveTo(0, lerp(4, -20, g), 0, hemY - 2);
        ctx.stroke();

        // LAYER 2: 双腿
        const walkAmp = (1 - air) * clamp(Math.abs(player.vx) / 210, 0, 1) * (1 - g);
        const swing = Math.sin(runP) * 7 * walkAmp;
        const legBottom = lerp(22, 15, g);
        const legTrail = -dir * lerp(0, 6, Math.max(g, air * 0.45));

        ctx.strokeStyle = INK;
        ctx.lineWidth = 3.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-3.2, 8); ctx.lineTo(-3.2 + swing + legTrail, legBottom);
        ctx.moveTo(3.2, 8); ctx.lineTo(3.2 - swing + legTrail, legBottom);
        ctx.stroke();

        // LAYER 3: 短袍与双臂
        ctx.fillStyle = '#f5eedb';
        ctx.lineWidth = 2.0;
        ctx.beginPath();
        ctx.moveTo(-7, -9); ctx.lineTo(7, -9); ctx.lineTo(9.5, 11);
        ctx.quadraticCurveTo(0, 13.5, -9.5, 11);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        const armX = lerp(9, 17.5, g);
        const armY = lerp(3 - air * 3, -11.5, g);
        ctx.lineWidth = 2.4;
        ctx.beginPath();
        ctx.moveTo(-6, -5); ctx.lineTo(-armX, armY);
        ctx.moveTo(6, -5); ctx.lineTo(armX, armY);
        ctx.stroke();
        ctx.restore();

        // LAYER 4: 12 节零拉伸珊瑚红长围巾 + 三点平滑法线 + 金色风力能量丝
        drawScarfRibbon(alpha, px, py, tilt, vf);

        // LAYER 5 & 6: 头部与宽檐草帽 + 前襟领扣
        ctx.save();
        ctx.translate(px, py);
        ctx.rotate(tilt);

        ctx.fillStyle = '#f9e0c4';
        ctx.strokeStyle = INK;
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, -14.5, 7.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

        ctx.fillStyle = INK;
        ctx.beginPath(); ctx.arc(dir * 2.8, -14.5, 1.35, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#e7c57c';
        ctx.beginPath(); ctx.ellipse(0, -19.5, 15.5, 4.4, dir * -0.06, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.beginPath(); ctx.arc(0, -19.5, 8.2, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();

        ctx.strokeStyle = '#cf5e4a';
        ctx.lineWidth = 2.3;
        ctx.beginPath(); ctx.moveTo(-7.6, -19.8); ctx.lineTo(7.6, -19.8); ctx.stroke();

        ctx.fillStyle = '#e15c48';
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.ellipse(0, -8.8, 7.4, 3.2, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#f6d167';
        ctx.beginPath(); ctx.arc(dir * 2.2, -8.5, 2.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      function drawScarfRibbon(alpha, px, py, tilt, vf) {
        getNeckWorldPos(px, py, tilt, vf, _neckTmp);
        _sPts[0].x = _neckTmp.x;
        _sPts[0].y = _neckTmp.y;
        for (let i = 1; i < SCARF_NODES; i++) {
          _sPts[i].x = lerp(scarf[i].px, scarf[i].x, alpha);
          _sPts[i].y = lerp(scarf[i].py, scarf[i].y, alpha);
        }

        // 渲染子帧插值后再做一次极快单遍根到梢定长投影，确保视觉上绝对恒定 77px！
        for (let i = 0; i < SCARF_NODES - 1; i++) {
          const a = _sPts[i], b = _sPts[i + 1];
          const dx = b.x - a.x, dy = b.y - a.y;
          const d = Math.hypot(dx, dy);
          if (d > 0.0001) {
            const sc = SCARF_SEG_LEN / d;
            b.x = a.x + dx * sc;
            b.y = a.y + dy * sc;
          } else {
            b.x = a.x + scarf[i].lastDirX * SCARF_SEG_LEN;
            b.y = a.y + scarf[i].lastDirY * SCARF_SEG_LEN;
          }
        }

        // 切线记忆 + 原始法线
        for (let i = 0; i < SCARF_NODES; i++) {
          const prev = _sPts[i > 0 ? i - 1 : 0];
          const next = _sPts[i < SCARF_NODES - 1 ? i + 1 : SCARF_NODES - 1];
          let tx = next.x - prev.x;
          let ty = next.y - prev.y;
          const len = Math.hypot(tx, ty);
          const node = scarf[i];
          if (len > 0.01) {
            tx /= len; ty /= len;
            if (tx * node.lastDirX + ty * node.lastDirY < -0.45) {
              tx = lerp(node.lastDirX, tx, 0.25);
              ty = lerp(node.lastDirY, ty, 0.25);
              const l2 = Math.hypot(tx, ty) || 1;
              tx /= l2; ty /= l2;
            }
            node.lastDirX = tx;
            node.lastDirY = ty;
          } else {
            tx = node.lastDirX; ty = node.lastDirY;
          }
          _sRawN[i].x = -ty;
          _sRawN[i].y = tx;
        }

        // 三点加权法线平滑（彻底避免急转弯拧麻花/翻转）
        for (let i = 0; i < SCARF_NODES; i++) {
          const n0 = _sRawN[i > 0 ? i - 1 : 0];
          const n1 = _sRawN[i];
          const n2 = _sRawN[i < SCARF_NODES - 1 ? i + 1 : SCARF_NODES - 1];
          let nx = n0.x * 0.25 + n1.x * 0.5 + n2.x * 0.25;
          let ny = n0.y * 0.25 + n1.y * 0.5 + n2.y * 0.25;
          const nl = Math.hypot(nx, ny) || 1;
          nx /= nl; ny /= nl;
          const hw = scarfHalfWidth(i);
          _sL[i].x = _sPts[i].x + nx * hw;
          _sL[i].y = _sPts[i].y + ny * hw;
          _sR[i].x = _sPts[i].x - nx * hw;
          _sR[i].y = _sPts[i].y - ny * hw;
        }

        ctx.fillStyle = '#e15c48';
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.7;
        ctx.lineJoin = 'round';
        ctx.beginPath();
        ctx.moveTo(_sL[0].x, _sL[0].y);
        for (let i = 1; i < SCARF_NODES - 1; i++) {
          ctx.quadraticCurveTo(_sL[i].x, _sL[i].y, (_sL[i].x + _sL[i + 1].x) * 0.5, (_sL[i].y + _sL[i + 1].y) * 0.5);
        }
        ctx.lineTo(_sL[SCARF_NODES - 1].x, _sL[SCARF_NODES - 1].y);
        ctx.lineTo(_sR[SCARF_NODES - 1].x, _sR[SCARF_NODES - 1].y);
        for (let i = SCARF_NODES - 2; i > 0; i--) {
          ctx.quadraticCurveTo(_sR[i].x, _sR[i].y, (_sR[i].x + _sR[i - 1].x) * 0.5, (_sR[i].y + _sR[i - 1].y) * 0.5);
        }
        ctx.lineTo(_sR[0].x, _sR[0].y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 金色风力能量丝（双层描边替代 shadowBlur）
        const ratio = clamp(player.energy / player.maxEnergy, 0, 1);
        if (ratio > 0.04) {
          const lit = Math.max(1, Math.floor(ratio * (SCARF_NODES - 1)));
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(_sPts[0].x, _sPts[0].y);
          for (let i = 1; i <= lit; i++) {
            const p0 = _sPts[i - 1], p1 = _sPts[i];
            ctx.quadraticCurveTo(p0.x, p0.y, (p0.x + p1.x) * 0.5, (p0.y + p1.y) * 0.5);
          }
          ctx.strokeStyle = 'rgba(255, 224, 112, 0.36)';
          ctx.lineWidth = 5.0;
          ctx.stroke();
          ctx.strokeStyle = '#fff2b0';
          ctx.lineWidth = 1.9;
          ctx.stroke();
        }
      }

      // 极速单遍平滑水彩划风丝带（每条轨迹仅 2 次 stroke，彻底告别划风掉帧）
      function drawWindRibbons() {
        if (activeRibbons.length === 0) return;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (let i = 0; i < activeRibbons.length; i++) {
          const rib = activeRibbons[i];
          const pts = rib.pts;
          if (pts.length < 2) continue;
          const midAge = pts[Math.floor(pts.length * 0.5)].age;
          const remain = clamp(1 - midAge / rib.maxAge, 0, 1);
          if (remain <= 0.01) continue;
          const fade = Math.min(1, midAge * 9 + 0.25) * Math.sin(remain * 1.5708);

          // 柔和主水彩气带
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          for (let p = 1; p < pts.length - 1; p++) {
            ctx.quadraticCurveTo(pts[p].x, pts[p].y, (pts[p].x + pts[p + 1].x) * 0.5, (pts[p].y + pts[p + 1].y) * 0.5);
          }
          ctx.lineTo(pts[pts.length - 1].x, pts[pts.length - 1].y);
          ctx.strokeStyle = `rgba(218, 248, 236, ${(fade * 0.42).toFixed(2)})`;
          ctx.lineWidth = 14 * (0.5 + fade * 0.5);
          ctx.stroke();

          // 内部高光流线
          ctx.strokeStyle = `rgba(255, 253, 240, ${(fade * 0.84).toFixed(2)})`;
          ctx.lineWidth = 4.6 * (0.5 + fade * 0.5);
          ctx.stroke();
        }
      }

      // 旋风聚气：仅单次 rotate + drawImage 预烘焙旋风精灵！
      function drawVortexSprite() {
        if (vortex.alpha <= 0.02) return;
        const sc = 0.82 + vortex.alpha * 0.22;
        ctx.save();
        ctx.translate(vortex.x, vortex.y);
        ctx.rotate(vortex.spin);
        ctx.scale(sc, sc);
        ctx.globalAlpha = vortex.alpha * 0.88;
        ctx.drawImage(Sprites.vortexSwirl, -128, -128);
        ctx.restore();
      }

      function drawAmbientFloaters(minX, maxX) {
        const sprites = Sprites.particles;
        for (let i = 0; i < ambientFloaters.length; i++) {
          const p = ambientFloaters[i];
          if (p.x < minX || p.x > maxX) continue;
          const spr = sprites[p.spriteIdx];
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          const w = spr.width * p.scale;
          const h = spr.height * p.scale;
          ctx.drawImage(spr, -w * 0.5, -h * 0.5, w, h);
          ctx.restore();
        }
      }

      function drawParticlePool(minX, maxX) {
        const sprites = Sprites.particles;
        for (let i = 0; i < MAX_PARTICLES; i++) {
          const p = particlePool[i];
          if (!p.active || p.x < minX || p.x > maxX) continue;
          const life = 1 - p.age / p.maxAge;
          const spr = sprites[p.spriteIdx];
          const sc = p.scale * (0.5 + life * 0.55);
          ctx.save();
          ctx.globalAlpha = life * 0.9;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          const w = spr.width * sc;
          const h = spr.height * sc;
          ctx.drawImage(spr, -w * 0.5, -h * 0.5, w, h);
          ctx.restore();
        }
      }

      function drawFloatingTexts() {
        if (floatingTexts.length === 0) return;
        ctx.save();
        ctx.font = '700 15px "PingFang SC", "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        for (let i = 0; i < floatingTexts.length; i++) {
          const ft = floatingTexts[i];
          ctx.globalAlpha = clamp(1 - ft.age / ft.maxAge, 0, 1);
          ctx.lineWidth = 3.2;
          ctx.strokeStyle = 'rgba(255, 252, 242, 0.92)';
          ctx.strokeText(ft.text, ft.x, ft.y);
          ctx.fillStyle = ft.col;
          ctx.fillText(ft.text, ft.x, ft.y);
        }
        ctx.restore();
      }

      /* =====================================================================
         13. 锁 60 FPS 固定步长主循环（每帧最多 2 次物理子步 + 4 帧音频节流 + FPS 监视）
         ===================================================================== */
      let lastTs = 0;
      let accumulator = 0;
      let frameCount = 0;
      let fpsFrames = 0;
      let fpsTimer = 0;
      const fpsBadge = document.getElementById('fpsBadge');

      function gameLoop(ts) {
        if (!lastTs) lastTs = ts;
        const rawDt = (ts - lastTs) / 1000;
        lastTs = ts;
        const frameDt = Math.min(0.04, Math.max(0.001, rawDt));

        accumulator += frameDt;
        let substeps = 0;
        while (accumulator >= FIXED_DT && substeps < 2) {
          stepPhysics(FIXED_DT);
          accumulator -= FIXED_DT;
          substeps++;
        }
        if (accumulator > FIXED_DT * 2) accumulator = 0;

        render(clamp(accumulator / FIXED_DT, 0, 1), frameDt);

        // 每 4 帧节流更新连续风声滤波参数
        frameCount++;
        if ((frameCount & 3) === 0) {
          const relAir = Math.hypot(player.vx - _pWind.vx * 0.35, player.vy - _pWind.vy * 0.35);
          AudioSys.updateWind(relAir, player.glideBlend, pointer.energy, vortex.active);
        }

        // 轻量 FPS 指示器（每 0.35 秒更新一次 DOM，绝不每帧触碰 DOM）
        fpsFrames++;
        fpsTimer += rawDt;
        if (fpsTimer >= 0.35) {
          const fps = Math.min(144, Math.round(fpsFrames / fpsTimer));
          fpsBadge.textContent = `${fps} FPS`;
          fpsFrames = 0;
          fpsTimer = 0;
        }

        requestAnimationFrame(gameLoop);
      }

      window.addEventListener('resize', resizeCanvas);
      window.onload = function () {
        resizeCanvas();
        initSprites();
        initScarf();
        initBouncyClouds();
        initScenery();
        camera.x = camera.prevX = 0;
        camera.y = camera.prevY = clamp(player.y - viewH * 0.56, 0, Math.max(0, WORLD_H - viewH));
        showToast('左键划风、右键或按 E 旋风聚气：聚云成塔、护送纸飞机、吹散雨云唤醒向日葵！');
        setTimeout(() => {
          const kh = document.getElementById('keyHints');
          if (kh) kh.classList.add('faded');
        }, 12000);
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
