<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>月潮孤舟</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- 顶部极简状态：左拼装碎片、中海图位置、右声音开关 -->
  <header id="hud-top" class="hud-top hidden">
    <div id="parts-bar" class="parts-bar" aria-label="船体挂件与碎片进度">
      <div class="part-pill" data-type="lantern" title="船舷 · 灯火系（3份碎片升1级）">
        <span class="dot dot-lantern"></span>
        <span class="p-label">灯火</span>
        <span class="p-lv">0</span>
        <span class="p-pips"><i></i><i></i><i></i></span>
      </div>
      <div class="part-pill" data-type="gramophone" title="甲板 · 共振系（3份碎片升1级）">
        <span class="dot dot-gramophone"></span>
        <span class="p-label">共振</span>
        <span class="p-lv">0</span>
        <span class="p-pips"><i></i><i></i><i></i></span>
      </div>
      <div class="part-pill" data-type="thruster" title="船尾 · 推进系（3份碎片升1级）">
        <span class="dot dot-thruster"></span>
        <span class="p-label">推进</span>
        <span class="p-lv">0</span>
        <span class="p-pips"><i></i><i></i><i></i></span>
      </div>
      <div class="part-pill" data-type="balloon" title="桅杆 · 浮空系（3份碎片升1级）">
        <span class="dot dot-balloon"></span>
        <span class="p-label">浮空</span>
        <span class="p-lv">0</span>
        <span class="p-pips"><i></i><i></i><i></i></span>
      </div>
    </div>

    <!-- 360° 环形迷雾星图 -->
    <div id="sea-chart" class="sea-chart" aria-label="环形迷雾海图">
      <canvas id="sea-chart-canvas" class="sea-chart-canvas" width="96" height="96"></canvas>
      <div class="sea-chart-meta">
        <div id="zone-label" class="zone-label">暮光浅湾</div>
        <div id="chart-sub" class="chart-sub">探索 0% · 环海航行</div>
      </div>
    </div>

    <div class="hud-right">
      <button id="btn-mute" class="hud-btn" type="button">声景：开</button>
    </div>
  </header>

  <!-- 驶入新海域时的诗意过场浮标 -->
  <div id="zone-banner" class="zone-banner hidden">
    <div id="zone-banner-kicker" class="zone-banner-kicker"></div>
    <div id="zone-banner-title" class="zone-banner-title"></div>
    <div id="zone-banner-sub" class="zone-banner-sub"></div>
  </div>

  <!-- 一句话残骸微故事 / 组装完成提示 -->
  <div id="whisper-banner" class="whisper-banner hidden">
    <div id="whisper-title" class="whisper-title"></div>
    <div id="whisper-line" class="whisper-line"></div>
  </div>

  <!-- 底部极简键位提示 -->
  <div id="controls-tip" class="controls-tip hidden">
    A / D 环海航行（自动掠拾碎片）· 点按/空格抛钩拉动机关与摆荡 · E / 右键 释放声波共鸣 · 迎浪峰 W / Shift 完美跃浪
  </div>

  <!-- 仅在真实触屏输入时浮现的移动端按钮 -->
  <div id="touch-controls" class="touch-controls hidden">
    <div class="touch-group">
      <button id="tc-left" class="touch-btn" type="button" aria-label="向左划桨">‹</button>
      <button id="tc-right" class="touch-btn" type="button" aria-label="向右划桨">›</button>
    </div>
    <div class="touch-group">
      <button id="tc-pulse" class="touch-btn touch-pulse" type="button" aria-label="声波脉冲">音</button>
      <button id="tc-boost" class="touch-btn touch-boost hidden" type="button" aria-label="推进">火</button>
      <button id="tc-hook" class="touch-btn touch-hook" type="button" aria-label="抛钩交互">钩</button>
    </div>
  </div>

  <!-- 开篇标题遮罩 -->
  <div id="title-screen" class="overlay-screen">
    <div class="title-box">
      <div class="title-sub">MOON TIDE SKIFF</div>
      <h1>月潮孤舟</h1>
      <p class="title-poem">
        月亮越来越近了。<br />
        在无边无界的三百六十度月海里自由航行，<br />
        点亮灯塔、古钟、推月塔与观月台四座古迹，唤醒潮汐光柱。
      </p>
      <button id="btn-play" class="start-btn" type="button">解缆出海</button>
      <div class="title-hint">每收集 3 份同类碎片自动完成装船升级 · 建议开启声音</div>
    </div>
  </div>

  <!-- 结局诗意浮层 -->
  <div id="ending-screen" class="overlay-screen ending-overlay hidden">
    <div class="ending-box">
      <div id="ending-kicker" class="title-sub">潮汐终章</div>
      <h2 id="ending-title"></h2>
      <p id="ending-poem" class="title-poem"></p>
      <div id="ending-stats" class="ending-stats"></div>
      <div class="ending-actions">
        <button id="btn-continue" class="ghost-btn" type="button">继续在月海漂流</button>
        <button id="btn-replay" class="start-btn" type="button">重新启航</button>
      </div>
    </div>
  </div>

  <script defer src="js/config.js"></script>
  <script defer src="js/audio.js"></script>
  <script defer src="js/world.js"></script>
  <script defer src="js/boat.js"></script>
  <script defer src="js/renderer.js"></script>
  <script defer src="js/main.js"></script>
</body>
</html>
