<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050e20">
<script>
/* A one-time same-tab arrival handshake from the independent homepage. */
(function () {
  try {
    var key = 'cosmos-to-galaxy-v2';
    var raw = sessionStorage.getItem(key);
    var payload = raw ? JSON.parse(raw) : null;
    sessionStorage.removeItem(key);
    if (payload && payload.version === 2 && payload.origin === location.origin &&
        Date.now() - payload.time >= 0 && Date.now() - payload.time < 45000) {
      document.documentElement.classList.add('cosmos-arrival');
      window.setTimeout(function () {
        document.documentElement.classList.add('cosmos-arrival-ready');
      }, 8000);
    }
  } catch (error) {
    /* Direct entry or blocked storage remains a normal, usable galaxy page. */
  }
})();
</script>

<title>星海漫游 · Yixuanqi 的创造宇宙</title>
<meta name="description" content="走进一片真实可漫游的 3D 星海，每颗作品星球都通往一个可以探索的世界。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #030714;
  --ink: #f6e9d2;
  --mute: #b8c8d4;
  --gold: #ecc68c;
  --line: rgba(196, 220, 236, 0.24);
  --pane: rgba(8, 17, 36, 0.66);
  --scroll-thumb: rgba(196, 212, 224, 0.36);
  --scroll-thumb-hover: rgba(236, 198, 140, 0.72);
}

:root[data-theme="paper"] {
  --bg: #263c5a;
  --ink: #fff2de;
  --mute: #e4d6c8;
  --gold: #ffd096;
  --line: rgba(246, 224, 192, 0.34);
  --pane: rgba(18, 34, 58, 0.62);
  --scroll-thumb: rgba(245, 215, 176, 0.42);
  --scroll-thumb-hover: rgba(255, 220, 172, 0.78);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: radial-gradient(ellipse 68% 72% at 52% 48%, #0a1632 0%, #040919 52%, #02050d 100%);
  color: var(--ink);
  font-family: 'Noto Serif SC', Georgia, serif;
  transition: background 0.6s ease;
  user-select: none;
  -webkit-user-select: none;
}

:root[data-theme="paper"] body {
  background:
    radial-gradient(ellipse 56% 68% at 62% 32%, rgba(214, 148, 128, 0.34), transparent 76%),
    radial-gradient(ellipse 62% 72% at 18% 72%, rgba(68, 122, 152, 0.42), transparent 76%),
    linear-gradient(148deg, #1a2d4c 0%, #375172 42%, #6b647d 74%, #9e7d79 100%);
}

button, a { font: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

#scene { position: fixed; inset: 0; touch-action: none; z-index: 0; }
#scene canvas { width: 100%; height: 100%; display: block; cursor: grab; }
#scene canvas:active { cursor: grabbing; }
#scene canvas.planet-hover { cursor: pointer; }

#vignette, #frame { position: fixed; pointer-events: none; inset: 0; }
#vignette {
  z-index: 2;
  background: radial-gradient(ellipse 76% 78% at 50% 50%, transparent 40%, rgba(1, 4, 12, 0.42) 100%);
}
:root[data-theme="paper"] #vignette {
  background: radial-gradient(ellipse 76% 78% at 50% 50%, transparent 38%, rgba(12, 22, 38, 0.24) 100%);
}

#frame {
  z-index: 7;
  inset: 13px;
  border: 1px solid var(--line);
  border-radius: 14px 90px 14px 90px / 90px 14px 90px 14px;
  opacity: 0.30;
}
#frame:before {
  content: '';
  position: absolute;
  inset: 5px;
  border: 1px dashed var(--line);
  border-radius: 90px 14px 90px 14px / 14px 90px 14px 90px;
}

/* Top Navigation */
.top {
  position: fixed;
  right: 24px;
  top: 21px;
  z-index: 30;
  display: flex;
  justify-content: flex-end;
  pointer-events: none;
}
.top > * { pointer-events: auto; }
.nav { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }

.btn {
  border: 1px solid var(--line);
  border-radius: 16px 5px 15px 5px / 5px 16px 5px 16px;
  background: var(--pane);
  color: rgba(248, 236, 218, 0.90);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 500;
  backdrop-filter: blur(13px);
  -webkit-backdrop-filter: blur(13px);
  white-space: nowrap;
  transition: transform 0.18s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
}
.btn:hover {
  transform: translateY(-1px);
  background: rgba(56, 86, 122, 0.62);
  border-color: var(--gold);
  color: #fff6e6;
}
.btn.active {
  border-color: var(--gold);
  background: rgba(206, 160, 96, 0.24);
  color: #fff3da;
}

/* Floating Planet Labels (Anchored below planet rim with spring anti-collision) */
#labels { position: fixed; inset: 0; pointer-events: none; z-index: 12; }
.label {
  position: absolute;
  top: 0;
  left: 0;
  pointer-events: auto;
  transform: translate3d(-50%, 0, 0);
  border: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  text-align: center;
  min-width: 86px;
  will-change: transform, opacity;
  transition: opacity 0.26s ease;
  filter: drop-shadow(0 3px 10px rgba(0, 6, 18, 0.55));
}
.label:before {
  content: '';
  height: 12px;
  border-left: 1px dashed rgba(236, 198, 140, 0.68);
  display: block;
  width: 0;
  margin: 0 auto 2px;
  transition: height 0.2s ease, border-color 0.2s ease;
}
.label strong {
  display: block;
  padding: 5px 10px;
  background: rgba(8, 20, 40, 0.72);
  border: 1px solid rgba(202, 222, 236, 0.30);
  border-radius: 10px 3px 9px 3px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.03em;
  color: #ffeccf;
  white-space: nowrap;
  box-shadow: 0 4px 14px rgba(0, 8, 24, 0.35);
  transition: border-color 0.2s ease, background 0.2s ease, color 0.2s ease, transform 0.2s ease;
}
:root[data-theme="paper"] .label strong {
  background: rgba(20, 39, 64, 0.70);
  border-color: rgba(252, 222, 186, 0.40);
  color: #fff1d6;
}
.label small {
  display: block;
  font: 12.5px/1.2 'Caveat', cursive;
  letter-spacing: 0.06em;
  color: var(--gold);
  opacity: 0.88;
  padding-top: 3px;
}
.label:hover strong,
.label.hovered strong,
.label.selected strong {
  border-color: var(--gold);
  background: rgba(18, 36, 66, 0.88);
  color: #ffe3b0;
  transform: translateY(-1px);
}
.label.selected:before,
.label.hovered:before {
  border-left-color: #ffe2ad;
  height: 15px;
}
.label.hidden { opacity: 0 !important; pointer-events: none !important; }

/* Bottom Controls */
.bottom {
  position: fixed;
  z-index: 26;
  bottom: 24px;
  right: 25px;
  display: flex;
  align-items: flex-end;
  justify-content: flex-end;
  pointer-events: none;
}
.bottom > * { pointer-events: auto; }
.controls {
  display: flex;
  gap: 4px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  background: var(--pane);
  border: 1px solid var(--line);
  padding: 5px 8px;
  border-radius: 14px 40px 14px 40px / 40px 14px 40px 14px;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.controls .btn {
  border-color: transparent;
  background: transparent;
  padding: 7px 10px;
  font-size: 11px;
}
.controls .btn:hover,
.controls .btn.active {
  border-color: var(--line);
  background: rgba(208, 162, 102, 0.20);
}
.controls label {
  font-size: 11px;
  color: rgba(246, 232, 212, 0.82);
  white-space: nowrap;
  padding: 0 4px;
}
.controls input {
  width: 72px;
  accent-color: var(--gold);
  vertical-align: middle;
  cursor: pointer;
}

/* Planet Dossier Card */
.card {
  position: fixed;
  z-index: 37;
  right: 32px;
  top: 90px;
  bottom: 92px;
  width: min(348px, calc(100vw - 64px));
  padding: 19px;
  background: var(--pane);
  border: 1px solid var(--line);
  border-radius: 34px 8px 34px 8px / 8px 34px 8px 34px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  box-shadow: 0 16px 42px rgba(0, 6, 20, 0.42), 2px 4px 0 rgba(16, 26, 48, 0.25);
  opacity: 0;
  pointer-events: none;
  transform: translateX(calc(100% + 60px));
  transition: opacity 0.36s ease, transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
}
.card.show { opacity: 1; pointer-events: auto; transform: translateX(0); }

.card, .panel {
  overflow-x: hidden;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--scroll-thumb) transparent;
}
.card::-webkit-scrollbar, .panel::-webkit-scrollbar { width: 6px; height: 6px; }
.card::-webkit-scrollbar-track, .panel::-webkit-scrollbar-track { background: transparent; margin-block: 14px; }
.card::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb {
  background: var(--scroll-thumb);
  border-radius: 20px;
  border: 1px solid transparent;
  background-clip: padding-box;
}
.card::-webkit-scrollbar-thumb:hover, .panel::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

.card-head {
  position: sticky;
  top: -19px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px dashed var(--line);
  padding: 8px 0 11px;
  margin-top: -8px;
  background: var(--pane);
  backdrop-filter: blur(12px);
}
.card-head span { color: var(--gold); font: 17px 'Caveat', cursive; }
.close {
  background: transparent;
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 30px;
  height: 30px;
  font-size: 19px;
  line-height: 1;
  display: grid;
  place-items: center;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.close:hover { border-color: var(--gold); color: var(--gold); background: rgba(236, 198, 140, 0.12); }

.illustration {
  height: 132px;
  border: 1px solid var(--line);
  border-radius: 10px;
  margin: 15px 0 10px;
  background: radial-gradient(circle, rgba(210, 168, 108, 0.22), transparent 72%);
  display: grid;
  place-items: center;
  position: relative;
}
.illustration:before {
  content: '';
  width: 116px;
  height: 116px;
  border: 1px dashed var(--line);
  border-radius: 50%;
  position: absolute;
}
.illustration span {
  font-size: 68px;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(226, 180, 114, 0.34);
}
.card h2 { font: 28px 'Ma Shan Zheng', serif; margin: 10px 0 0; letter-spacing: 0.04em; }
.latin { font: 18px 'Caveat', cursive; color: var(--mute); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 13px 0; }
.tags span {
  font-size: 10px;
  border: 1px solid var(--line);
  color: var(--mute);
  padding: 4px 8px;
  border-radius: 6px;
}
.description { font-size: 12px; line-height: 2.05; color: #f4e6d2; }
.note {
  font-size: 11px;
  color: var(--mute);
  border-top: 1px dashed var(--line);
  padding-top: 11px;
  line-height: 1.9;
}

.card-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 18px; }
.card-actions a,
.card-actions a:link,
.card-actions a:visited {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 10px 11px;
  color: var(--ink);
  font-family: 'Noto Serif SC', Georgia, serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-decoration: none;
  border: 1px solid var(--line);
  background: rgba(180, 146, 102, 0.11);
  border-radius: 14px 5px 13px 5px / 5px 14px 5px 13px;
  transition: background-color 0.2s, border-color 0.2s, transform 0.2s, color 0.2s;
}
.card-actions a.primary,
.card-actions a.primary:link,
.card-actions a.primary:visited {
  grid-column: 1 / -1;
  min-height: 48px;
  color: #fff5e2;
  border-color: rgba(236, 198, 140, 0.68);
  background: linear-gradient(145deg, rgba(220, 174, 108, 0.30), rgba(186, 136, 76, 0.14));
  font-size: 12px;
  font-weight: 700;
}
.card-actions a:hover,
.card-actions a:focus-visible {
  color: var(--gold);
  border-color: var(--gold);
  background: rgba(215, 170, 105, 0.20);
  transform: translateY(-1px);
}
.card-actions a.primary:hover,
.card-actions a.primary:focus-visible {
  color: #fffaf0;
  background: rgba(226, 180, 112, 0.38);
}

/* Panels (Index Drawer & Travel Journal) */
.panel {
  position: fixed;
  z-index: 45;
  background: var(--pane);
  border: 1px solid var(--line);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  pointer-events: none;
  opacity: 0;
  box-shadow: 0 16px 44px rgba(0, 6, 20, 0.42);
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease;
}
.panel.show { opacity: 1; pointer-events: auto; }
.panel header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-bottom: 13px;
  margin-bottom: 12px;
  border-bottom: 1px dashed var(--line);
}
.panel h2 { font: 26px 'Ma Shan Zheng', serif; margin: 0; }

#drawer {
  left: 28px;
  top: 86px;
  bottom: 92px;
  width: 306px;
  padding: 20px;
  border-radius: 8px 34px 8px 34px;
  transform: translateX(-340px);
}
#drawer.show { transform: translateX(0); }

.entry {
  display: flex;
  gap: 10px;
  text-align: left;
  width: 100%;
  padding: 11px 8px;
  border: 0;
  border-bottom: 1px dashed var(--line);
  background: transparent;
  color: var(--ink);
  transition: background 0.18s;
}
.entry:hover { background: rgba(196, 152, 92, 0.18); }
.entry em { font-size: 22px; color: var(--gold); width: 30px; flex: none; font-style: normal; }
.entry strong { font-size: 12px; display: block; }
.entry small { display: block; color: var(--mute); font: 15px 'Caveat', cursive; margin-top: 3px; }

#journal {
  top: 86px;
  bottom: 92px;
  left: 50%;
  width: min(710px, calc(100vw - 48px));
  padding: 24px;
  transform: translate(-50%, 24px);
  border-radius: 8px 54px 8px 54px;
}
#journal.show { transform: translate(-50%, 0); }

.posts { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
.post {
  background: rgba(186, 144, 86, 0.11);
  border: 1px solid var(--line);
  text-align: left;
  border-radius: 10px 24px 10px 24px;
  padding: 15px;
  color: var(--ink);
  transition: background 0.2s, border-color 0.2s;
}
.post:hover { background: rgba(186, 144, 86, 0.22); border-color: var(--gold); }
.post small { font: 16px 'Caveat', cursive; color: var(--gold); }
.post h3 { font-size: 14.5px; line-height: 1.55; margin: 6px 0; }
.post p { font-size: 11.5px; line-height: 1.95; color: var(--mute); margin: 0; }
.article h2 { font: 25px 'Ma Shan Zheng', serif; margin: 16px 0 12px; }
.article p { font-size: 13px; line-height: 2.1; color: #f4e6d2; }

#fail {
  display: none;
  position: fixed;
  z-index: 48;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--pane);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 22px;
  text-align: center;
  line-height: 2;
  width: min(390px, calc(100vw - 40px));
  font-size: 12px;
}
#fail.show { display: block; }

@media (max-width: 640px) {
  .top { right: 18px; top: 18px; }
  .nav .btn { font-size: 10px; padding: 7px 9px; }
  .bottom { right: 16px; left: 16px; bottom: 20px; justify-content: center; }
  .controls { padding: 4px 6px; gap: 1px; }
  .controls .btn { font-size: 10px; padding: 6px 8px; }
  .controls input { width: 52px; }
  .label strong { font-size: 10px; padding: 4px 7px; }
  .label small { display: none; }
  .card { left: 20px; right: 20px; width: auto; top: auto; bottom: 86px; max-height: 56dvh; }
  .illustration { height: 82px; }
  .illustration span { font-size: 48px; }
  .card h2 { font-size: 22px; }
  #drawer { left: 18px; top: 76px; bottom: 86px; width: min(310px, calc(100vw - 36px)); }
  #journal { top: 76px; bottom: 86px; padding: 17px; }
  .posts { grid-template-columns: 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after { transition-duration: 0.01ms !important; }
}

/* Shared black-hole portal arrival curtain from independent homepage */
#cosmos-arrival-curtain {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 2147483646;
  pointer-events: none;
  opacity: 1;
  background: radial-gradient(circle at 50% 50%, #050914 0%, #01030a 52%, #000108 100%);
}
html.cosmos-arrival #cosmos-arrival-curtain { display: block; }
#cosmos-arrival-curtain::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 24vmin;
  height: 24vmin;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 0 1px rgba(202, 228, 255, 0.22), 0 0 44px rgba(80, 161, 232, 0.21), inset 0 0 25px rgba(98, 158, 204, 0.26);
  background: radial-gradient(circle, #00030b 38%, #0b2338 57%, rgba(109, 170, 214, 0.40) 61%, transparent 69%);
  opacity: 0;
}
#cosmos-arrival-curtain::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, transparent 7%, rgba(67, 114, 155, 0.11) 21%, transparent 56%);
  opacity: 0;
}
@property --cosmos-aperture {
  syntax: "<percentage>";
  inherits: false;
  initial-value: 0%;
}
html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain {
  animation: cosmos-arrival-reveal 2.1s cubic-bezier(0.19, 0.71, 0.3, 1) forwards;
  -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 0 var(--cosmos-aperture), #000 calc(var(--cosmos-aperture) + 8%));
  mask-image: radial-gradient(circle at 50% 50%, transparent 0 var(--cosmos-aperture), #000 calc(var(--cosmos-aperture) + 8%));
}
html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain::before {
  animation: cosmos-arrival-ring 1.8s ease-out both;
}
html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain::after {
  animation: cosmos-arrival-glow 1.8s ease-out both;
}
@keyframes cosmos-arrival-reveal {
  0%   { --cosmos-aperture: 0%; opacity: 1; }
  52%  { --cosmos-aperture: 32%; opacity: 1; }
  84%  { --cosmos-aperture: 85%; opacity: 0.94; }
  100% { --cosmos-aperture: 135%; opacity: 0; visibility: hidden; }
}
@keyframes cosmos-arrival-ring {
  0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.18); }
  17%  { opacity: 0.8; }
  82%  { opacity: 0.45; }
  100% { opacity: 0; transform: translate(-50%, -50%) scale(9); }
}
@keyframes cosmos-arrival-glow {
  0%   { opacity: 0; }
  24%  { opacity: 0.85; }
  100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain {
    animation: cosmos-arrival-accessible 250ms ease-out forwards;
  }
  html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain::before,
  html.cosmos-arrival.cosmos-arrival-ready #cosmos-arrival-curtain::after {
    animation: none;
  }
}
@keyframes cosmos-arrival-accessible {
  from { opacity: 1; }
  to   { opacity: 0; visibility: hidden; }
}
</style>
</head>
<body>
<div id="cosmos-arrival-curtain" aria-hidden="true"></div>
<div id="scene"></div>
<div id="vignette"></div>
<div id="frame"></div>
<div id="labels"></div>

<header class="top">
  <nav class="nav" aria-label="星海控制">
    <button class="btn" id="home" type="button">✦ 漫游</button>
    <button class="btn" id="index" type="button">☷ 星球索引</button>
    <button class="btn" id="logs" type="button">✎ 航行日志</button>
    <button class="btn" id="palette" type="button">☾ 深空</button>
  </nav>
</header>

<div class="bottom">
  <div class="controls">
    <button class="btn active" id="pause" type="button">Ⅱ 暂停星流</button>
    <label>流速 <input id="speed" type="range" min="0" max="3" step="0.1" value="0.7"></label>
    <button class="btn" id="prev" type="button">← 上一颗</button>
    <button class="btn" id="next" type="button">下一颗 →</button>
    <button class="btn" id="reset" type="button">◎ 归位</button>
  </div>
</div>

<aside id="card" class="card" aria-label="星球作品信息">
  <div class="card-head">
    <span id="number">STAR 01 · ONLINE</span>

/* ============================================================================
 * 2. BUILT-IN SILKY DAMPED ORBIT / PAN / PINCH CONTROLLER (ZERO EXTRA CDN)
 * ============================================================================ */
function createOrbitController(cam, dom) {
  var ctrl = {
    target: new THREE.Vector3(0, 0, 0),
    enabled: true,
    dampingFactor: 0.06,
    minDistance: 8,
    maxDistance: 175,
    minPolarAngle: 0.08,
    maxPolarAngle: Math.PI * 0.88,
    autoRotate: false,
    autoRotateSpeed: 0.16,
    syncFromCamera: null,
    update: null
  };

  var spherical = new THREE.Spherical();
  var sphericalDelta = new THREE.Spherical(0, 0, 0);
  var panOffset = new THREE.Vector3();
  var offset = new THREE.Vector3();
  var panLeft = new THREE.Vector3();
  var panUp = new THREE.Vector3();
  var zoomScale = 1.0;

  /* Active pointer tracking for mouse drag, right-drag pan & 2-finger pinch */
  var pointers = new Map();
  var lastSingle = null;
  var lastPinchDist = 0;
  var lastPinchMid = null;
  var dragMode = 'none'; /* 'orbit' | 'pan' | 'pinch' | 'none' */

  ctrl.syncFromCamera = function () {
    offset.copy(cam.position).sub(ctrl.target);
    spherical.setFromVector3(offset);
    spherical.makeSafe();
    sphericalDelta.set(0, 0, 0);
    panOffset.set(0, 0, 0);
    zoomScale = 1.0;
  };

  function applyPan(dxPx, dyPx) {
    var rect = dom.getBoundingClientRect();
    var h = Math.max(rect.height, 1);
    var dist = cam.position.distanceTo(ctrl.target);
    var halfH = dist * Math.tan((cam.fov * Math.PI) / 360);
    var scale = (2 * halfH) / h;

    panLeft.setFromMatrixColumn(cam.matrix, 0).multiplyScalar(-dxPx * scale);
    panUp.setFromMatrixColumn(cam.matrix, 1).multiplyScalar(dyPx * scale);
    panOffset.add(panLeft).add(panUp);
  }

  dom.addEventListener('contextmenu', function (e) {
    e.preventDefault();
  });

  dom.addEventListener('pointerdown', function (e) {
    if (!ctrl.enabled) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      dragMode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
      lastSingle = { x: e.clientX, y: e.clientY };
    } else if (pointers.size === 2) {
      dragMode = 'pinch';
      var pts = Array.from(pointers.values());
      lastPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
      lastPinchMid = { x: (pts[0].x + pts[1].x) * 0.5, y: (pts[0].y + pts[1].y) * 0.5 };
    }
  });

  window.addEventListener('pointermove', function (e) {
    if (!ctrl.enabled || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (dragMode === 'pinch' && pointers.size >= 2) {
      var pts = Array.from(pointers.values());
      var dist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y) || 1;
      var mid = { x: (pts[0].x + pts[1].x) * 0.5, y: (pts[0].y + pts[1].y) * 0.5 };
      if (lastPinchDist > 0) {
        zoomScale *= lastPinchDist / dist;
      }
      if (lastPinchMid) {
        applyPan(mid.x - lastPinchMid.x, mid.y - lastPinchMid.y);
      }
      lastPinchDist = dist;
      lastPinchMid = mid;
      return;
    }

    if (pointers.size === 1 && lastSingle) {
      var dx = e.clientX - lastSingle.x;
      var dy = e.clientY - lastSingle.y;
      lastSingle = { x: e.clientX, y: e.clientY };
      if (dragMode === 'orbit') {
        var h = Math.max(dom.clientHeight || window.innerHeight, 1);
        sphericalDelta.theta -= (2 * Math.PI * dx) / h * 0.52;
        sphericalDelta.phi -= (2 * Math.PI * dy) / h * 0.52;
      } else if (dragMode === 'pan') {
        applyPan(dx, dy);
      }
    }
  }, { passive: true });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size === 1) {
      var remaining = Array.from(pointers.values())[0];
      lastSingle = { x: remaining.x, y: remaining.y };
      dragMode = 'orbit';
    } else if (pointers.size === 0) {
      dragMode = 'none';
      lastSingle = null;
      lastPinchMid = null;
    }
  }

  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  dom.addEventListener('wheel', function (e) {
    if (!ctrl.enabled) return;
    e.preventDefault();
    var step = Math.pow(0.95, Math.max(-6, Math.min(6, -e.deltaY * 0.012)));
    zoomScale *= step;
  }, { passive: false });

  ctrl.update = function (dt) {
    if (!ctrl.enabled) {
      cam.lookAt(ctrl.target);
      return;
    }
    var frameScale = Math.min(2.5, (dt || 0.016) * 60);
    if (ctrl.autoRotate && dragMode === 'none') {
      sphericalDelta.theta -= ((2 * Math.PI) / 60 / 60) * ctrl.autoRotateSpeed * frameScale;
    }

    offset.copy(cam.position).sub(ctrl.target);
    spherical.setFromVector3(offset);

    var damp = 1.0 - Math.pow(1.0 - ctrl.dampingFactor, frameScale);
    spherical.theta += sphericalDelta.theta * damp;
    spherical.phi += sphericalDelta.phi * damp;
    spherical.phi = Math.max(ctrl.minPolarAngle, Math.min(ctrl.maxPolarAngle, spherical.phi));
    spherical.makeSafe();

    spherical.radius *= zoomScale;
    spherical.radius = Math.max(ctrl.minDistance, Math.min(ctrl.maxDistance, spherical.radius));

    ctrl.target.addScaledVector(panOffset, damp);
    offset.setFromSpherical(spherical);
    cam.position.copy(ctrl.target).add(offset);
    cam.lookAt(ctrl.target);

    sphericalDelta.theta *= (1.0 - damp);
    sphericalDelta.phi *= (1.0 - damp);
    panOffset.multiplyScalar(1.0 - damp);
    zoomScale = 1.0;
  };

  ctrl.syncFromCamera();
  return ctrl;
}

    return seed / 4294967296;
  }

  if (proj.style === 'earth' || proj.style === 'archipelago') {
    var count = proj.style === 'earth' ? 28 : 42;
    for (var j = 0; j < count; j++) {
      ctx.globalAlpha = 0.55 + rand() * 0.30;
      ctx.fillStyle = j % 4 === 0 ? p[1] : p[2];
      ctx.beginPath();
      ctx.ellipse(rand() * 512, 34 + rand() * 188, 6 + rand() * 34, 4 + rand() * 18, rand() * Math.PI, 0, Math.PI * 2);
      ctx.fill();
    }
    for (var k = 0; k < 24; k++) {
      ctx.globalAlpha = 0.14 + rand() * 0.16;
      ctx.strokeStyle = '#fff9ee';
      ctx.lineWidth = 2 + rand() * 4;
      ctx.beginPath();
      var cy = 24 + rand() * 208;
      ctx.moveTo(rand() * 320, cy);
      ctx.quadraticCurveTo(rand() * 512, cy + (rand() - 0.5) * 26, rand() * 512, cy + (rand() - 0.5) * 14);
      ctx.stroke();
    }
  } else if (proj.style === 'wave') {
    for (var w = 0; w < 22; w++) {
      ctx.globalAlpha = 0.14 + rand() * 0.18;
      ctx.strokeStyle = w % 2 ? '#dffcff' : p[2];
      ctx.lineWidth = 1.2 + rand() * 2.5;
      ctx.beginPath();
      var baseY = 18 + (w / 22) * 220;
      var amp = 3 + rand() * 8;
      var freq = 0.02 + rand() * 0.03;
      for (var x = 0; x <= 512; x += 8) {
        var y = baseY + Math.sin(x * freq + w) * amp;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }
  } else if (proj.style === 'vortex') {
    for (var v = 0; v < 46; v++) {
      ctx.globalAlpha = 0.12 + rand() * 0.22;
      ctx.strokeStyle = v % 3 === 0 ? '#dce8ff' : (v % 3 === 1 ? '#8fb2ff' : '#1b2348');
      ctx.lineWidth = 1.5 + rand() * 4.0;
      ctx.beginPath();
      ctx.ellipse(256 + (rand() - 0.5) * 240, 128 + (rand() - 0.5) * 130, 18 + rand() * 92, 6 + rand() * 24, (rand() - 0.5) * 0.5, 0, Math.PI * 2);
      ctx.stroke();
    }
  } else if (proj.style === 'crater') {
    for (var c = 0; c < 34; c++) {
      var cx = rand() * 512;
      var cy2 = 24 + rand() * 208;
      var cr = 4 + rand() * 16;
      ctx.globalAlpha = 0.22 + rand() * 0.20;
      ctx.fillStyle = p[2];
      ctx.beginPath();
      ctx.arc(cx, cy2, cr, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = '#fff5e4';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.arc(cx - 1.5, cy2 - 1.5, cr * 0.92, -Math.PI * 0.85, Math.PI * 0.15);
      ctx.stroke();
    }
  } else {
    for (var b = 0; b < 32; b++) {
      ctx.globalAlpha = 0.12 + rand() * 0.20;
      ctx.fillStyle = b % 2 ? p[1] : p[2];
      ctx.fillRect(0, rand() * 256, 512, 3 + rand() * 14);
    }
  }

  for (var s = 0; s < 420; s++) {
    ctx.globalAlpha = 0.04 + rand() * 0.13;
    ctx.strokeStyle = s % 3 ? '#2c231e' : '#fff5e2';
    ctx.lineWidth = 0.4 + rand() * 1.4;
    ctx.beginPath();
    ctx.ellipse(rand() * 512, rand() * 256, 4 + rand() * 44, 0.5 + rand() * 5, (rand() - 0.5) * 0.4, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.globalAlpha = 1.0;
  var tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  return tex;
}

function populateGalaxy(glowTex) {
  var planeDefs = [
    { y: -2.2, size: 152, seed: 1.1, opacity: 0.72, rotSpeed: 0.011, tiltX:  0.016, tiltZ: -0.012 },
    { y:  0.0, size: 144, seed: 3.4, opacity: 0.88, rotSpeed: 0.014, tiltX: -0.012, tiltZ:  0.016 },
    { y:  2.2, size: 136, seed: 6.8, opacity: 0.58, rotSpeed: 0.017, tiltX:  0.020, tiltZ:  0.014 }
  ];
  var activeDefs = mobile ? planeDefs.slice(0, 2) : planeDefs;
  activeDefs.forEach(function (d) {
    var mat = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uTheme: { value: themeMix },
        uSeed: { value: d.seed },
        uOpacity: { value: d.opacity }
      },
      vertexShader: GALAXY_NEBULA_VERT,
      fragmentShader: GALAXY_NEBULA_FRAG,
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending
    });
    var mesh = new THREE.Mesh(new THREE.PlaneGeometry(d.size, d.size), mat);
    mesh.position.y = d.y;
    mesh.rotation.set(-Math.PI * 0.5 + d.tiltX, 0, d.tiltZ);
    mesh.renderOrder = -20;
    galaxyGroup.add(mesh);
    nebulaPlanes.push({ mesh: mesh, mat: mat, rotSpeed: d.rotSpeed, baseOpacity: d.opacity });
  });

  var coreMat = new THREE.SpriteMaterial({
    map: glowTex,
    color: new THREE.Color('#f7d8aa'),
    transparent: true,
    opacity: 0.55,
    blending: THREE.AdditiveBlending,
    depthWrite: false
  });
  var coreSprite = new THREE.Sprite(coreMat);
  coreSprite.position.set(0, 0.3, 0);
  coreSprite.scale.set(28, 22, 1);
  galaxyGroup.add(coreSprite);
  coreBulgeMat = coreMat;

  var totalStars = mobile ? 13000 : 28000;
  var positions = new Float32Array(totalStars * 3);
  var colors = new Float32Array(totalStars * 3);
  var sizes = new Float32Array(totalStars);
  var phases = new Float32Array(totalStars);
  var spikes = new Float32Array(totalStars);

  var seed = 424242;
  function rand() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  function randGauss() {
    return ((rand() + rand() + rand() + rand()) - 2.0) * 0.72;
  }

  var cCore = new THREE.Color('#ffe2b4');
  var cGold = new THREE.Color('#f2c88e');
  var cBlue = new THREE.Color('#7ec2ff');
  var cCyan = new THREE.Color('#9ce8f2');
  var cRose = new THREE.Color('#e69ec2');
  var cWhite = new THREE.Color('#f6f8ff');
  var tmpCol = new THREE.Color();

  for (var i = 0; i < totalStars; i++) {
    var pop = rand();
    var x = 0;
    var y = 0;
    var z = 0;
    var sz = 1.0;
    var sp = 0.0;

    if (pop < 0.18) {
      var rCore = Math.pow(rand(), 1.85) * 14.5;
      var thetaC = rand() * Math.PI * 2;
      x = Math.cos(thetaC) * rCore;
      z = Math.sin(thetaC) * rCore;
      y = randGauss() * (2.6 * Math.exp(-rCore * 0.09) + 0.45);
      tmpCol.copy(cCore).lerp(cWhite, rand() * 0.45);
      sz = 0.55 + Math.pow(rand(), 2.2) * 1.45;
      if (rand() < 0.025) { sp = 1.0; sz *= 1.9; }
    } else if (pop < 0.76) {
      var isMain = rand() < 0.72;
      var armIdx = Math.floor(rand() * 2);
      var rArm = 3.5 + Math.pow(rand(), 0.78) * 66.0;
      var logTheta = Math.log(Math.max(rArm / 4.2, 0.2)) * 2.55;
      var baseAngle = armIdx * Math.PI + (isMain ? 0.0 : Math.PI * 0.5 + 0.35);
      var scatter = randGauss() * (isMain ? (0.34 + rArm * 0.004) : (0.48 + rArm * 0.005));
      var theta = baseAngle + logTheta + scatter;

      x = Math.cos(theta) * rArm;
      z = Math.sin(theta) * rArm;
      y = randGauss() * (1.2 + rArm * 0.055);

      var radialNorm = Math.min(1.0, rArm / 66.0);
      var huePick = rand();
      if (huePick < 0.46) tmpCol.copy(cBlue).lerp(cCyan, rand());
      else if (huePick < 0.76) tmpCol.copy(cWhite).lerp(cBlue, rand() * 0.45);
      else if (huePick < 0.90) tmpCol.copy(cGold).lerp(cCore, rand());
      else tmpCol.copy(cRose).lerp(cWhite, 0.3);
      tmpCol.lerp(cCore, Math.max(0.0, 1.0 - radialNorm * 3.0) * 0.55);

      sz = 0.48 + Math.pow(rand(), 2.5) * 1.55;
      if (rand() < 0.032) { sp = 1.0; sz *= 2.05; }
    } else if (pop < 0.90) {
      var rDisc = 4.0 + Math.pow(rand(), 0.72) * 86.0;
      var aDisc = rand() * Math.PI * 2;
      x = Math.cos(aDisc) * rDisc;
      z = Math.sin(aDisc) * rDisc;
      y = randGauss() * (4.5 + rDisc * 0.09);
      tmpCol.copy(rand() < 0.55 ? cWhite : cBlue).lerp(cGold, rand() * 0.32);
      sz = 0.42 + Math.pow(rand(), 2.4) * 1.2;
    } else {
      var u = rand();
      var v = rand();
      var th = 2.0 * Math.PI * u;
      var ph = Math.acos(2.0 * v - 1.0);
      var rVault = 180.0 + rand() * 240.0;
      x = rVault * Math.sin(ph) * Math.cos(th);
      y = rVault * Math.sin(ph) * Math.sin(th);
      z = rVault * Math.cos(ph);
      tmpCol.copy(rand() < 0.65 ? cWhite : (rand() < 0.5 ? cBlue : cGold));
      sz = 0.9 + Math.pow(rand(), 2.2) * 2.2;
      if (rand() < 0.07) { sp = 1.0; sz *= 1.85; }
    }

    positions[i * 3 + 0] = x;
    positions[i * 3 + 1] = y;
    positions[i * 3 + 2] = z;
    colors[i * 3 + 0] = tmpCol.r;
    colors[i * 3 + 1] = tmpCol.g;
    colors[i * 3 + 2] = tmpCol.b;
    sizes[i] = sz;
    phases[i] = rand();
    spikes[i] = sp;
  }

  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  starGeo.setAttribute('aColor', new THREE.BufferAttribute(colors, 3));
  starGeo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  starGeo.setAttribute('aPhase', new THREE.BufferAttribute(phases, 1));
  starGeo.setAttribute('aSpike', new THREE.BufferAttribute(spikes, 1));

  galaxyStarsMat = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.85) },
      uTheme: { value: themeMix }
    },
    vertexShader: STAR_POINTS_VERT,
    fragmentShader: STAR_POINTS_FRAG,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var starPoints = new THREE.Points(starGeo, galaxyStarsMat);
  starPoints.frustumCulled = false;
  galaxyGroup.add(starPoints);

  var orbitRadii = [18, 36, 54];
  orbitRadii.forEach(function (radius) {
    var pts = [];
    for (var k = 0; k <= 220; k++) {
      var a = (k / 220) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a * 3) * 0.14, Math.sin(a) * radius));
    }
    var ringGeo = new THREE.BufferGeometry().setFromPoints(pts);
    var ring = new THREE.LineLoop(ringGeo, new THREE.LineDashedMaterial({
      color: '#7da2bd',
      opacity: 0.065,
      transparent: true,
      dashSize: 0.42,
      gapSize: 0.65
    }));
    ring.computeLineDistances();
    galaxyGroup.add(ring);
    orbitRings.push(ring);
  });

  createShootingStars(glowTex);
}

function createShootingStars(glowTex) {
  var count = reduced ? 0 : (mobile ? 1 : 2);
  var seed = 88231;
  function rand() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  for (var i = 0; i < count; i++) {
    var group = new THREE.Group();
    var lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-5.2, 0, 0),
      new THREE.Vector3(0, 0, 0)
    ]);
    var line = new THREE.Line(lineGeo, new THREE.LineBasicMaterial({
      color: '#d4e8ff', transparent: true, opacity: 0, depthWrite: false
    }));
    var head = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: '#fff3dc', transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    head.scale.set(0.85, 0.85, 1);
    group.add(line, head);
    galaxyGroup.add(group);
    var star = {
      group: group, line: line, head: head,
      start: new THREE.Vector3(), end: new THREE.Vector3(), direction: new THREE.Vector3(),
      elapsed: 0, delay: 0, duration: 1.5, rand: rand
    };
    resetShootingStar(star);
    star.delay = 2.8 + i * 5.0 + rand() * 4.5;
    shootingStars.push(star);
  }
}

function resetShootingStar(star) {
  var rand = star.rand;
  star.start.set((rand() - 0.5) * 105, 8 + rand() * 18, (rand() - 0.5) * 105);
  star.direction.set((rand() - 0.5) * 0.9, -0.18 + rand() * 0.32, (rand() - 0.5) * 0.9).normalize();
  star.end.copy(star.start).addScaledVector(star.direction, 30 + rand() * 32);
  star.elapsed = 0;
  star.delay = 5.5 + rand() * 11;
  star.duration = 1.0 + rand() * 1.25;
  star.group.position.copy(star.start);
  star.group.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), star.direction);
  star.line.material.opacity = 0;
  star.head.material.opacity = 0;
}

function updateShootingStars(dt) {
  shootingStars.forEach(function (star) {
    star.elapsed += dt * Math.max(0.25, speed);
    if (star.elapsed < star.delay) {
      star.line.material.opacity = 0;
      star.head.material.opacity = 0;
      return;
    }
    var t = (star.elapsed - star.delay) / star.duration;
    if (t >= 1) { resetShootingStar(star); return; }
    star.group.position.copy(star.start).lerp(star.end, t);
    var fade = Math.min(1, t * 6, (1 - t) * 6);
    star.line.material.opacity = 0.24 * fade;
    star.head.material.opacity = 0.34 * fade;
  });
}

function populatePlanets(glowTex) {
  PROJECTS.forEach(function (p, i) {
    var g = new THREE.Group();
    var coord = PLANET_COORDS[i];
    g.position.set(coord[0], coord[1], coord[2]);

    /* Rich organic size variety: petite moons (~1.12) to grand giants (~3.35) */
    var baseR = PLANET_BASE_RADII[i % PLANET_BASE_RADII.length];
    var radius = Math.max(1.12, Math.min(3.35, baseR * (0.85 + Math.random() * 0.32)));

    var mat = new THREE.MeshStandardMaterial({
      map: createPlanetTexture(p, i),
      roughness: 0.78,
      metalness: 0.04,
      emissive: new THREE.Color(p.palette[0]),
      emissiveIntensity: 0.14
    });
    var mesh = new THREE.Mesh(new THREE.SphereGeometry(radius, 44, 32), mat);
    mesh.userData.index = i;
    g.add(mesh);

    var atmoMat = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(p.atmo) },
        uIntensity: { value: 0.72 }
      },
      vertexShader: ATMO_VERT,
      fragmentShader: ATMO_FRAG,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var atmoMesh = new THREE.Mesh(new THREE.SphereGeometry(radius * 1.07, 36, 24), atmoMat);
    g.add(atmoMesh);

    var halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex,
      color: new THREE.Color(p.atmo),
      transparent: true,
      opacity: 0.23,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    }));
    halo.scale.set(radius * 5.2, radius * 5.2, 1);
    g.add(halo);

    var innerR = radius * (1.32 + Math.random() * 0.18);
    var outerR = innerR + radius * (0.46 + Math.random() * 0.56);
    var baseRingOpacity = radius < 1.55 ? 0.38 : (radius > 2.55 ? 0.64 : 0.52);
    var ringMat = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(p.ring) },
        uInnerR: { value: innerR },
        uOuterR: { value: outerR },
        uOpacity: { value: baseRingOpacity },
        uTime: { value: 0 }
      },
      vertexShader: RING_VERT,
      fragmentShader: RING_FRAG,
      transparent: true,
      side: THREE.DoubleSide,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    var ringMesh = new THREE.Mesh(new THREE.RingGeometry(innerR, outerR, 80, 1), ringMat);
    ringMesh.rotation.x = Math.PI * 0.5 - 0.24 - Math.random() * 0.42;
    ringMesh.rotation.y = (Math.random() - 0.5) * 0.58;
    g.add(ringMesh);

    var moonPivot = new THREE.Group();
    moonPivot.rotation.x = ringMesh.rotation.x - Math.PI * 0.5;
    moonPivot.rotation.z = ringMesh.rotation.y;
    var moon = new THREE.Mesh(
      new THREE.SphereGeometry(radius * (0.085 + Math.random() * 0.055), 14, 10),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(p.ring) })
    );
    var moonR = outerR + radius * (0.18 + Math.random() * 0.26);
    moon.position.set(moonR, 0, 0);
    moonPivot.rotation.y = Math.random() * Math.PI * 2;
    moonPivot.add(moon);
    g.add(moonPivot);

    g.userData = {
      baseY: coord[1],
      radius: radius,
      baseRingOpacity: baseRingOpacity,
      mesh: mesh,
      atmoMat: atmoMat,
      halo: halo,
      ringMesh: ringMesh,
      ringMat: ringMat,
      moonPivot: moonPivot,
      moonSpeed: 0.20 + Math.random() * 0.26
    };

    scene.add(g);
    planets.push(g);
    meshes.push(mesh);
    labels.push(addLabel(p, i));
  });

  var hemi = new THREE.HemisphereLight(0xd8e8ff, 0x1b2442, 0.58);
  scene.add(hemi);
  var key = new THREE.PointLight(0xffdfb6, 1.55, 220, 1.2);
  key.position.set(0, 14, 4);
  scene.add(key);
  var rim = new THREE.DirectionalLight(0x8bbef0, 0.72);
  rim.position.set(-28, 36, -32);
  scene.add(rim);
  lights = { hemi: hemi, key: key, rim: rim };
}

function openArticle(post) {
  var root = el('journal-content');
  root.textContent = '';
  var b = document.createElement('button');
  b.className = 'btn';
  b.type = 'button';
  b.textContent = '← 返回';
  b.addEventListener('click', journalList);
  root.appendChild(b);

  var article = document.createElement('article');
  article.className = 'article';
  var h = document.createElement('h2');
  h.textContent = post.title;
  article.appendChild(h);
  post.paragraphs.forEach(function (s) {
    var p = document.createElement('p');
    p.textContent = s;
    article.appendChild(p);
  });
  root.appendChild(article);
  el('journal').scrollTop = 0;
}

function openJournal() {
  el('card').classList.remove('show');
  el('drawer').classList.remove('show');
  el('journal').classList.add('show');
  journalList();
}

function jump(i) {
  var link = PROJECTS[i].link;
  if (link.indexOf('../') === 0) window.location.href = link;
  else window.open(link, '_blank', 'noopener,noreferrer');
}

function fail(s) {
  el('fail').classList.add('show');
  setText('reason', s);
}

/* ============================================================================
 * 8. ENGINE INIT, RAYCASTING, CAMERA FLIGHT & ANTI-COLLISION LABELS
 * ============================================================================ */
function init() {
  if (!window.THREE) {
    fail('Three.js 加载失败。请检查网络连接，或直接点击下方按钮浏览作品星球索引。');
    return;
  }
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
  } catch (e) {
    fail('WebGL 不可用，请使用更新版 Chrome 或 Edge；仍可打开作品索引。');
    return;
  }

  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.85));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x030714, 0);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.08;
  el('scene').appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(50, window.innerWidth / Math.max(window.innerHeight, 1), 0.1, 1800);
  var defaultPos = new THREE.Vector3(0, mobile ? 54 : 44, mobile ? 110 : 92);

  if (isArrival && !reduced) {
    camera.position.set(0, mobile ? 74 : 62, mobile ? 148 : 126);
    flight = {
      from: camera.position.clone(),
      to: defaultPos.clone(),
      lookFrom: new THREE.Vector3(0, 0, 0),
      lookTo: new THREE.Vector3(0, 0, 0),
      t: 0,
      rate: 0.56
    };
  } else {
    camera.position.copy(defaultPos);
  }

  createSkyBackdrop();

  controls = createOrbitController(camera, renderer.domElement);
  controls.autoRotate = !reduced && !flight;
  controls.autoRotateSpeed = 0.16;
  if (flight) controls.enabled = false;

  galaxyGroup = new THREE.Group();
  scene.add(galaxyGroup);

  var glowTex = spriteTexture();
  populateGalaxy(glowTex);
  populatePlanets(glowTex);

  raycaster = new THREE.Raycaster();
  pointer = new THREE.Vector2();
  applyTheme();

  renderer.domElement.addEventListener('pointermove', function (e) {
    hovered = hit(e);
    renderer.domElement.classList.toggle('planet-hover', hovered >= 0);
  }, { passive: true });

  renderer.domElement.addEventListener('pointerdown', function (e) {
    renderer.domElement._down = [e.clientX, e.clientY];
  });
  renderer.domElement.addEventListener('pointerup', function (e) {
    var d = renderer.domElement._down;
    if (!d || Math.hypot(e.clientX - d[0], e.clientY - d[1]) > 7) return;
    var idx = hit(e);
    if (idx >= 0) focus(idx);
  });
  renderer.domElement.addEventListener('dblclick', function (e) {
    var idx = hit(e);
    if (idx >= 0) jump(idx);
  });

  window.addEventListener('resize', resize);
  started = true;
  requestAnimationFrame(animate);
}

function hit(e) {
  var rect = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - rect.left) / Math.max(rect.width, 1)) * 2 - 1;
  pointer.y = -((e.clientY - rect.top) / Math.max(rect.height, 1)) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  var items = raycaster.intersectObjects(meshes, false);
  return items.length ? items[0].object.userData.index : -1;
}

function focus(i) {
  showCard(i);
  if (!started) return;
  var target = planets[i].position.clone();
  var heading = camera.position.clone().sub(controls.target).normalize();
  var r = planets[i].userData.radius;
  var dist = Math.max(9.0, r * 5.2 + 2.2);
  var end = target.clone().addScaledVector(heading, dist).add(new THREE.Vector3(0, r * 1.15, 0));
  flight = {
    from: camera.position.clone(),
    to: end,
    lookFrom: controls.target.clone(),
    lookTo: target,
    t: 0,
    rate: 0.92
  };
  controls.enabled = false;
  controls.autoRotate = false;
}

function reset() {
  selected = -1;
  el('card').classList.remove('show');
  hidePanels();
  labels.forEach(function (x) { x.classList.remove('selected'); });
  if (!started) return;
  flight = {
    from: camera.position.clone(),
    to: new THREE.Vector3(0, mobile ? 54 : 44, mobile ? 110 : 92),
    lookFrom: controls.target.clone(),
    lookTo: new THREE.Vector3(0, 0, 0),
    t: 0,
    rate: 0.86
  };
  controls.enabled = false;
  controls.autoRotate = false;
}

var tmpCamUp = new THREE.Vector3();
var tmpAnchor = new THREE.Vector3();

function updateLabels(dt) {
  camera.updateMatrixWorld();
  tmpCamUp.set(0, 1, 0).applyQuaternion(camera.quaternion);

  var active = [];
  var w = window.innerWidth;
  var h = window.innerHeight;

  planets.forEach(function (g, i) {
    tmpAnchor.copy(g.position).addScaledVector(tmpCamUp, -g.userData.radius * 1.18);
    tmpAnchor.project(camera);

    var sx = (tmpAnchor.x * 0.5 + 0.5) * w;
    var sy = (-tmpAnchor.y * 0.5 + 0.5) * h;
    var dist = camera.position.distanceTo(g.position);
    var front = tmpAnchor.z < 1 && sx > 44 && sx < w - 44 && sy > 70 && sy < h - 84;
    if (selected >= 0 && i !== selected && dist < 26) front = false;

    labels[i].classList.toggle('hidden', !front);
    labels[i].classList.toggle('hovered', hovered === i);

    if (front) {
      var boxW = mobile ? 96 : 126;
      var boxH = mobile ? 34 : 52;
      active.push({
        i: i,
        x: sx,
        y: sy,
        w: boxW,
        h: boxH,
        dist: dist,
        priority: (i === selected || i === hovered) ? 1 : 0
      });
    }
  });

  for (var iter = 0; iter < 4; iter++) {
    for (var a = 0; a < active.length; a++) {
      for (var b = a + 1; b < active.length; b++) {
        var la = active[a];
        var lb = active[b];
        var dx = lb.x - la.x;
        var dy = lb.y - la.y;
        var minX = (la.w + lb.w) * 0.5 + 6;
        var minY = (la.h + lb.h) * 0.5 + 4;
        if (Math.abs(dx) < minX && Math.abs(dy) < minY) {
          var ox = minX - Math.abs(dx);
          var oy = minY - Math.abs(dy);
          var wa = la.priority ? 0.15 : 0.5;
          var wb = lb.priority ? 0.15 : 0.5;
          var wsum = wa + wb;
          wa /= wsum;
          wb /= wsum;
          if (oy <= ox * 0.9) {
            var signY = dy >= 0 ? 1 : -1;
            la.y -= oy * signY * wa;
            lb.y += oy * signY * wb;
          } else {
            var signX = dx >= 0 ? 1 : -1;
            la.x -= ox * signX * wa;
            lb.x += ox * signX * wb;
          }
        }
      }
    }
  }

  var smooth = 1.0 - Math.exp(-Math.max(dt, 0.016) * 14.0);
  active.forEach(function (item) {
    var st = labelState[item.i];
    var tx = Math.max(58, Math.min(w - 58, item.x));
    var ty = Math.max(72, Math.min(h - 90, item.y));
    if (!st.initialized) {
      st.x = tx;
      st.y = ty;
      st.initialized = true;
    } else {
      st.x += (tx - st.x) * smooth;
      st.y += (ty - st.y) * smooth;
    }
    var node = labels[item.i];
    node.style.transform = 'translate3d(' + st.x.toFixed(1) + 'px,' + st.y.toFixed(1) + 'px,0) translate(-50%,0)';
    var depthAlpha = item.priority ? 1.0 : Math.max(0.58, Math.min(0.98, 1.24 - item.dist / 175));
    node.style.opacity = depthAlpha.toFixed(2);
    node.style.zIndex = item.priority ? '16' : String(Math.max(1, Math.round(15 - item.dist * 0.08)));
  });
}

function renderScene() {
  renderer.render(scene, camera);
  if (document.documentElement.classList.contains('cosmos-arrival') &&
      !document.documentElement.classList.contains('cosmos-arrival-ready')) {
    document.documentElement.classList.add('cosmos-arrival-ready');
  }
}

function animate(now) {
  if (!started) return;
  requestAnimationFrame(animate);

  var dt = lastTime ? Math.min(0.05, (now - lastTime) / 1000) : 0.016;
  lastTime = now;

  var targetThemeMix = theme === 'paper' ? 1.0 : 0.0;
  themeMix += (targetThemeMix - themeMix) * (1.0 - Math.exp(-dt * 4.2));

  if (!paused) {
    clock += dt * speed;
    galaxyGroup.rotation.y += dt * 0.014 * speed;
    nebulaPlanes.forEach(function (layer) {
      layer.mesh.rotation.z += dt * layer.rotSpeed * speed;
      layer.mat.uniforms.uTime.value = clock;
      layer.mat.uniforms.uTheme.value = themeMix;
    });
    if (skyMat) {
      skyMat.uniforms.uTime.value = clock;
      skyMat.uniforms.uTheme.value = themeMix;
    }
    if (galaxyStarsMat) {
      galaxyStarsMat.uniforms.uTime.value = clock;
      galaxyStarsMat.uniforms.uTheme.value = themeMix;
    }
    updateShootingStars(dt);
  } else {
    nebulaPlanes.forEach(function (layer) { layer.mat.uniforms.uTheme.value = themeMix; });
    if (skyMat) skyMat.uniforms.uTheme.value = themeMix;
    if (galaxyStarsMat) galaxyStarsMat.uniforms.uTheme.value = themeMix;
  }

  var ease = 1.0 - Math.exp(-dt * 7.5);
  planets.forEach(function (p, i) {
    var ud = p.userData;
    p.position.y = ud.baseY + Math.sin(clock * 0.55 + i * 1.35) * 0.28;
    ud.mesh.rotation.y += dt * 0.11 * speed;
    ud.ringMat.uniforms.uTime.value = clock;
    ud.moonPivot.rotation.y += dt * ud.moonSpeed * speed;

    var active = (i === selected || i === hovered);
    var targetAtmo = active ? 1.25 : 0.72;
    var targetHalo = active ? 0.42 : 0.23;
    var targetRing = active ? Math.min(0.95, ud.baseRingOpacity + 0.34) : ud.baseRingOpacity;
    ud.atmoMat.uniforms.uIntensity.value += (targetAtmo - ud.atmoMat.uniforms.uIntensity.value) * ease;
    ud.halo.material.opacity += (targetHalo - ud.halo.material.opacity) * ease;
    ud.ringMat.uniforms.uOpacity.value += (targetRing - ud.ringMat.uniforms.uOpacity.value) * ease;
  });

  if (flight) {
    flight.t = Math.min(1, flight.t + dt * (flight.rate || 0.88));
    var t = flight.t;
    var k = t * t * t * (t * (t * 6 - 15) + 10);
    camera.position.copy(flight.from).lerp(flight.to, k);
    controls.target.copy(flight.lookFrom).lerp(flight.lookTo, k);
    if (t >= 1) {
      flight = null;
      controls.syncFromCamera();
      controls.enabled = true;
      controls.autoRotate = selected < 0 && !reduced;
    }
  }

  controls.update(dt);
  updateLabels(dt);
  renderScene();
}

function resize() {
  if (!started) return;
  var dpr = Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.85);
  camera.aspect = window.innerWidth / Math.max(window.innerHeight, 1);
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(dpr);
  renderer.setSize(window.innerWidth, window.innerHeight);
  if (galaxyStarsMat) galaxyStarsMat.uniforms.uPixelRatio.value = dpr;
}

function applyTheme() {
  var dawn = theme === 'paper';
  document.documentElement.dataset.theme = theme;
  if (renderer) {
    orbitRings.forEach(function (r) {
      r.material.color.set(dawn ? '#e2d2c0' : '#7da2bd');
      r.material.opacity = dawn ? 0.095 : 0.065;
    });
    if (coreBulgeMat) coreBulgeMat.opacity = dawn ? 0.46 : 0.56;
    if (lights) {
      lights.hemi.intensity = dawn ? 0.68 : 0.58;
      lights.key.intensity = dawn ? 1.38 : 1.55;
    }
  }
  el('palette').textContent = dawn ? '☾ 深空' : '☀ 暮光';
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', dawn ? '#263c5a' : '#050e20');
}

function setTheme() {
  theme = theme === 'night' ? 'paper' : 'night';
  applyTheme();
  try { localStorage.setItem('star-theme', theme); } catch (e) {}
}

function listen() {
  makeIndex();
  if (reduced) el('speed').value = '0';
  el('home').addEventListener('click', reset);
  el('reset').addEventListener('click', reset);
  el('index').addEventListener('click', openIndex);
  el('drawer-close').addEventListener('click', hidePanels);
  el('logs').addEventListener('click', openJournal);
  el('journal-close').addEventListener('click', hidePanels);
  el('card-close').addEventListener('click', reset);
  el('palette').addEventListener('click', setTheme);
  el('fail-index').addEventListener('click', function () {
    el('fail').classList.remove('show');
    openIndex();
  });
  el('pause').addEventListener('click', function () {
    paused = !paused;
    el('pause').textContent = paused ? '▶ 恢复星流' : 'Ⅱ 暂停星流';
    el('pause').classList.toggle('active', !paused);
  });
  el('speed').addEventListener('input', function (e) { speed = +e.target.value; });
  el('next').addEventListener('click', function () { focus((selected + 1 + PROJECTS.length) % PROJECTS.length); });
  el('prev').addEventListener('click', function () { focus((selected - 1 + PROJECTS.length) % PROJECTS.length); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { reset(); return; }
    var target = e.target;
    if (target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
    if (e.key === 'ArrowRight') focus((selected + 1 + PROJECTS.length) % PROJECTS.length);
    else if (e.key === 'ArrowLeft') focus((selected - 1 + PROJECTS.length) % PROJECTS.length);
    else if (/^[1-9]$/.test(e.key) && +e.key <= PROJECTS.length) focus(+e.key - 1);
  });
}

listen();
if (document.readyState === 'complete') init();
else window.addEventListener('load', init, { once: true });
})();
</script>
