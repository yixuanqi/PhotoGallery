/* V3.1 — handwritten star-chart details, instead of browser-default links/scrollbars */
:root {
  --scroll-thumb: rgba(224,194,143,.47);
  --scroll-thumb-hover: rgba(237,202,144,.78);
}
:root[data-theme="paper"] {
  --scroll-thumb: rgba(123,86,51,.40);
  --scroll-thumb-hover: rgba(123,86,51,.68);
}
.card, .panel {
  overflow-x:hidden;
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
  scrollbar-color:var(--scroll-thumb) transparent;
}
.card::-webkit-scrollbar, .panel::-webkit-scrollbar { width:6px; height:6px; }
.card::-webkit-scrollbar-track, .panel::-webkit-scrollbar-track {
  background:transparent;
  margin-block:14px;
}
.card::-webkit-scrollbar-thumb, .panel::-webkit-scrollbar-thumb {
  background:var(--scroll-thumb);
  border-radius:20px;
  border:1px solid transparent;
  background-clip:padding-box;
}
.card::-webkit-scrollbar-thumb:hover, .panel::-webkit-scrollbar-thumb:hover {
  background:var(--scroll-thumb-hover);
}
.card::-webkit-scrollbar-corner, .panel::-webkit-scrollbar-corner { background:transparent; }
.card::-webkit-scrollbar-button, .panel::-webkit-scrollbar-button { display:none; width:0; height:0; }
.card-head {
  position:sticky;
  top:-19px;
  z-index:2;
  padding-top:8px;
  padding-bottom:12px;
  margin-top:-8px;
  background:var(--pane);
  backdrop-filter:blur(12px);
}
.card-actions { margin-top:18px; gap:9px; }
.card-actions a,
.card-actions a:link,
.card-actions a:visited {
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:43px;
  padding:10px 12px;
  color:var(--ink);
  font-family:'Noto Serif SC',Georgia,serif;
  font-size:11px;
  font-weight:600;
  letter-spacing:.035em;
  line-height:1.5;
  text-decoration:none;
  text-shadow:none;
  border:1px solid var(--line);
  background:rgba(173,142,99,.10);
  border-radius:14px 5px 13px 5px/5px 14px 5px 13px;
  transition:background-color .2s,border-color .2s,box-shadow .2s,transform .2s,color .2s;
}
.card-actions a.primary,
.card-actions a.primary:link,
.card-actions a.primary:visited {
  min-height:49px;
  color:var(--ink);
  border-color:rgba(232,194,137,.68);
  background:linear-gradient(145deg,rgba(217,174,106,.31),rgba(186,136,76,.14));
  box-shadow:inset 0 1px rgba(255,240,207,.12);
  font-size:12px;
  font-weight:700;
}
.card-actions a:hover,
.card-actions a:focus-visible {
  color:var(--gold);
  border-color:var(--gold);
  background:rgba(213,169,105,.19);
  transform:translateY(-1px);
  box-shadow:0 3px 14px rgba(0,0,0,.12);
}
.card-actions a.primary:hover,
.card-actions a.primary:focus-visible {
  color:var(--ink);
  background:rgba(225,180,110,.42);
  border-color:var(--gold);
}
.card-actions a:active { transform:translateY(1px); }
.card-actions a:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
:root[data-theme="paper"] .card-actions a.primary,
:root[data-theme="paper"] .card-actions a.primary:link,
:root[data-theme="paper"] .card-actions a.primary:visited {
  border-color:rgba(154,105,59,.68);
  background:linear-gradient(145deg,rgba(185,132,73,.25),rgba(196,150,92,.12));
}
@media(max-width:640px){
  .card-head { top:-19px; }
  .card-actions a { min-height:42px; font-size:10px; }
  .card-actions a.primary { min-height:46px; font-size:11px; }
}

var POSTS=[
 {id:'welcome',no:'01 · 星河缘起',title:'为什么把个人主页画成一片银河？',summary:'一个项目一颗星。让作品不再只是简历上的一行文字。',paragraphs:['普通的作品集像一张排列整齐的清单。但我更喜欢手帐：它有空白、有涂改、有相互连接的线索，也允许故事继续生长。','所以这片银河并不追求天文学的严格比例。中心是好奇心，星星是一次次动手做出来的东西。能在浏览器运行的，点开就玩；需要安装的软件，找到它的下载页；尚在研究的项目，打开实验记录。','以后每做完一个项目，就点亮一颗新的星。文章也会从星际间慢慢长出来。']},
 {id:'astra-note',no:'02 · 作品手记',title:'从一颗手绘星球到一整册天体运行志',summary:'Astra 的有趣之处，不止在 3D，还在“像一本旧书”。',paragraphs:['Astra 是一页可以旋转、缩放和点击的天体手帐。它用 Three.js 承载 3D 交互，再把水彩、钢笔排线和旧纸张的视觉语言铺在星球周围。','对我来说，最有意思的并不是把一颗球渲染得多逼真，而是让界面本身像一件手工制作的小作品。它不一定高效，却让探索的过程有了一点趣味。','这也是银河主页延续这套视觉语言的原因：星系像地图，项目像被收藏在地图上的小标本。']},

 let cv=document.createElement('canvas');cv.width=512;cv.height=256;let x=cv.getContext('2d'),p=sets[i],grad=x.createLinearGradient(0,0,0,256);
 grad.addColorStop(0,p[0]);grad.addColorStop(.52,p[1]);grad.addColorStop(1,p[0]);x.fillStyle=grad;x.fillRect(0,0,512,256);
 let seed=867+i*13007;function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 for(let j=0;j<750;j++){x.globalAlpha=.04+rand()*.23;x.strokeStyle=j%3?'#46382d':'#fff5e2';x.lineWidth=.3+rand()*2;x.beginPath();x.ellipse(rand()*512,rand()*256,3+rand()*50,.3+rand()*7,rand()*.6,0,Math.PI*2);x.stroke()}
 if(i===5){x.globalAlpha=.85;x.fillStyle=p[2];for(let j=0;j<30;j++){x.beginPath();x.ellipse(rand()*512,rand()*256,3+rand()*34,3+rand()*20,rand()*Math.PI,0,Math.PI*2);x.fill()}}

function nebulaTexture(isDawn){
 // Paint four broad, translucent watercolor spiral arms into a reusable GPU texture.
 // The texture sits on a genuine 3D plane; nearby points and project planets have depth.
 const canvas=document.createElement('canvas'),N=1280;
 canvas.width=canvas.height=N;
 const g=canvas.getContext('2d');
 const tones=isDawn?['#83c2cd','#c8a487','#b9a3c0','#91c5b8']:['#569fb6','#c4a17e','#9c8fb8','#75afa9'];
 function rgba(hex,a){
  const v=parseInt(hex.substring(1),16);
  return 'rgba('+((v>>16)&255)+','+((v>>8)&255)+','+(v&255)+','+a+')';
 }
 g.translate(N/2,N/2);
 // Soft broad lanes, narrow luminous seams, and irregular transparent gaps.
 for(let arm=0;arm<4;arm++){
  const tone=tones[arm];
  for(let pass=0;pass<5;pass++){
   g.beginPath();
   for(let i=0;i<=180;i++){
    const r=3+(i/180)*54;
    const angle=arm*Math.PI/2+r*.09+(pass-2)*.027+Math.sin(r*.42+arm)*.010;
    const x=Math.cos(angle)*r*10.1,y=Math.sin(angle)*r*10.1;
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
   }
   g.lineCap='round';g.lineJoin='round';
   g.lineWidth=[56,36,20,10,3][pass];
   g.strokeStyle=rgba(tone,[.034,.043,.058,.077,.120][pass]);
   g.shadowColor=tone;g.shadowBlur=[9,6,3,1,0][pass];
   g.stroke();g.shadowBlur=0;
  }
 }
 let seed=92871;
 function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 // Fine pigment speckles organize the dust into spiral streams.
 for(let i=0;i<5300;i++){
  let arm=i%4,r=3+Math.pow(rand(),.84)*56,phi=arm*Math.PI/2+r*.09+(rand()-.5)*(.28+r*.0035);
  let x=Math.cos(phi)*r*10.1,y=Math.sin(phi)*r*10.1;
  let rad=.28+rand()*.96;
  g.globalAlpha=.090+rand()*.26;g.fillStyle=tones[arm];
  g.beginPath();g.arc(x,y,rad,0,Math.PI*2);g.fill();
 }
 g.globalAlpha=1;
 const core=g.createRadialGradient(0,0,0,0,0,172);
 core.addColorStop(0,isDawn?'rgba(231,203,166,.19)':'rgba(229,196,160,.25)');
 core.addColorStop(.17,isDawn?'rgba(198,166,147,.08)':'rgba(197,154,143,.12)');
 core.addColorStop(.50,'rgba(143,145,183,.035)');
 core.addColorStop(1,'rgba(180,148,202,0)');
 g.fillStyle=core;g.beginPath();g.arc(0,0,172,0,Math.PI*2);g.fill();
 const tex=new THREE.CanvasTexture(canvas);tex.needsUpdate=true;
 tex.minFilter=THREE.LinearFilter;tex.magFilter=THREE.LinearFilter;
 return tex;
}
function populateGalaxy(glow){
 const night=['#79b6cb','#d1b18d','#b4a8cd','#91c3b6'];
 const dawn=['#8dbdc9','#d5b69c','#c4adca','#9bc6bc'];
 nebulaTextures={night:nebulaTexture(false),paper:nebulaTexture(true)};
 nebulaPivot=new THREE.Group();
 galaxyGroup.add(nebulaPivot);
 nebulaMesh=new THREE.Mesh(new THREE.PlaneGeometry(128,128),
  new THREE.MeshBasicMaterial({
   map:theme==='night'?nebulaTextures.night:nebulaTextures.paper,
   side:THREE.DoubleSide,transparent:true,depthWrite:false,
   opacity:theme==='night'?.70:.64,blending:THREE.NormalBlending
  }));
 nebulaMesh.rotation.x=-Math.PI/2;nebulaMesh.position.y=-.65;
 nebulaPivot.add(nebulaMesh);
 let core=glow.clone();
 coreHalo=new THREE.Sprite(new THREE.SpriteMaterial({
  map:core,color:'#dbbca0',transparent:true,opacity:.155,
  blending:THREE.AdditiveBlending,depthWrite:false
 }));
 coreHalo.position.set(0,1.2,0);coreHalo.scale.set(15,15,1);
 galaxyGroup.add(coreHalo);
 // Thousands of perspective-correct particles at different depths.
 for(let arm=0;arm<4;arm++){
  let count=mobile?1700:3600,coords=[],nightColors=[],dawnColors=[];
  let seed=1001+arm*9999;
  function rand(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
  for(let i=0;i<count;i++){
   let r=2+Math.pow(rand(),.73)*57;
   let theta=arm*Math.PI/2+r*.09+(rand()-.5)*(.24+r*.003);
   let spread=(rand()-.5)*(1.5+r*.11);
   coords.push(Math.cos(theta)*r,spread,Math.sin(theta)*r);
   let c1=new THREE.Color(night[arm]).lerp(new THREE.Color('#e0ccac'),rand()*.12);
   let c2=new THREE.Color(dawn[arm]).lerp(new THREE.Color('#ded1bd'),rand()*.13);
   nightColors.push(c1.r,c1.g,c1.b);
   dawnColors.push(c2.r,c2.g,c2.b);
  }
  let geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(coords,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(theme==='night'?nightColors:dawnColors,3));
  let mat=new THREE.PointsMaterial({
   map:glow,alphaTest:.045,
   size:mobile?.64:.76,
   vertexColors:true,transparent:true,
   opacity:.70,depthWrite:false,
   blending:THREE.NormalBlending,sizeAttenuation:true
  });
  let pts=new THREE.Points(geo,mat);galaxyGroup.add(pts);
  starGroups.push({points:pts,speed:.011+arm*.002,nightColors,dawnColors});
 }
 // STAR_RIVER_V7_BALANCED: just a few brighter, crisp accents, never another broad glow layer.
 {
  const pos=[],cNight=[],cDawn=[];
  const nightAccent=['#c0e7ec','#f1d4ad','#d7c8ec','#c6e9df'];
  const dawnAccent=['#d0e3e7','#f0d5b8','#dccbe4','#cbe5d9'];
  let seed=76393;
  function rnd(){seed=(Math.imul(1664525,seed)+1013904223)>>>0;return seed/4294967296}
  for(let i=0;i<(mobile?96:216);i++){
   const arm=i%4,r=4+Math.pow(rnd(),.75)*54;
   const a=arm*Math.PI/2+r*.09+(rnd()-.5)*(.18+r*.002);
   pos.push(Math.cos(a)*r,(rnd()-.5)*(.8+r*.065),Math.sin(a)*r);
   let color1=new THREE.Color(nightAccent[arm]),color2=new THREE.Color(dawnAccent[arm]);
   cNight.push(color1.r,color1.g,color1.b);
   cDawn.push(color2.r,color2.g,color2.b);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.Float32BufferAttribute(theme==='night'?cNight:cDawn,3));
  glintPoints=new THREE.Points(geo,new THREE.PointsMaterial({
   map:glow,alphaTest:.08,size:mobile?.87:1.05,vertexColors:true,
   transparent:true,opacity:.69,depthWrite:false,
   blending:THREE.NormalBlending,sizeAttenuation:true
  }));
  glintColors={night:cNight,paper:cDawn};
  galaxyGroup.add(glintPoints);
 }
 // Delicate orbit engraving is secondary to the visible colored stellar rivers.
 for(let radius of [17,35,51]){
  let pts=[];for(let i=0;i<=220;i++){
   const a=i/220*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*radius,Math.sin(a*3)*.12,Math.sin(a)*radius));
  }
  let geo=new THREE.BufferGeometry().setFromPoints(pts);
  let r=new THREE.LineLoop(geo,new THREE.LineDashedMaterial({
   color:'#7a99ad',opacity:.075,transparent:true,dashSize:.32,gapSize:.45
  }));
  r.computeLineDistances();galaxyGroup.add(r);orbitRings.push(r);
 }
 let dust=[];let seed=234123;
 function rnd(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
 for(let i=0;i<(mobile?650:1800);i++){
  let r=14+rnd()*80,a=rnd()*Math.PI*2;
  dust.push(Math.cos(a)*r,(rnd()-.5)*34,Math.sin(a)*r);
 }
 let dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.Float32BufferAttribute(dust,3));
 dustCloud=new THREE.Points(dg,new THREE.PointsMaterial({
  map:glow,color:'#9baeba',size:.95,opacity:.13,
  transparent:true,blending:THREE.NormalBlending,depthWrite:false
 }));
 galaxyGroup.add(dustCloud);
}

function populatePlanets(glow){
 const loc=locations;let colors=['#e2af77','#db8d65','#8ad5dc','#cfb2d7','#e2cd9d','#87b9d3','#8fccc1','#ecc58a'];
 PROJECTS.forEach((p,i)=>{
  let g=new THREE.Group();g.position.set(...loc[i]);let radius=(i===0||i===5)?2.25:1.8;
  let mesh=new THREE.Mesh(new THREE.SphereGeometry(radius,42,30),new THREE.MeshStandardMaterial({map:texture(i),roughness:.89,metalness:0}));
  mesh.userData.index=i;g.add(mesh);
  let halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow,color:new THREE.Color(colors[i]),transparent:true,opacity:.58,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.set(radius*7,radius*7,1);g.add(halo);planetHalos.push(halo);
  let outline=new THREE.Mesh(new THREE.SphereGeometry(radius*1.08,32,20),new THREE.MeshBasicMaterial({color:colors[i],transparent:true,opacity:.07,side:THREE.BackSide,depthWrite:false}));g.add(outline);
  let curve=[];for(let j=0;j<=100;j++){let a=j/100*Math.PI*2;curve.push(new THREE.Vector3(Math.cos(a)*radius*1.68,Math.sin(a*2)*.10,Math.sin(a)*radius*1.68))}
  let ring=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(curve),new THREE.LineBasicMaterial({color:colors[i],opacity:.62,transparent:true}));ring.rotation.x=.30+i*.12;g.add(ring);
  g.userData={baseY:g.position.y,mesh,ring};scene.add(g);planets.push(g);meshes.push(mesh);labels.push(addLabel(p,i));
 });
 let ambient=new THREE.AmbientLight(0xffffff,.85);scene.add(ambient);
 let key=new THREE.PointLight(0xffd3ac,2.6,180);key.position.set(0,28,5);scene.add(key);
 let fill=new THREE.DirectionalLight(0xc2ddeb,.85);fill.position.set(20,45,30);scene.add(fill);
 lights={ambient,key,fill};
}
function fail(s){el('fail').classList.add('show');setText('reason',s)}
function init(){
 if(!window.THREE||!THREE.OrbitControls){fail('Three.js 或 OrbitControls 加载失败。可以通过星球索引访问全部作品。');return}
 try{renderer=new THREE.WebGLRenderer({antialias:!mobile,alpha:true,powerPreference:'high-performance'})}catch(e){fail('WebGL 不可用，请使用更新版 Chrome 或 Edge；仍可打开作品索引。');return}
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobile?1.4:1.65));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x091b2c,0);renderer.outputEncoding=THREE.sRGBEncoding;el('scene').appendChild(renderer.domElement);
 scene=new THREE.Scene();scene.fog=new THREE.FogExp2(theme==='night'?0x0a1b35:0x4c6685,theme==='night'?.0016:.0012);
 camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,420);camera.position.set(0,mobile?50:43,mobile?103:88);
 controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.058;controls.enablePan=true;controls.minDistance=8;controls.maxDistance=165;controls.autoRotate=!reduced;controls.autoRotateSpeed=.18;
 controls.minPolarAngle=.08;controls.maxPolarAngle=Math.PI*.9;
 galaxyGroup=new THREE.Group();scene.add(galaxyGroup);let glow=spriteTexture();
 populateGalaxy(glow);populatePlanets(glow);raycaster=new THREE.Raycaster();pointer=new THREE.Vector2();
 applyTheme();
 renderer.domElement.addEventListener('pointerdown',e=>{renderer.domElement._down=[e.clientX,e.clientY];el('hint').classList.add('hidden');el('intro').classList.add('faded')});
 renderer.domElement.addEventListener('pointerup',e=>{let d=renderer.domElement._down;if(!d||Math.hypot(e.clientX-d[0],e.clientY-d[1])>7)return;let idx=hit(e);if(idx>=0)focus(idx)});
 renderer.domElement.addEventListener('dblclick',e=>{let idx=hit(e);if(idx>=0)jump(idx)});
 window.addEventListener('resize',resize);
 started=true;requestAnimationFrame(animate)
}
function hit(e){
 let rect=renderer.domElement.getBoundingClientRect();
 pointer.x=(e.clientX-rect.left)/rect.width*2-1;pointer.y=-(e.clientY-rect.top)/rect.height*2+1;
 raycaster.setFromCamera(pointer,camera);let items=raycaster.intersectObjects(meshes,false);return items.length?items[0].object.userData.index:-1
}
function focus(i){
 showCard(i);if(!started)return;
 let target=planets[i].position.clone(),heading=camera.position.clone().sub(controls.target).normalize();
 let end=target.clone().addScaledVector(heading,i===0||i===5?15:12).add(new THREE.Vector3(0,3,0));
 flight={from:camera.position.clone(),to:end,lookFrom:controls.target.clone(),lookTo:target,t:0};
 controls.enabled=false;controls.autoRotate=false
}
function reset(){
 selected=-1;el('card').classList.remove('show');hidePanels();labels.forEach(x=>x.classList.remove('selected'));el('intro').classList.remove('faded');
 if(!started)return;
 flight={from:camera.position.clone(),to:new THREE.Vector3(0,mobile?50:43,mobile?103:88),lookFrom:controls.target.clone(),lookTo:new THREE.Vector3(),t:0};
 controls.enabled=false;controls.autoRotate=false
}
function updateLabels(){
 planets.forEach((g,i)=>{
  let v=g.position.clone();v.y+=2.5;v.project(camera);
  let x=(v.x*.5+.5)*innerWidth,y=(-v.y*.5+.5)*innerHeight;
  labels[i].style.left=x+'px';labels[i].style.top=y+'px';
  let front=v.z<1&&x>55&&x<innerWidth-55&&y>95&&y<innerHeight-100;
  if(selected>=0&&i!==selected&&camera.position.distanceTo(g.position)<28)front=false;
  labels[i].classList.toggle('hidden',!front);
 })
}
function animate(now){
 if(!started)return;requestAnimationFrame(animate);
 let dt=last?Math.min(.05,(now-last)/1000):0;last=now;
 if(!paused){clock+=dt*speed;starGroups.forEach(a=>a.points.rotation.y+=dt*a.speed*speed);if(nebulaPivot)nebulaPivot.rotation.y+=dt*.012*speed;if(glintPoints)glintPoints.rotation.y+=dt*.012*speed}
 planets.forEach((p,i)=>{p.position.y=p.userData.baseY+Math.sin(clock*.5+i*1.4)*.22;p.userData.mesh.rotation.y+=dt*.1;p.userData.ring.rotation.z+=dt*.10});
 if(flight){
  flight.t=Math.min(1,flight.t+dt*.88);let t=flight.t,k=t*t*(3-2*t);
  camera.position.copy(flight.from).lerp(flight.to,k);controls.target.copy(flight.lookFrom).lerp(flight.lookTo,k);
  if(t>=1){flight=null;controls.enabled=true;controls.autoRotate=selected<0&&!reduced}
 }
 controls.update();updateLabels();renderer.render(scene,camera)
}
function resize(){if(!started)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function applyTheme(){
 const dawn=theme==='paper';
 document.documentElement.dataset.theme=theme;
 if(renderer){
  renderer.setClearColor(0x091b2c,0);
  scene.fog.color.set(dawn?0x4c6685:0x0a1b35);
  scene.fog.density=dawn?.0012:.0016;
  starGroups.forEach(g=>{
   const attr=g.points.geometry.getAttribute('color');
   attr.array.set(dawn?g.dawnColors:g.nightColors);attr.needsUpdate=true;
   g.points.material.blending=THREE.NormalBlending;
   g.points.material.size=mobile?(dawn?.66:.64):(dawn?.79:.76);
   g.points.material.opacity=dawn?.72:.70;g.points.material.needsUpdate=true;
  });
  if(nebulaMesh){
   nebulaMesh.material.map=dawn?nebulaTextures.paper:nebulaTextures.night;
   nebulaMesh.material.opacity=dawn?.64:.70;
   nebulaMesh.material.blending=THREE.NormalBlending;
   nebulaMesh.material.needsUpdate=true;
  }
  if(coreHalo){coreHalo.material.opacity=dawn?.13:.155}
  if(glintPoints&&glintColors){const attr=glintPoints.geometry.getAttribute('color');attr.array.set(dawn?glintColors.paper:glintColors.night);attr.needsUpdate=true;glintPoints.material.opacity=dawn?.65:.69;glintPoints.material.needsUpdate=true}
  orbitRings.forEach(r=>{r.material.color.set(dawn?'#c6c6cc':'#7a99ad');r.material.opacity=dawn?.105:.075});
  planetHalos.forEach(h=>{h.material.opacity=dawn?.16:.20;h.material.blending=THREE.NormalBlending;h.material.needsUpdate=true});
  if(dustCloud){
   dustCloud.material.color.set(dawn?'#acb9c1':'#9baeba');
   dustCloud.material.opacity=dawn?.14:.13;
   dustCloud.material.blending=THREE.NormalBlending;
  }
  if(lights){
   lights.ambient.intensity=dawn?.68:.78;
   lights.key.intensity=dawn?1.15:1.85;
   lights.fill.intensity=dawn?.66:.72;
  }
 }
 el('palette').textContent=dawn?'☾ 深空':'☀ 暮光';
 const meta=document.querySelector('meta[name="theme-color"]');
 if(meta)meta.setAttribute('content',dawn?'#425f7d':'#050e20');
}
function setTheme(){
 theme=theme==='night'?'paper':'night';
 applyTheme();
 try{localStorage.setItem('star-theme',theme)}catch(e){}
}
function listen(){
 makeIndex();
 el('home').addEventListener('click',reset);el('reset').addEventListener('click',reset);
 el('index').addEventListener('click',openIndex);el('drawer-close').addEventListener('click',hidePanels);
 el('logs').addEventListener('click',()=>{el('card').classList.remove('show');el('drawer').classList.remove('show');el('journal').classList.add('show');journalList()});
 el('journal-close').addEventListener('click',hidePanels);el('card-close').addEventListener('click',reset);
 el('palette').addEventListener('click',setTheme);el('fail-index').addEventListener('click',()=>{el('fail').classList.remove('show');openIndex()});
 el('pause').addEventListener('click',()=>{paused=!paused;el('pause').textContent=paused?'▶ 恢复星流':'Ⅱ 暂停星流';el('pause').classList.toggle('active',!paused)});
 el('speed').addEventListener('input',e=>{speed=+e.target.value});
 el('next').addEventListener('click',()=>focus((selected+1+PROJECTS.length)%PROJECTS.length));
 el('prev').addEventListener('click',()=>focus((selected-1+PROJECTS.length)%PROJECTS.length));
 document.addEventListener('keydown',e=>{if(e.key==='Escape')reset();else if(e.key==='ArrowRight')focus((selected+1+PROJECTS.length)%PROJECTS.length);else if(e.key==='ArrowLeft')focus((selected-1+PROJECTS.length)%PROJECTS.length);else if(/^[1-9]$/.test(e.key)&&+e.key<=PROJECTS.length)focus(+e.key-1)})
}
listen();
if(document.readyState==='complete')init();else window.addEventListener('load',init,{once:true});
})();
