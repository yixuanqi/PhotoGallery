        function seededRandom(seed) {
            let x = Math.sin(seed) * 10000;
            return x - Math.floor(x);
        }

        function lonLatToXY(lon, lat, width, height) {
            return [((lon + 180) / 360) * width, ((90 - lat) / 180) * height];
        }

        function subdivideHandDrawnPolygon(pts, iterations = 3, roughness = 3.0, seedOffset = 1) {
            let current = pts.slice();
            for (let it = 0; it < iterations; it++) {
                const next = [];
                const scale = roughness / Math.pow(1.75, it);
                for (let i = 0; i < current.length; i++) {
                    const p1 = current[i];
                    const p2 = current[(i + 1) % current.length];
                    next.push(p1);
                    if (Math.abs(p1[1]) > 85 && Math.abs(p2[1]) > 85) continue;
                    const midLon = (p1[0] + p2[0]) * 0.5;
                    const midLat = (p1[1] + p2[1]) * 0.5;
                    const r1 = (seededRandom(i * 31.7 + it * 101 + seedOffset) - 0.5) * scale;
                    const r2 = (seededRandom(i * 73.3 + it * 211 + seedOffset) - 0.5) * scale * 0.75;
                    next.push([midLon + r1, Math.max(-89, Math.min(89, midLat + r2))]);
                }
                current = next;
            }
            return current;
        }

        function drawHandMountains(ctx, cx, cy, count, scale, inkColor) {
            ctx.save();
            ctx.strokeStyle = inkColor;
            ctx.lineWidth = 2.0 * scale;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            for (let i = 0; i < count; i++) {
                const ox = cx + (i - (count - 1) / 2) * 18 * scale;
                const oy = cy + (i % 2 === 0 ? -3 : 4) * scale;
                const h = (11 + (i % 2) * 4) * scale;
                const w = 12 * scale;
                ctx.beginPath();
                ctx.moveTo(ox - w, oy + h * 0.5);
                ctx.lineTo(ox, oy - h * 0.5);
                ctx.lineTo(ox + w, oy + h * 0.5);
                ctx.stroke();
                ctx.beginPath();
                for (let k = 1; k <= 3; k++) {
                    const t = k / 4;
                    ctx.moveTo(ox, oy - h * 0.5 + t * h);
                    ctx.lineTo(ox + w * t * 0.85, oy - h * 0.5 + t * h + 3 * scale);
                }
                ctx.stroke();
            }
            ctx.restore();
        }

        /***********************************************************************
         * 5. 程序化生成太阳系各星体手绘贴图 (离屏 Canvas 2D)
         ***********************************************************************/
        function generateEarthCanvas(themeKey) {
            const theme = THEMES[themeKey];
            const width = 1024, height = 512;
            const canvas = document.createElement('canvas');
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');

            const oceanGrad = ctx.createLinearGradient(0, 0, 0, height);
            oceanGrad.addColorStop(0, theme.oceanShallow);
            oceanGrad.addColorStop(0.5, theme.oceanDeep);
            oceanGrad.addColorStop(1, theme.oceanShallow);
            ctx.fillStyle = oceanGrad;
            ctx.fillRect(0, 0, width, height);

            // 水彩墨团
            for (let i = 0; i < 45; i++) {
                const bx = seededRandom(i * 19.3) * width;
                const by = seededRandom(i * 47.7) * height;
                const br = 30 + seededRandom(i * 83.1) * 90;
                const g = ctx.createRadialGradient(bx, by, br * 0.1, bx, by, br);
                g.addColorStop(0, i % 2 === 0 ? theme.oceanShallow : theme.oceanDeep);
                g.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.save();
                ctx.globalAlpha = 0.28;
                ctx.fillStyle = g;
                ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }

            // 经纬线
            ctx.save();
            ctx.strokeStyle = 'rgba(43, 33, 24, 0.22)';
            ctx.lineWidth = 1;
            ctx.setLineDash([4, 5]);
            for (let lat = -60; lat <= 60; lat += 30) {
                const y = ((90 - lat) / 180) * height;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }
            for (let lon = -150; lon <= 150; lon += 30) {
                const x = ((lon + 180) / 360) * width;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            ctx.restore();

            // 大陆多边形与手绘海岸线
            CONTINENT_POLYGONS.forEach((continent, cIdx) => {
                const subPts = subdivideHandDrawnPolygon(continent.points, 3, 2.8, cIdx * 17 + 5);
                const pixelPts = subPts.map(([lon, lat]) => lonLatToXY(lon, lat, width, height));

                ctx.save();
                ctx.beginPath();
                pixelPts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
                ctx.closePath();
                ctx.strokeStyle = 'rgba(54, 102, 117, 0.35)';
                ctx.lineWidth = 7;
                ctx.stroke();

                ctx.fillStyle = theme[continent.colorType] || theme.landFill;
                ctx.fill();
                ctx.clip();

                ctx.globalAlpha = 0.2;
                ctx.strokeStyle = theme.inkColor;
                ctx.lineWidth = 1;
                for (let hLine = -height; hLine < width + height; hLine += 8) {
                    ctx.beginPath();
                    ctx.moveTo(hLine, 0);
                    ctx.lineTo(hLine - height * 0.6, height);
                    ctx.stroke();
                }
                ctx.restore();

                ctx.save();
                ctx.beginPath();
                pixelPts.forEach(([x, y], i) => i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y));
                ctx.closePath();
                ctx.strokeStyle = theme.inkColor;
                ctx.lineWidth = 2.0;
                ctx.stroke();
                ctx.restore();
            });

            // 标志性山脉
            [[86, 30, 4], [-110, 44, 3], [-70, -22, 3]].forEach(([lon, lat, cnt]) => {
                const [mx, my] = lonLatToXY(lon, lat, width, height);
                drawHandMountains(ctx, mx, my, cnt, 0.7, theme.inkColor);
            });

            return canvas;
        }

        function generatePlanetCanvas(bodyId, themeKey) {
            if (bodyId === 'earth') return generateEarthCanvas(themeKey);

            const theme = THEMES[themeKey];
            const isInk = themeKey === 'ink';
            const w = 1024, h = 512;
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');

            if (bodyId === 'sun') {
                const g = ctx.createLinearGradient(0, 0, 0, h);
                g.addColorStop(0, isInk ? '#e8cfa0' : '#f9d976');
                g.addColorStop(0.5, isInk ? '#d9a86c' : '#f38337');
                g.addColorStop(1, isInk ? '#e8cfa0' : '#f9d976');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, w, h);

                // 水彩烈焰斑块与手绘涡流线
                for (let i = 0; i < 65; i++) {
                    const x = seededRandom(i * 17) * w;
                    const y = seededRandom(i * 31) * h;
                    const r = 20 + seededRandom(i * 43) * 70;
                    ctx.save();
                    ctx.globalAlpha = 0.35;
                    ctx.fillStyle = i % 2 === 0 ? '#e35326' : '#fcee9e';
                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }

                // 太阳黑子与放射钢笔排线
                ctx.strokeStyle = '#381c0e';
                ctx.lineWidth = 1.6;
                for (let i = 0; i < 18; i++) {
                    const sx = seededRandom(i * 71) * w;
                    const sy = (0.2 + seededRandom(i * 89) * 0.6) * h;
                    const sr = 6 + seededRandom(i * 103) * 14;
                    ctx.fillStyle = '#2b160b';
                    ctx.beginPath(); ctx.arc(sx, sy, sr * 0.55, 0, Math.PI * 2); ctx.fill();
                    for (let a = 0; a < 12; a++) {
                        const ang = (a / 12) * Math.PI * 2;
                        ctx.beginPath();
                        ctx.moveTo(sx + Math.cos(ang) * sr * 0.6, sy + Math.sin(ang) * sr * 0.6);
                        ctx.lineTo(sx + Math.cos(ang) * sr * 1.4, sy + Math.sin(ang) * sr * 1.4);
                        ctx.stroke();
                    }
                }
            } else if (bodyId === 'mercury' || bodyId === 'comet') {
                ctx.fillStyle = isInk ? '#e4d7bf' : (bodyId === 'comet' ? '#dceef2' : '#c9bba3');
                ctx.fillRect(0, 0, w, h);
                // 环形山与手绘阴影排线
                for (let i = 0; i < 55; i++) {
                    const cx = seededRandom(i * 23) * w;
                    const cy = (0.1 + seededRandom(i * 41) * 0.8) * h;
                    const cr = 8 + seededRandom(i * 59) * 28;
                    ctx.fillStyle = i % 2 === 0 ? '#b3a38b' : '#dfd3be';
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.arc(cx, cy, cr, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    // 坑内单侧排线
                    ctx.beginPath();
                    for (let k = -cr * 0.6; k <= cr * 0.6; k += 4) {
                        ctx.moveTo(cx - cr * 0.5, cy + k);
                        ctx.lineTo(cx, cy + k + 3);
                    }
                    ctx.stroke();
                }
            } else if (bodyId === 'venus') {
                ctx.fillStyle = isInk ? '#ecdcc0' : '#edd092';
                ctx.fillRect(0, 0, w, h);
                const colors = isInk ? ['#dfd0b2', '#cfb994', '#f5ebd6'] : ['#e0a958', '#f5e0ae', '#c98838'];
                for (let b = 0; b < 18; b++) {
                    const yBase = (b / 18) * h;
                    ctx.fillStyle = colors[b % colors.length];
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 1.8;
                    ctx.beginPath();
                    ctx.moveTo(0, yBase);
                    for (let x = 0; x <= w; x += 32) {
                        const wy = yBase + Math.sin((x / w) * Math.PI * 4 + b) * 16;
                        ctx.lineTo(x, wy);
                    }
                    ctx.lineTo(w, yBase + 36);
                    ctx.lineTo(0, yBase + 36);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }
            } else if (bodyId === 'mars') {
                ctx.fillStyle = isInk ? '#e2cbb0' : '#d67347';
                ctx.fillRect(0, 0, w, h);
                // 赭石与赤铁水彩斑块
                for (let i = 0; i < 45; i++) {
                    const x = seededRandom(i * 19) * w;
                    const y = seededRandom(i * 37) * h;
                    const r = 30 + seededRandom(i * 61) * 90;
                    ctx.save();
                    ctx.globalAlpha = 0.4;
                    ctx.fillStyle = isInk ? '#c9b090' : (i % 2 === 0 ? '#b04825' : '#e89563');
                    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
                    ctx.restore();
                }
                // 南北极冰冠留白
                ctx.fillStyle = '#fbf8f0';
                ctx.strokeStyle = theme.inkColor;
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(0, 0); ctx.lineTo(w, 0); ctx.lineTo(w, 42);
                for (let x = w; x >= 0; x -= 32) ctx.lineTo(x, 42 + Math.sin(x * 0.03) * 10);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, h); ctx.lineTo(w, h); ctx.lineTo(w, h - 42);
                for (let x = w; x >= 0; x -= 32) ctx.lineTo(x, h - 42 + Math.cos(x * 0.03) * 10);
                ctx.closePath(); ctx.fill(); ctx.stroke();

                // 奥林帕斯山与水手号峡谷
                drawHandMountains(ctx, w * 0.35, h * 0.42, 3, 1.5, theme.inkColor);
                ctx.strokeStyle = theme.inkColor;
                ctx.lineWidth = 4.5;
                ctx.beginPath();
                ctx.moveTo(w * 0.52, h * 0.52);
                ctx.quadraticCurveTo(w * 0.65, h * 0.48, w * 0.78, h * 0.54);
                ctx.stroke();
            } else if (bodyId === 'jupiter' || bodyId === 'saturn') {
                const palette = bodyId === 'jupiter'
                    ? (isInk ? ['#efe4ce', '#d8c5a4', '#bfa682', '#e8d8bc', '#c99b78'] : ['#f3e3c6', '#d99962', '#b86339', '#e8c492', '#ce7c48'])
                    : (isInk ? ['#f2e7d2', '#dfd0b4', '#cbb896', '#e9dcc2'] : ['#f4e4bc', '#dfbe82', '#c79f5e', '#ebd29c']);

                const bandCount = bodyId === 'jupiter' ? 16 : 12;
                for (let b = 0; b < bandCount; b++) {
                    const y0 = (b / bandCount) * h;
                    const bh = h / bandCount + 8;
                    ctx.fillStyle = palette[b % palette.length];
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(0, y0);
                    for (let x = 0; x <= w; x += 24) {
                        const wave = Math.sin((x / w) * Math.PI * 6 + b * 1.3) * (bodyId === 'jupiter' ? 7 : 3);
                        ctx.lineTo(x, y0 + wave);
                    }
                    ctx.lineTo(w, y0 + bh);
                    ctx.lineTo(0, y0 + bh);
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();
                }

                // 木星大红斑
                if (bodyId === 'jupiter') {
                    const rx = w * 0.62, ry = h * 0.66;
                    ctx.save();
                    ctx.translate(rx, ry);
                    ctx.fillStyle = isInk ? '#c28b68' : '#d44b30';
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.ellipse(0, 0, 56, 32, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(0, 0, 38, 20, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.beginPath(); ctx.ellipse(0, 0, 18, 9, 0, 0, Math.PI * 2); ctx.stroke();
                    ctx.restore();
                }
            } else if (bodyId === 'uranus' || bodyId === 'neptune') {
                const baseCol = bodyId === 'uranus'
                    ? (isInk ? '#dce4de' : '#96d2d9')
                    : (isInk ? '#c7d2dc' : '#3d6ea3');
                ctx.fillStyle = baseCol;
                ctx.fillRect(0, 0, w, h);

                for (let b = 0; b < 10; b++) {
                    const y = (b / 10) * h;
                    ctx.strokeStyle = bodyId === 'uranus' ? 'rgba(43, 65, 70, 0.35)' : 'rgba(20, 35, 65, 0.45)';
                    ctx.lineWidth = 12;
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.bezierCurveTo(w * 0.3, y + 12, w * 0.7, y - 12, w, y);
                    ctx.stroke();
                }

                if (bodyId === 'neptune') {
                    // 海王星大暗斑与高空卷云白线
                    ctx.fillStyle = isInk ? '#8c9aa8' : '#1f3d66';
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 2.2;
                    ctx.beginPath(); ctx.ellipse(w * 0.45, h * 0.6, 44, 24, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                    ctx.strokeStyle = '#fffdf8';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(w * 0.25, h * 0.38); ctx.quadraticCurveTo(w * 0.45, h * 0.34, w * 0.65, h * 0.40);
                    ctx.moveTo(w * 0.35, h * 0.74); ctx.quadraticCurveTo(w * 0.55, h * 0.78, w * 0.72, h * 0.72);
                    ctx.stroke();
                }
            }

            // 通用手绘经纬参考细线与斜排线质感
            ctx.save();
            ctx.strokeStyle = theme.inkColor;
            ctx.globalAlpha = 0.14;
            ctx.lineWidth = 1;
            for (let i = -h; i < w + h; i += 14) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i - h * 0.5, h);
                ctx.stroke();
            }
            ctx.restore();

            return canvas;
        }

        // 生成手绘同心排线土星环贴图
        function generateSaturnRingCanvas(themeKey) {
            const theme = THEMES[themeKey];
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2, cy = size / 2;

            // RingGeometry UV 默认映射直接用极坐标半径绘制同心圆环
            for (let r = 115; r <= 245; r += 2.5) {
                // 卡西尼环缝留白
                if (r > 192 && r < 206) continue;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                if (r === 115 || r >= 243 || Math.abs(r - 192) < 2 || Math.abs(r - 206) < 2) {
                    ctx.strokeStyle = theme.inkColor;
                    ctx.lineWidth = 2.4;
                    ctx.globalAlpha = 0.9;
                } else {
                    ctx.strokeStyle = r % 5 === 0 ? theme.inkColor : '#d8be8c';
                    ctx.lineWidth = r % 5 === 0 ? 1.2 : 2.2;
                    ctx.globalAlpha = r % 5 === 0 ? 0.55 : 0.78;
                }
                ctx.stroke();
            }
            return canvas;
        }

        /***********************************************************************
         * 6. 全屏纸张颗粒叠加层生成
         ***********************************************************************/
        function renderPaperGrainOverlay() {
            const canvas = document.getElementById('paper-overlay');
            const w = 512, h = 512;
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(w, h);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const grain = 218 + Math.floor((Math.random() - 0.5) * 52);
                data[i] = grain;
                data[i + 1] = grain - 6;
                data[i + 2] = grain - 16;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            ctx.strokeStyle = 'rgba(70, 50, 30, 0.08)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 280; i++) {
                const x = Math.random() * w, y = Math.random() * h;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + (Math.random() - 0.5) * 14, y + (Math.random() - 0.5) * 14);
                ctx.stroke();
            }
        }

        /***********************************************************************
         * 7. 自定义 GLSL 着色器：世界空间太阳点光源 + 三层手绘钢笔交叉排线
         ***********************************************************************/
        const planetVertexShader = `
            varying vec2 vUv;
            varying vec3 vWorldNormal;
            varying vec3 vWorldPosition;
            varying vec3 vViewDir;

            void main() {
                vUv = uv;
                vec4 worldPos = modelMatrix * vec4(position, 1.0);
                vWorldPosition = worldPos.xyz;
                vWorldNormal = normalize(mat3(modelMatrix) * normal);
                vViewDir = normalize(cameraPosition - worldPos.xyz);
                gl_Position = projectionMatrix * viewMatrix * worldPos;
            }
        `;

        const planetFragmentShader = `
            uniform sampler2D uMap;
            uniform vec3 uSunWorldPos;
            uniform float uPhaseOffsetRad;
            uniform vec3 uPaperTint;
            uniform vec3 uShadowInk;
            uniform vec3 uWarmLight;
            uniform float uHatchDensity;
            uniform float uTime;
            uniform float uIsSun;

            varying vec2 vUv;
            varying vec3 vWorldNormal;
            varying vec3 vWorldPosition;
            varying vec3 vViewDir;

            float hash(vec2 p) {
                return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123);
            }

            void main() {
                vec4 texColor = texture2D(uMap, vUv);
                vec3 normal = normalize(vWorldNormal);
                vec3 viewDir = normalize(vViewDir);

                // 若是太阳本体：自发光水彩 + 沸腾排线纹理 + 浓墨手绘外框
                if (uIsSun > 0.5) {
                    vec2 sunUV = vUv * vec2(180.0, 90.0);
                    float boil = sin(sunUV.x * 0.4 + uTime * 2.2) * cos(sunUV.y * 0.4 - uTime * 1.8);
                    float sunHatch = step(0.65, sin((sunUV.x + sunUV.y) * 1.2 + boil * 2.0));
                    vec3 sunCol = texColor.rgb * 1.06;
                    sunCol = mix(sunCol, uShadowInk, (1.0 - sunHatch) * 0.14);

                    float fresnel = 1.0 - max(dot(viewDir, normal), 0.0);
                    float edge = smoothstep(0.72, 0.88, fresnel);
                    sunCol = mix(sunCol, uShadowInk, edge * 0.88);
                    gl_FragColor = vec4(sunCol, 1.0);
                    return;
                }

                // 计算从行星片元指向中心太阳的光照方向，并叠加用户手动排线相位偏移角
                vec3 rawLightDir = normalize(uSunWorldPos - vWorldPosition);
                float c = cos(uPhaseOffsetRad);
                float s = sin(uPhaseOffsetRad);
                vec3 rotatedLightDir = normalize(vec3(
                    rawLightDir.x * c - rawLightDir.z * s,
                    rawLightDir.y + 0.18,
                    rawLightDir.x * s + rawLightDir.z * c
                ));

                float ndotl = dot(normal, rotatedLightDir);

                // 卡通阶梯化明暗过渡
                float lightStep = smoothstep(-0.22, 0.35, ndotl);
                float midShadow = smoothstep(0.32, -0.12, ndotl);
                float deepShadow = smoothstep(0.05, -0.45, ndotl);

                // 程序化三层钢笔交叉排线 (Cross-Hatching)
                vec2 hatchUV = vUv * vec2(260.0, 130.0);
                float wobble = sin(hatchUV.x * 0.25 + hatchUV.y * 0.25) * 1.4;

                float hatch1 = step(0.32, sin((hatchUV.x + hatchUV.y) * 1.85 + wobble));
                float hatch2 = step(0.28, sin((hatchUV.x - hatchUV.y) * 1.85 - wobble));
                float hatch3 = step(0.35, sin(hatchUV.y * 2.6 + wobble));

                float inkMask = 0.0;
                if (midShadow > 0.05) {
                    inkMask = max(inkMask, (1.0 - hatch1) * midShadow * 0.62 * uHatchDensity);
                }
                if (deepShadow > 0.05) {
                    inkMask = max(inkMask, (1.0 - hatch2) * deepShadow * 0.78 * uHatchDensity);
                }
                if (ndotl < -0.35) {
                    float coreDark = smoothstep(-0.35, -0.75, ndotl);
                    inkMask = max(inkMask, (1.0 - hatch3) * coreDark * 0.86 * uHatchDensity);
                }

                vec3 baseColor = texColor.rgb;
                vec3 litColor = mix(baseColor * 0.84 * uPaperTint, baseColor * uWarmLight, lightStep);
                vec3 finalColor = mix(litColor, uShadowInk, clamp(inkMask, 0.0, 0.88));

                // 边缘 Fresnel 墨水轮廓
                float fresnel = 1.0 - max(dot(viewDir, normal), 0.0);
                float rimWobble = sin(vUv.x * 160.0 + vUv.y * 120.0 + uTime * 1.5) * 0.035;
                float inkEdge = smoothstep(0.75 + rimWobble, 0.89 + rimWobble, fresnel);
                finalColor = mix(finalColor, uShadowInk, inkEdge * 0.92);

                float grain = (hash(vUv * 800.0) - 0.5) * 0.04;
                finalColor += grain;

                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        // 背面扩张手绘墨水描边着色器
        const outlineVertexShader = `
            uniform float uThickness;
            uniform float uTime;
            void main() {
                float wobble = sin(position.x * 8.0 + position.y * 10.0 + uTime * 2.0) * 0.2
                             + cos(position.z * 11.0 - uTime * 1.5) * 0.15;
                vec3 displaced = position + normal * (uThickness * (1.0 + wobble));
                gl_Position = projectionMatrix * modelViewMatrix * vec4(displaced, 1.0);
            }
        `;

        const outlineFragmentShader = `
            uniform vec3 uInkColor;
            void main() {
                gl_FragColor = vec4(uInkColor, 1.0);
            }
        `;

        /***********************************************************************
         * 8. Three.js 太阳系天体运行仪场景构建
         ***********************************************************************/
        let scene, camera, renderer, controls;
        let currentTheme = 'watercolor';
        let orbitSpeedMultiplier = 0.8;
        let phaseOffsetDeg = 0;

        let showOrbits = true;
        let showAsteroids = true;
        let showCloudsAndRings = true;
        let showPins = true;

        // 交互模式：'solar' (太阳系全景或天体跟随) | 'earth_landmarks' (地球表面8大奇观下钻)
        let activeMode = 'solar';
        let focusedBodyId = null;      // 当前聚焦的太阳系天体 ID
        let focusedLandmarkId = null;  // 当前聚焦的地球地标 ID

        const visitedBodies = new Set();
        const visitedLandmarks = new Set();

        // 场景对象字典与集合
        const bodyNodes = {};       // id -> { data, orbitAngle, rootGroup, spinGroup, mesh, outlineMesh, uniforms, pinEl, extraGroups }
        const earthLandmarkPins = [];
        let orbitsMasterGroup, asteroidBeltGroup, grandAstrolabeGroup;
        let earthCloudsGroup, earthMoonGroup, earthPins3DGroup;

        // 相机平滑追踪过渡状态
        let cameraTransition = null;

        function latLonToVector3(lat, lon, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -(radius * Math.sin(phi) * Math.cos(theta)),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 450);
            camera.position.set(0, 32, 58);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.06;
            controls.enablePan = false;
            controls.minDistance = 1.8;
            controls.maxDistance = 135;
            controls.rotateSpeed = 0.65;

            // 环境光与中心点光源（供立体云朵、小行星与3D图钉使用）
            const ambientLight = new THREE.AmbientLight(0xfff8e7, 0.82);
            scene.add(ambientLight);
            const sunPointLight = new THREE.PointLight(0xfff0cc, 1.1, 160);
            sunPointLight.position.set(0, 0, 0);
            scene.add(sunPointLight);

            orbitsMasterGroup = new THREE.Group();
            scene.add(orbitsMasterGroup);

            // 1. 创建外围巨型复古天球仪黄道大环与背景手绘星辰
            createGrandAstrolabeAndStars();

            // 2. 创建太阳系 10 大天体及其轨道、伴星、光环與 2D 投影标签
            createSolarSystemBodies();

            // 3. 创建火星与木星之间的手绘小行星带
            createAsteroidBelt();

            // 4. 在地球上绑定 8 大奇观 3D 图钉与 2D 标签
            createEarthSurfaceLandmarks();

            window.addEventListener('resize', onWindowResize);
            setupRaycasterInteraction();
        }

        /***********************************************************************
         * 9. 创建外围巨型天球仪星盘环与背景手绘十字星辰
         ***********************************************************************/
        function createGrandAstrolabeAndStars() {
            grandAstrolabeGroup = new THREE.Group();
            orbitsMasterGroup.add(grandAstrolabeGroup);

            const themeCfg = THEMES[currentTheme];
            const ringMat = new THREE.MeshBasicMaterial({
                color: themeCfg.astrolabeColor,
                transparent: true,
                opacity: 0.45
            });

            // 外圈黄道刻度大环 (Radius = 42)
            const outerTorus = new THREE.Mesh(new THREE.TorusGeometry(42, 0.08, 12, 160), ringMat);
            outerTorus.rotation.x = Math.PI / 2;
            grandAstrolabeGroup.add(outerTorus);

            // 72 道黄道刻度短线
            const tickPositions = [];
            for (let i = 0; i < 72; i++) {
                const ang = (i / 72) * Math.PI * 2;
                const rIn = 42.1;
                const rOut = i % 6 === 0 ? 43.6 : 42.8;
                tickPositions.push(
                    Math.cos(ang) * rIn, 0, Math.sin(ang) * rIn,
                    Math.cos(ang) * rOut, 0, Math.sin(ang) * rOut
                );
            }
            const tickGeo = new THREE.BufferGeometry();
            tickGeo.setAttribute('position', new THREE.Float32BufferAttribute(tickPositions, 3));
            const tickLines = new THREE.LineSegments(tickGeo, new THREE.LineBasicMaterial({
                color: themeCfg.astrolabeColor,
                transparent: true,
                opacity: 0.45
            }));
            grandAstrolabeGroup.add(tickLines);

            // 倾斜子午天球大环
            const tiltedRing = new THREE.Mesh(new THREE.TorusGeometry(43.2, 0.06, 12, 160), ringMat);
            tiltedRing.rotation.x = Math.PI / 2.6;
            tiltedRing.rotation.y = Math.PI / 6;
            grandAstrolabeGroup.add(tiltedRing);

            grandAstrolabeGroup.userData = { ringMat, tickLines };

            // 远景手绘四角星辰 Sprites
            const starCanvas = document.createElement('canvas');
            starCanvas.width = 64; starCanvas.height = 64;
            const sCtx = starCanvas.getContext('2d');
            sCtx.strokeStyle = '#3a2e21';
            sCtx.fillStyle = '#f8e6a0';
            sCtx.lineWidth = 3;
            sCtx.beginPath();
            sCtx.moveTo(32, 4); sCtx.quadraticCurveTo(32, 32, 60, 32);
            sCtx.quadraticCurveTo(32, 32, 32, 60); sCtx.quadraticCurveTo(32, 32, 4, 32);
            sCtx.quadraticCurveTo(32, 32, 32, 4);
            sCtx.fill(); sCtx.stroke();

            const starTex = new THREE.CanvasTexture(starCanvas);
            const starMat = new THREE.SpriteMaterial({ map: starTex, transparent: true, opacity: 0.72 });

            for (let i = 0; i < 85; i++) {
                const sp = new THREE.Sprite(starMat);
                const r = 55 + Math.random() * 45;
                const theta = Math.random() * Math.PI * 2;
                const phi = (Math.random() - 0.5) * Math.PI * 0.85;
                sp.position.set(
                    r * Math.cos(phi) * Math.cos(theta),
                    r * Math.sin(phi),
                    r * Math.cos(phi) * Math.sin(theta)
                );
                const s = 0.5 + Math.random() * 0.8;
                sp.scale.set(s, s, 1);
                scene.add(sp);
            }
        }

        /***********************************************************************
         * 10. 创建太阳系 10 大天体及其专属手绘装饰组件
         ***********************************************************************/
        function createSolarSystemBodies() {
            const themeCfg = THEMES[currentTheme];
            const pinsContainer = document.getElementById('pins-container');
            const dockContainer = document.getElementById('dock-buttons');
            dockContainer.innerHTML = '';

            CELESTIAL_BODIES.forEach((body) => {
                const rootGroup = new THREE.Group();
                scene.add(rootGroup);

                const spinGroup = new THREE.Group();
                spinGroup.rotation.z = body.tilt || 0;
                rootGroup.add(spinGroup);

                // 生成该天体的程序化手绘贴图
                const texCanvas = generatePlanetCanvas(body.id, currentTheme);
                const tex = new THREE.CanvasTexture(texCanvas);
                tex.anisotropy = renderer.capabilities.getMaxAnisotropy();

                const uniforms = {
                    uMap: { value: tex },
                    uSunWorldPos: { value: new THREE.Vector3(0, 0, 0) },
                    uPhaseOffsetRad: { value: 0 },
                    uPaperTint: { value: themeCfg.paperTint.clone() },
                    uShadowInk: { value: themeCfg.shadowInk.clone() },
                    uWarmLight: { value: themeCfg.warmLight.clone() },
                    uHatchDensity: { value: themeCfg.hatchDensity },
                    uTime: { value: 0 },
                    uIsSun: { value: body.id === 'sun' ? 1.0 : 0.0 }
                };

                const geo = new THREE.SphereGeometry(body.radius, 64, 64);
                const mat = new THREE.ShaderMaterial({
                    vertexShader: planetVertexShader,
                    fragmentShader: planetFragmentShader,
                    uniforms
                });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData = { bodyId: body.id };
                spinGroup.add(mesh);

                // 背面扩张手绘墨水描边壳
                const outGeo = new THREE.SphereGeometry(body.radius, 48, 48);
                const outMat = new THREE.ShaderMaterial({
                    vertexShader: outlineVertexShader,
                    fragmentShader: outlineFragmentShader,
                    uniforms: {
                        uThickness: { value: body.radius * 0.035 + 0.012 },
                        uTime: { value: 0 },
                        uInkColor: { value: themeCfg.shadowInk.clone() }
                    },
                    side: THREE.BackSide
                });
                const outlineMesh = new THREE.Mesh(outGeo, outMat);
                spinGroup.add(outlineMesh);

                // 绘制该天体的手绘公转轨道线
                if (body.orbitRadius > 0) {
                    const orbitPts = [];
                    const segs = 160;
                    for (let i = 0; i <= segs; i++) {
                        const a = (i / segs) * Math.PI * 2;
                        if (body.isComet) {
                            // 哈雷彗星：大偏心率倾斜椭圆轨道
                            const rx = 22.5, rz = 12.5;
                            const cx = Math.cos(a) * rx - 10.5;
                            const cz = Math.sin(a) * rz;
                            const cy = Math.sin(a) * 5.2;
                            orbitPts.push(new THREE.Vector3(cx, cy, cz));
                        } else {
                            orbitPts.push(new THREE.Vector3(Math.cos(a) * body.orbitRadius, 0, Math.sin(a) * body.orbitRadius));
                        }
                    }
                    const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPts);
                    const orbitMat = new THREE.LineDashedMaterial({
                        color: themeCfg.orbitColor,
                        dashSize: body.isComet ? 0.5 : 0.65,
                        gapSize: body.isComet ? 0.35 : 0.35,
                        transparent: true,
                        opacity: body.isComet ? 0.65 : 0.55
                    });
                    const orbitLine = new THREE.Line(orbitGeo, orbitMat);
                    orbitLine.computeLineDistances();
                    orbitsMasterGroup.add(orbitLine);
                }

                // 各星体专属手绘附加结构
                const extra = {};

                // A. 太阳专属：手绘日珥锯齿环与柔光光晕
                if (body.id === 'sun') {
                    const glowCanvas = document.createElement('canvas');
                    glowCanvas.width = 256; glowCanvas.height = 256;
                    const gCtx = glowCanvas.getContext('2d');
                    const grad = gCtx.createRadialGradient(128, 128, 20, 128, 128, 124);
                    grad.addColorStop(0, 'rgba(255, 220, 130, 0.85)');
                    grad.addColorStop(0.5, 'rgba(235, 130, 60, 0.32)');
                    grad.addColorStop(1, 'rgba(235, 130, 60, 0)');
                    gCtx.fillStyle = grad;
                    gCtx.fillRect(0, 0, 256, 256);

                    // 绘制太阳外圈放射手绘光芒线条
                    gCtx.strokeStyle = 'rgba(180, 75, 30, 0.45)';
                    gCtx.lineWidth = 2;
                    for (let i = 0; i < 24; i++) {
                        const ang = (i / 24) * Math.PI * 2;
                        gCtx.beginPath();
                        gCtx.moveTo(128 + Math.cos(ang) * 58, 128 + Math.sin(ang) * 58);
                        gCtx.lineTo(128 + Math.cos(ang) * 112, 128 + Math.sin(ang) * 112);
                        gCtx.stroke();
                    }

                    const glowSprite = new THREE.Sprite(new THREE.SpriteMaterial({
                        map: new THREE.CanvasTexture(glowCanvas),
                        transparent: true,
                        depthWrite: false
                    }));
                    glowSprite.scale.set(11.5, 11.5, 1);
                    rootGroup.add(glowSprite);
                    extra.glowSprite = glowSprite;
                }

                // B. 地球专属：立体手绘云朵群 + 伴星月球轨道系统
                if (body.id === 'earth') {
                    earthCloudsGroup = createEarthClouds(body.radius, themeCfg);
                    spinGroup.add(earthCloudsGroup);

                    earthMoonGroup = createEarthMoonSystem(body.radius, themeCfg);
                    rootGroup.add(earthMoonGroup);
                }

                // C. 木星专属：4 颗伽利略卫星小点与迷你环绕轨迹
                if (body.id === 'jupiter') {
                    const moonsGroup = new THREE.Group();
                    [2.4, 2.9, 3.4, 4.0].forEach((mr, mIdx) => {
                        const mGeo = new THREE.SphereGeometry(0.08 + (mIdx % 2) * 0.02, 12, 12);
                        const mMesh = new THREE.Mesh(mGeo, new THREE.MeshBasicMaterial({ color: 0xf4e8ce }));
                        const mOut = new THREE.Mesh(
                            new THREE.SphereGeometry(0.11 + (mIdx % 2) * 0.02, 10, 10),
                            new THREE.MeshBasicMaterial({ color: 0x2b2118, side: THREE.BackSide })
                        );
                        mMesh.add(mOut);
                        mMesh.userData = { dist: mr, angle: mIdx * 1.6, speed: 1.8 - mIdx * 0.3 };
                        moonsGroup.add(mMesh);
                    });
                    rootGroup.add(moonsGroup);
                    extra.jupiterMoons = moonsGroup;
                }

                // D. 土星专属：手绘同心排线土星环
                if (body.id === 'saturn') {
                    const ringCanvas = generateSaturnRingCanvas(currentTheme);
                    const ringTex = new THREE.CanvasTexture(ringCanvas);
                    const ringGeo = new THREE.PlaneGeometry(6.8, 6.8);
                    const ringMat = new THREE.MeshBasicMaterial({
                        map: ringTex,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false
                    });
                    const ringMesh = new THREE.Mesh(ringGeo, ringMat);
                    ringMesh.rotation.x = Math.PI / 2;
                    spinGroup.add(ringMesh);
                    extra.saturnRing = ringMesh;
                }

                // E. 天王星专属：纵向 90° 倾角手绘细环
                if (body.id === 'uranus') {
                    const uRingGeo = new THREE.TorusGeometry(1.75, 0.018, 8, 96);
                    const uRingMat = new THREE.MeshBasicMaterial({ color: themeCfg.orbitColor, transparent: true, opacity: 0.7 });
                    const uRing = new THREE.Mesh(uRingGeo, uRingMat);
                    spinGroup.add(uRing);
                    extra.uranusRing = uRing;
                }

                // F. 哈雷彗星专属：背向太阳的动态手绘弧形排线彗尾
                if (body.id === 'comet') {
                    const tailGroup = new THREE.Group();
                    const tailLineMat = new THREE.LineDashedMaterial({
                        color: 0x8ccad9,
                        dashSize: 0.25,
                        gapSize: 0.12,
                        transparent: true,
                        opacity: 0.82
                    });
                    for (let t = -2; t <= 2; t++) {
                        const pts = [];
                        for (let k = 0; k <= 20; k++) {
                            const frac = k / 20;
                            pts.push(new THREE.Vector3(
                                frac * 3.8,
                                t * frac * 0.45 + Math.sin(frac * 3.0) * 0.12,
                                frac * frac * 0.85 * (t * 0.3 + 1)
                            ));
                        }
                        const lGeo = new THREE.BufferGeometry().setFromPoints(pts);
                        const line = new THREE.Line(lGeo, tailLineMat);
                        line.computeLineDistances();
                        tailGroup.add(line);
                    }
                    rootGroup.add(tailGroup);
                    extra.cometTail = tailGroup;
                }

                // 创建 2D 屏幕浮动标签
                const pinEl = document.createElement('div');
                pinEl.className = 'celestial-pin';
                pinEl.innerHTML = `
                    <div class="celestial-pin-badge">
                        <span class="text-[#c85a32] font-bold">${body.symbol}</span>
                        <span>${body.shortName}</span>
                    </div>
                    <div class="celestial-pin-stem"></div>
                `;
                pinEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    focusOnCelestialBody(body.id);
                });
                pinsContainer.appendChild(pinEl);

                // 创建左侧星历序列快捷导航按钮
                const dockBtn = document.createElement('button');
                dockBtn.className = 'dock-item sketch-btn px-2.5 py-1 text-xs font-bold flex items-center gap-1.5 whitespace-nowrap';
                dockBtn.dataset.id = body.id;
                dockBtn.innerHTML = `<span class="text-[#c85a32] font-serif text-sm w-4 text-center">${body.symbol}</span><span>${body.shortName}</span>`;
                dockBtn.addEventListener('click', () => focusOnCelestialBody(body.id));
                dockContainer.appendChild(dockBtn);

                bodyNodes[body.id] = {
                    data: body,
                    orbitAngle: body.initialAngle || 0,
                    rootGroup,
                    spinGroup,
                    mesh,
                    outlineMesh,
                    uniforms,
                    pinEl,
                    dockBtn,
                    extra
                };

                // 初始化天体世界坐标位置
                updateSingleBodyOrbitPosition(bodyNodes[body.id]);
            });
        }

        // 地球表面立体手绘云朵群
        function createEarthClouds(earthRadius, themeCfg) {
            const group = new THREE.Group();
            const fillMat = new THREE.MeshToonMaterial({ color: themeCfg.cloudColor, transparent: true, opacity: 0.92 });
            const inkMat = new THREE.MeshBasicMaterial({ color: themeCfg.shadowInk, side: THREE.BackSide });

            const coords = [
                { lat: 25, lon: -45, speed: 0.12 },
                { lat: -15, lon: 85, speed: 0.09 },
                { lat: 48, lon: 145, speed: 0.14 },
                { lat: -35, lon: -120, speed: 0.11 },
                { lat: 12, lon: 22, speed: 0.13 }
            ];

            coords.forEach((cfg) => {
                const cloud = new THREE.Group();
                [
                    { x: 0, y: 0, z: 0, r: 0.065 },
                    { x: 0.05, y: -0.01, z: 0.01, r: 0.05 },
                    { x: -0.05, y: -0.01, z: -0.01, r: 0.048 }
                ].forEach(p => {
                    const m = new THREE.Mesh(new THREE.SphereGeometry(p.r, 10, 10), fillMat);
                    m.position.set(p.x, p.y, p.z);
                    cloud.add(m);
                    const o = new THREE.Mesh(new THREE.SphereGeometry(p.r * 1.16, 10, 10), inkMat);
                    o.position.set(p.x, p.y, p.z);
                    cloud.add(o);
                });
                const alt = earthRadius + 0.09;
                cloud.position.copy(latLonToVector3(cfg.lat, cfg.lon, alt));
                cloud.lookAt(new THREE.Vector3(0, 0, 0));
                cloud.userData = { lat: cfg.lat, lon: cfg.lon, alt, speed: cfg.speed };
                group.add(cloud);
            });
            group.userData = { fillMat, inkMat };
            return group;
        }

        // 地球伴星：手绘月球系统
        function createEarthMoonSystem(earthRadius, themeCfg) {
            const group = new THREE.Group();
            const moonOrbitR = earthRadius + 0.78;

            // 月球虚线轨道
            const pts = [];
            for (let i = 0; i <= 64; i++) {
                const a = (i / 64) * Math.PI * 2;
                pts.push(new THREE.Vector3(Math.cos(a) * moonOrbitR, Math.sin(a) * 0.18, Math.sin(a) * moonOrbitR));
            }
            const line = new THREE.Line(
                new THREE.BufferGeometry().setFromPoints(pts),
                new THREE.LineDashedMaterial({ color: themeCfg.orbitColor, dashSize: 0.12, gapSize: 0.08, transparent: true, opacity: 0.6 })
            );
            line.computeLineDistances();
            group.add(line);

            const mCanvas = generatePlanetCanvas('mercury', currentTheme);
            const moonMesh = new THREE.Mesh(
                new THREE.SphereGeometry(0.19, 24, 24),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(mCanvas) })
            );
            const moonOut = new THREE.Mesh(
                new THREE.SphereGeometry(0.21, 20, 20),
                new THREE.MeshBasicMaterial({ color: 0x2b2118, side: THREE.BackSide })
            );
            moonMesh.add(moonOut);
            moonMesh.position.set(moonOrbitR, 0, 0);
            group.add(moonMesh);

            group.userData = { moonMesh, moonOrbitR, angle: 0.6 };
            return group;
        }

        /***********************************************************************
         * 11. 创建火星与木星之间的手绘小行星带
         ***********************************************************************/
        function createAsteroidBelt() {
            asteroidBeltGroup = new THREE.Group();
            scene.add(asteroidBeltGroup);

            const rockMat = new THREE.MeshToonMaterial({ color: 0xcbbfa6 });
            const inkMat = new THREE.MeshBasicMaterial({ color: 0x2b2118, side: THREE.BackSide });
            const baseGeo = new THREE.DodecahedronGeometry(1, 0);

            for (let i = 0; i < 165; i++) {
                const r = 17.2 + seededRandom(i * 13.7) * 2.1;
                const ang = seededRandom(i * 29.3) * Math.PI * 2;
                const y = (seededRandom(i * 53.1) - 0.5) * 0.9;
                const scale = 0.045 + seededRandom(i * 71.9) * 0.095;

                const rockHolder = new THREE.Group();
                const rock = new THREE.Mesh(baseGeo, rockMat);
                rock.scale.set(scale * 1.2, scale * 0.85, scale);
                rockHolder.add(rock);

                const outline = new THREE.Mesh(baseGeo, inkMat);
                outline.scale.set(scale * 1.38, scale * 1.02, scale * 1.18);
                rockHolder.add(outline);

                rockHolder.position.set(Math.cos(ang) * r, y, Math.sin(ang) * r);
                rockHolder.rotation.set(i * 0.7, i * 1.3, 0);
                asteroidBeltGroup.add(rockHolder);
            }
        }

        /***********************************************************************
         * 12. 在地球表面创建 8 大奇观 3D 图钉与 2D 标签 (支持下钻探索)
         ***********************************************************************/
        function createEarthSurfaceLandmarks() {
            const earthNode = bodyNodes['earth'];
            if (!earthNode) return;

            earthPins3DGroup = new THREE.Group();
            earthPins3DGroup.visible = false; // 默认在太阳系模式下隐藏，进入地球下钻模式时显示
            earthNode.spinGroup.add(earthPins3DGroup);

            const pinsContainer = document.getElementById('pins-container');
            const headMat = new THREE.MeshToonMaterial({ color: 0xc85a32 });
            const inkMat = new THREE.MeshBasicMaterial({ color: 0x2b2118, side: THREE.BackSide });
            const stemMat = new THREE.MeshBasicMaterial({ color: 0x2b2118 });
            const r = earthNode.data.radius;

            EARTH_LANDMARKS.forEach((lm) => {
                const pinNode = new THREE.Group();
                const surfacePos = latLonToVector3(lm.lat, lm.lon, r);
                const normalDir = surfacePos.clone().normalize();

                const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 0.08, 6), stemMat);
                stem.position.y = 0.04;
                pinNode.add(stem);

                const head = new THREE.Mesh(new THREE.SphereGeometry(0.026, 12, 12), headMat.clone());
                head.position.y = 0.085;
                head.userData = { landmarkId: lm.id };
                pinNode.add(head);

                const headOut = new THREE.Mesh(new THREE.SphereGeometry(0.033, 10, 10), inkMat);
                headOut.position.y = 0.085;
                pinNode.add(headOut);

                pinNode.position.copy(surfacePos);
                pinNode.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normalDir);
                earthPins3DGroup.add(pinNode);

                const domEl = document.createElement('div');
                domEl.className = 'celestial-pin landmark-style hidden-pin';
                domEl.innerHTML = `
                    <div class="celestial-pin-badge">
                        <span class="text-[#c85a32] font-en-hand">${lm.index}</span>
                        <span>${lm.name}</span>
                    </div>
                    <div class="celestial-pin-stem"></div>
                `;
                domEl.addEventListener('click', (e) => {
                    e.stopPropagation();
                    focusOnEarthLandmark(lm.id);
                });
                pinsContainer.appendChild(domEl);

                earthLandmarkPins.push({
                    landmark: lm,
                    pinNode,
                    headMesh: head,
                    domEl,
                    localAnchor: latLonToVector3(lm.lat, lm.lon, r + 0.11)
                });
            });
        }

        /***********************************************************************
         * 13. 更新天体公转位置与屏幕 2D 投影标签
         ***********************************************************************/
        function updateSingleBodyOrbitPosition(node) {
            const d = node.data;
            if (d.orbitRadius === 0) {
                node.rootGroup.position.set(0, 0, 0);
                return;
            }
            const a = node.orbitAngle;
            if (d.isComet) {
                const rx = 22.5, rz = 12.5;
                node.rootGroup.position.set(
                    Math.cos(a) * rx - 10.5,
                    Math.sin(a) * 5.2,
                    Math.sin(a) * rz
                );
                // 令彗尾始终背向中心太阳 (0,0,0)
                if (node.extra.cometTail) {
                    const awayDir = node.rootGroup.position.clone().normalize();
                    node.extra.cometTail.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), awayDir);
                }
            } else {
                node.rootGroup.position.set(
                    Math.cos(a) * d.orbitRadius,
                    0,
                    Math.sin(a) * d.orbitRadius
                );
            }
        }

        function updateProjectedPins() {
            const halfW = window.innerWidth * 0.5;
            const halfH = window.innerHeight * 0.5;

            // 1. 更新太阳系 10 大天体标签
            Object.values(bodyNodes).forEach(node => {
                if (!showPins || activeMode === 'earth_landmarks') {
                    node.pinEl.classList.add('hidden-pin');
                    return;
                }
                const worldPos = node.rootGroup.position.clone();
                worldPos.y += node.data.radius + 0.45;

                const ndc = worldPos.project(camera);
                if (ndc.z > 1 || ndc.z < -1) {
                    node.pinEl.classList.add('hidden-pin');
                    return;
                }
                node.pinEl.classList.remove('hidden-pin');
                node.pinEl.style.left = `${ndc.x * halfW + halfW}px`;
                node.pinEl.style.top = `${-ndc.y * halfH + halfH}px`;
            });

            // 2. 更新地球表面 8 大奇观标签（仅在地球奇观模式下显示正面图钉）
            const earthNode = bodyNodes['earth'];
            const earthWorldCenter = earthNode ? earthNode.rootGroup.position.clone() : new THREE.Vector3();

            earthLandmarkPins.forEach(item => {
                if (!showPins || activeMode !== 'earth_landmarks') {
                    item.domEl.classList.add('hidden-pin');
                    return;
                }
                const worldPos = item.localAnchor.clone().applyMatrix4(earthNode.spinGroup.matrixWorld);
                const worldNormal = worldPos.clone().sub(earthWorldCenter).normalize();
                const toCam = camera.position.clone().sub(worldPos).normalize();

                if (worldNormal.dot(toCam) < 0.2) {
                    item.domEl.classList.add('hidden-pin');
                    return;
                }
                const ndc = worldPos.clone().project(camera);
                if (ndc.z > 1) {
                    item.domEl.classList.add('hidden-pin');
                    return;
                }
                item.domEl.classList.remove('hidden-pin');
                item.domEl.style.left = `${ndc.x * halfW + halfW}px`;
                item.domEl.style.top = `${-ndc.y * halfH + halfH}px`;
            });
        }

        /***********************************************************************
         * 14. 射线拾取交互、相机平滑锁定状态机与手帐卡片渲染
         ***********************************************************************/
        function playPaperSound(freq = 320) {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(freq * 1.35, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.04, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.09);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch (err) {}
        }

        function setupRaycasterInteraction() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let downPos = { x: 0, y: 0 };

            renderer.domElement.addEventListener('pointerdown', (e) => {
                downPos = { x: e.clientX, y: e.clientY };
            });

            renderer.domElement.addEventListener('pointerup', (e) => {
                if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                if (activeMode === 'earth_landmarks') {
                    const heads = earthLandmarkPins.map(p => p.headMesh);
                    const hits = raycaster.intersectObjects(heads, false);
                    if (hits.length > 0 && hits[0].object.userData.landmarkId) {
                        focusOnEarthLandmark(hits[0].object.userData.landmarkId);
                        return;
                    }
                }

                const planetMeshes = Object.values(bodyNodes).map(n => n.mesh);
                const hits = raycaster.intersectObjects(planetMeshes, false);
                if (hits.length > 0 && hits[0].object.userData.bodyId) {
                    focusOnCelestialBody(hits[0].object.userData.bodyId);
                }
            });
        }

        // 聚焦到指定太阳系天体
        function focusOnCelestialBody(bodyId) {
            const node = bodyNodes[bodyId];
            if (!node) return;

            activeMode = 'solar';
            focusedBodyId = bodyId;
            focusedLandmarkId = null;
            if (earthPins3DGroup) earthPins3DGroup.visible = false;
            playPaperSound(340);

            document.getElementById('view-mode-pill').textContent = `天体跟随 · ${node.data.shortName}`;

            // 更新标签与侧边导航栏高亮状态
            Object.values(bodyNodes).forEach(n => {
                const isSel = n.data.id === bodyId;
                n.pinEl.classList.toggle('selected', isSel);
                n.dockBtn.classList.toggle('active', isSel);
            });
            earthLandmarkPins.forEach(p => p.domEl.classList.remove('selected'));

            // 计算相机相对于目标星体的理想观察偏移量
            const targetWorldPos = node.rootGroup.position.clone();
            const dist = Math.max(node.data.radius * 4.4, 3.2);
            const offset = new THREE.Vector3(dist * 0.45, dist * 0.38, dist * 0.88);

            cameraTransition = {
                startCamPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                endOffset: offset,
                progress: 0,
                duration: 1.0
            };

            renderJournalCardForBody(node.data);
        }

        // 切换进入/退出地球表面 8 大奇观探索模式
        function toggleEarthLandmarksMode(forceState) {
            const nextState = typeof forceState === 'boolean' ? forceState : (activeMode !== 'earth_landmarks');
            if (nextState) {
                activeMode = 'earth_landmarks';
                focusedBodyId = 'earth';
                if (earthPins3DGroup) earthPins3DGroup.visible = true;
                document.getElementById('view-mode-pill').textContent = '地球奇观下钻';
                document.getElementById('earth-drill-status').textContent = '地表 8 大奇观模式';
                document.getElementById('btn-toggle-earth-landmarks').textContent = '🪐 返回地球天体总览';
                focusOnEarthLandmark(focusedLandmarkId || EARTH_LANDMARKS[0].id);
            } else {
                focusOnCelestialBody('earth');
            }
        }

        // 聚焦地球上的某一处具体手绘奇观地标
        function focusOnEarthLandmark(landmarkId) {
            const lm = EARTH_LANDMARKS.find(item => item.id === landmarkId);
            const earthNode = bodyNodes['earth'];
            if (!lm || !earthNode) return;

            activeMode = 'earth_landmarks';
            focusedBodyId = 'earth';
            focusedLandmarkId = landmarkId;
            if (earthPins3DGroup) earthPins3DGroup.visible = true;
            playPaperSound(390);

            earthLandmarkPins.forEach(item => {
                const isSel = item.landmark.id === landmarkId;
                item.domEl.classList.toggle('selected', isSel);
                item.headMesh.material.color.setHex(isSel ? 0xd93829 : 0xc85a32);
                item.pinNode.scale.setScalar(isSel ? 1.35 : 1.0);
            });

            // 计算地标在当前地球世界空间中的法线方向
            const localDir = latLonToVector3(lm.lat, lm.lon, 1.0).normalize();
            const worldDir = localDir.clone().applyQuaternion(earthNode.spinGroup.quaternion).normalize();
            const offset = worldDir.multiplyScalar(earthNode.data.radius * 2.85);

            cameraTransition = {
                startCamPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                endOffset: offset,
                progress: 0,
                duration: 0.95
            };

            renderJournalCardForLandmark(lm);
        }

        // 返回太阳系全景俯瞰模式
        function returnToSolarOverview() {
            activeMode = 'solar';
            focusedBodyId = null;
            focusedLandmarkId = null;
            if (earthPins3DGroup) earthPins3DGroup.visible = false;
            playPaperSound(260);

            document.getElementById('view-mode-pill').textContent = '太阳系全景';
            Object.values(bodyNodes).forEach(n => {
                n.pinEl.classList.remove('selected');
                n.dockBtn.classList.remove('active');
            });
            earthLandmarkPins.forEach(p => p.domEl.classList.remove('selected'));

            closeJournalCard();

            cameraTransition = {
                startCamPos: camera.position.clone(),
                startTarget: controls.target.clone(),
                endAbsolutePos: new THREE.Vector3(0, 32, 58),
                endAbsoluteTarget: new THREE.Vector3(0, 0, 0),
                progress: 0,
                duration: 1.15
            };
        }

        function renderJournalCardForBody(body) {
            const card = document.getElementById('journal-card');
            document.getElementById('card-index').textContent = body.index;
            document.getElementById('card-region').textContent = body.region;
            document.getElementById('card-title').textContent = body.name;
            document.getElementById('card-symbol').textContent = body.symbol;
            document.getElementById('card-coords').textContent = body.coordsText;
            document.getElementById('card-climate').textContent = body.climate;
            document.getElementById('card-desc').textContent = body.desc;
            document.getElementById('card-sketch-note').textContent = body.sketchNote;
            document.getElementById('card-svg-art').innerHTML = body.svg;

            const drillBanner = document.getElementById('earth-drill-banner');
            if (body.id === 'earth') {
                drillBanner.classList.remove('hidden');
                document.getElementById('earth-drill-status').textContent = '行星总览';
                document.getElementById('btn-toggle-earth-landmarks').textContent = '📍 探索 8 大地表奇观';
            } else {
                drillBanner.classList.add('hidden');
            }

            updateCardStampUI(visitedBodies.has(body.id));
            card.classList.remove('translate-x-[120%]', 'opacity-0');
        }

        function renderJournalCardForLandmark(lm) {
            const card = document.getElementById('journal-card');
            document.getElementById('card-index').textContent = lm.index;
            document.getElementById('card-region').textContent = lm.region;
            document.getElementById('card-title').textContent = lm.name;
            document.getElementById('card-symbol').textContent = lm.symbol;
            document.getElementById('card-coords').textContent = lm.coordsText;
            document.getElementById('card-climate').textContent = lm.climate;
            document.getElementById('card-desc').textContent = lm.desc;
            document.getElementById('card-sketch-note').textContent = lm.sketchNote;
            document.getElementById('card-svg-art').innerHTML = lm.svg;

            const drillBanner = document.getElementById('earth-drill-banner');
            drillBanner.classList.remove('hidden');
            document.getElementById('earth-drill-status').textContent = '地表 8 大奇观模式';
            document.getElementById('btn-toggle-earth-landmarks').textContent = '🪐 返回地球天体总览';

            updateCardStampUI(visitedLandmarks.has(lm.id));
            card.classList.remove('translate-x-[120%]', 'opacity-0');
        }

        function updateCardStampUI(isStamped) {
            const stampMark = document.getElementById('card-stamp-mark');
            const stampBtn = document.getElementById('btn-stamp-item');
            if (isStamped) {
                stampMark.classList.remove('hidden');
                stampMark.classList.add('stamp-badge');
                stampBtn.innerHTML = '<span>✓ 已收录至博物手帐</span>';
            } else {
                stampMark.classList.add('hidden');
                stampMark.classList.remove('stamp-badge');
                stampBtn.innerHTML = '<span>💮 加盖手帐印章</span>';
            }
        }

        function closeJournalCard() {
            document.getElementById('journal-card').classList.add('translate-x-[120%]', 'opacity-0');
        }

        /***********************************************************************
         * 15. 主题实时重绘切换与 UI 控件事件绑定
         ***********************************************************************/
        function switchTheme(themeKey) {
            if (!THEMES[themeKey]) return;
            currentTheme = themeKey;
            const cfg = THEMES[themeKey];
            playPaperSound(280);

            document.getElementById('bg-backdrop').style.background = cfg.bgGradient;
            document.getElementById('paper-overlay').style.opacity = cfg.paperOverlayOpacity;
            document.documentElement.style.setProperty('--accent-color', cfg.accent);
            document.documentElement.style.setProperty('--card-bg', cfg.cardBg);
            document.documentElement.style.setProperty('--border-ink', cfg.borderInk);
            document.getElementById('theme-pill').textContent = cfg.name;

            // 重新生成各星体对应主题的手绘贴图与着色器参数
            Object.values(bodyNodes).forEach(node => {
                const newCanvas = generatePlanetCanvas(node.data.id, themeKey);
                const newTex = new THREE.CanvasTexture(newCanvas);
                newTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                if (node.uniforms.uMap.value) node.uniforms.uMap.value.dispose();
                node.uniforms.uMap.value = newTex;
                node.uniforms.uPaperTint.value.copy(cfg.paperTint);
                node.uniforms.uShadowInk.value.copy(cfg.shadowInk);
                node.uniforms.uWarmLight.value.copy(cfg.warmLight);
                node.uniforms.uHatchDensity.value = cfg.hatchDensity;
                node.outlineMesh.material.uniforms.uInkColor.value.copy(cfg.shadowInk);

                if (node.extra.saturnRing) {
                    const rCanvas = generateSaturnRingCanvas(themeKey);
                    node.extra.saturnRing.material.map.dispose();
                    node.extra.saturnRing.material.map = new THREE.CanvasTexture(rCanvas);
                }
            });

            // 更新轨道环与天球仪颜色
            orbitsMasterGroup.children.forEach(child => {
                if (child.isLine && child.material) {
                    child.material.color.set(cfg.orbitColor);
                }
            });
            if (grandAstrolabeGroup && grandAstrolabeGroup.userData.ringMat) {
                grandAstrolabeGroup.userData.ringMat.color.set(cfg.astrolabeColor);
                grandAstrolabeGroup.userData.tickLines.material.color.set(cfg.astrolabeColor);
            }

            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.theme === themeKey);
            });
        }

        function bindUIEvents() {
            // 主题按钮
            document.querySelectorAll('.theme-btn').forEach(btn => {
                btn.addEventListener('click', () => switchTheme(btn.dataset.theme));
            });

            // 星历流速滑块
            const speedSlider = document.getElementById('slider-speed');
            speedSlider.addEventListener('input', (e) => {
                orbitSpeedMultiplier = parseFloat(e.target.value);
                document.getElementById('speed-label').textContent = `${orbitSpeedMultiplier.toFixed(1)}x`;
            });

            // 排线相位偏移滑块
            const phaseSlider = document.getElementById('slider-phase');
            phaseSlider.addEventListener('input', (e) => {
                phaseOffsetDeg = parseFloat(e.target.value);
                const rad = (phaseOffsetDeg * Math.PI) / 180;
                Object.values(bodyNodes).forEach(node => {
                    node.uniforms.uPhaseOffsetRad.value = rad;
                });
                document.getElementById('phase-label').textContent = `${String(Math.round(phaseOffsetDeg)).padStart(3, '0')}°`;
            });

            // 场景元素开关
            const btnOrbits = document.getElementById('toggle-orbits');
            btnOrbits.addEventListener('click', () => {
                showOrbits = !showOrbits;
                orbitsMasterGroup.visible = showOrbits;
                btnOrbits.classList.toggle('active', showOrbits);
                playPaperSound(360);
            });

            const btnAsteroids = document.getElementById('toggle-asteroids');
            btnAsteroids.addEventListener('click', () => {
                showAsteroids = !showAsteroids;
                asteroidBeltGroup.visible = showAsteroids;
                btnAsteroids.classList.toggle('active', showAsteroids);
                playPaperSound(360);
            });

            const btnClouds = document.getElementById('toggle-clouds');
            btnClouds.addEventListener('click', () => {
                showCloudsAndRings = !showCloudsAndRings;
                if (earthCloudsGroup) earthCloudsGroup.visible = showCloudsAndRings;
                if (bodyNodes['saturn']?.extra.saturnRing) bodyNodes['saturn'].extra.saturnRing.visible = showCloudsAndRings;
                if (bodyNodes['uranus']?.extra.uranusRing) bodyNodes['uranus'].extra.uranusRing.visible = showCloudsAndRings;
                btnClouds.classList.toggle('active', showCloudsAndRings);
                playPaperSound(360);
            });

            const btnPins = document.getElementById('toggle-pins');
            btnPins.addEventListener('click', () => {
                showPins = !showPins;
                btnPins.classList.toggle('active', showPins);
                playPaperSound(360);
            });

            // 顶部：随机星际漫游 & 返回太阳系全景
            document.getElementById('btn-random-body').addEventListener('click', () => {
                const pool = CELESTIAL_BODIES.filter(b => b.id !== focusedBodyId);
                const pick = pool[Math.floor(Math.random() * pool.length)];
                focusOnCelestialBody(pick.id);
            });

            document.getElementById('btn-overview').addEventListener('click', returnToSolarOverview);

            // 地球奇观下钻切换按钮
            document.getElementById('btn-toggle-earth-landmarks').addEventListener('click', () => {
                toggleEarthLandmarksMode();
            });

            // 详情卡片内部按钮
            document.getElementById('btn-close-card').addEventListener('click', closeJournalCard);

            document.getElementById('btn-prev-item').addEventListener('click', () => {
                if (activeMode === 'earth_landmarks') {
                    const idx = EARTH_LANDMARKS.findIndex(l => l.id === focusedLandmarkId);
                    const prevIdx = (idx - 1 + EARTH_LANDMARKS.length) % EARTH_LANDMARKS.length;
                    focusOnEarthLandmark(EARTH_LANDMARKS[prevIdx].id);
                } else {
                    const idx = CELESTIAL_BODIES.findIndex(b => b.id === focusedBodyId);
                    const prevIdx = (idx - 1 + CELESTIAL_BODIES.length) % CELESTIAL_BODIES.length;
                    focusOnCelestialBody(CELESTIAL_BODIES[prevIdx].id);
                }
            });

            document.getElementById('btn-next-item').addEventListener('click', () => {
                if (activeMode === 'earth_landmarks') {
                    const idx = EARTH_LANDMARKS.findIndex(l => l.id === focusedLandmarkId);
                    const nextIdx = (idx + 1) % EARTH_LANDMARKS.length;
                    focusOnEarthLandmark(EARTH_LANDMARKS[nextIdx].id);
                } else {
                    const idx = CELESTIAL_BODIES.findIndex(b => b.id === focusedBodyId);
                    const nextIdx = (idx + 1) % CELESTIAL_BODIES.length;
                    focusOnCelestialBody(CELESTIAL_BODIES[nextIdx].id);
                }
            });

            // 盖章打卡互动
            document.getElementById('btn-stamp-item').addEventListener('click', () => {
                if (activeMode === 'earth_landmarks' && focusedLandmarkId) {
                    visitedLandmarks.add(focusedLandmarkId);
                    document.getElementById('earth-stamp-count').textContent = `${visitedLandmarks.size} / ${EARTH_LANDMARKS.length}`;
                    updateCardStampUI(true);
                    playPaperSound(500);
                } else if (focusedBodyId) {
                    visitedBodies.add(focusedBodyId);
                    document.getElementById('stamp-count').textContent = `${visitedBodies.size} / ${CELESTIAL_BODIES.length}`;
                    updateCardStampUI(true);
                    playPaperSound(480);
                }
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /***********************************************************************
         * 16. 主动画循环 (行星公转、自转、相机实时锁定跟随与投影计算)
         ***********************************************************************/
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const delta = Math.min(clock.getDelta(), 0.1);
            const elapsed = clock.getElapsedTime();

            // 记录当前聚焦星体在移动前的位置，以便相机同步平移跟随
            const trackedNode = focusedBodyId ? bodyNodes[focusedBodyId] : null;
            const prevTargetWorldPos = trackedNode ? trackedNode.rootGroup.position.clone() : null;

            // 1. 更新所有天体的公转与自转
            Object.values(bodyNodes).forEach(node => {
                node.uniforms.uTime.value = elapsed;
                node.outlineMesh.material.uniforms.uTime.value = elapsed;

                // 公转步进（若正处于地球表面奇观特写模式，暂停地球公转以便精细观察地标）
                const effectiveOrbitMult = (activeMode === 'earth_landmarks') ? 0 : orbitSpeedMultiplier;
                if (node.data.orbitRadius > 0) {
                    node.orbitAngle += delta * node.data.orbitSpeed * 0.25 * effectiveOrbitMult;
                    updateSingleBodyOrbitPosition(node);
                }

                // 星球自转
                const spinMult = (activeMode === 'earth_landmarks' && node.data.id === 'earth') ? 0.05 : 1.0;
                node.spinGroup.rotation.y += delta * node.data.rotationSpeed * spinMult;

                // 木星伽利略卫星环绕
                if (node.extra.jupiterMoons) {
                    node.extra.jupiterMoons.children.forEach(m => {
                        m.userData.angle += delta * m.userData.speed * (0.4 + effectiveOrbitMult * 0.6);
                        m.position.set(
                            Math.cos(m.userData.angle) * m.userData.dist,
                            0,
                            Math.sin(m.userData.angle) * m.userData.dist
                        );
                    });
                }
            });

            // 2. 更新地球云层漂移与月球公转
            if (earthCloudsGroup && showCloudsAndRings) {
                earthCloudsGroup.children.forEach((cloud) => {
                    cloud.userData.lon += delta * cloud.userData.speed * 10;
                    cloud.position.copy(latLonToVector3(cloud.userData.lat, cloud.userData.lon, cloud.userData.alt));
                    cloud.lookAt(new THREE.Vector3(0, 0, 0));
                });
            }
            if (earthMoonGroup) {
                earthMoonGroup.userData.angle += delta * 0.65 * (0.2 + orbitSpeedMultiplier * 0.8);
                const ma = earthMoonGroup.userData.angle;
                const mr = earthMoonGroup.userData.moonOrbitR;
                earthMoonGroup.userData.moonMesh.position.set(
                    Math.cos(ma) * mr,
                    Math.sin(ma) * 0.18,
                    Math.sin(ma) * mr
                );
                earthMoonGroup.userData.moonMesh.rotation.y += delta * 0.4;
            }

            // 3. 小行星带与外圈天球仪星盘缓慢旋转
            if (asteroidBeltGroup && showAsteroids) {
                asteroidBeltGroup.rotation.y += delta * 0.045 * orbitSpeedMultiplier;
            }
            if (grandAstrolabeGroup && showOrbits) {
                grandAstrolabeGroup.rotation.y -= delta * 0.015;
            }

            // 4. 相机平滑过渡与公转天体实时锁定跟随
            if (cameraTransition) {
                cameraTransition.progress += delta / cameraTransition.duration;
                const t = Math.min(cameraTransition.progress, 1.0);
                const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

                if (cameraTransition.endAbsolutePos) {
                    camera.position.lerpVectors(cameraTransition.startCamPos, cameraTransition.endAbsolutePos, ease);
                    controls.target.lerpVectors(cameraTransition.startTarget, cameraTransition.endAbsoluteTarget, ease);
                } else if (trackedNode) {
                    const currentBodyPos = trackedNode.rootGroup.position.clone();
                    const desiredCamPos = currentBodyPos.clone().add(cameraTransition.endOffset);
                    camera.position.lerpVectors(cameraTransition.startCamPos, desiredCamPos, ease);
                    controls.target.lerpVectors(cameraTransition.startTarget, currentBodyPos, ease);
                }

                if (t >= 1.0) cameraTransition = null;
            } else if (trackedNode && prevTargetWorldPos) {
                // 过渡完成后，令相机与 OrbitControls.target 同步跟随目标行星公转位移
                const currentBodyPos = trackedNode.rootGroup.position;
                const deltaMove = currentBodyPos.clone().sub(prevTargetWorldPos);
                camera.position.add(deltaMove);
                controls.target.copy(currentBodyPos);
            }

            controls.update();
            updateProjectedPins();
            renderer.render(scene, camera);
        }

        window.onload = function () {
            renderPaperGrainOverlay();
            initThreeScene();
            bindUIEvents();
            animate();
        };
    </script>
