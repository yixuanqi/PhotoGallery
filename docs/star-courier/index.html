<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>星际小快递 · 引力弹弓</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js r128 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- 柔和手账感圆润字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet" />

  <style>
    :root {
      --ink: #2b2436;
      --paper: rgba(255, 250, 240, 0.92);
      --paper-solid: #fffaf0;
      --coral: #ff6b6b;
      --gold: #f6b94e;
      --mint: #5cd6a8;
      --sky: #6ec6f5;
      --lavender: #b794f4;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #191a32;
      font-family: 'Fredoka', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    #canvas-container:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 温暖绘本纸纹暗角覆盖层 */
    .paper-vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background:
        radial-gradient(circle at 50% 50%, transparent 56%, rgba(20, 16, 36, 0.36) 100%),
        repeating-radial-gradient(circle at 20% 30%, rgba(255, 245, 228, 0.018) 0px, rgba(255, 245, 228, 0.018) 1px, transparent 1px, transparent 4px);
      transition: box-shadow 0.35s ease, background-color 0.35s ease;
    }

    /* Shift 慢动作瞄准时的温暖琥珀光晕边框 */
    .paper-vignette.slowmo-active {
      box-shadow: inset 0 0 85px rgba(255, 200, 110, 0.32), inset 0 0 18px rgba(255, 232, 175, 0.38);
      background-color: rgba(255, 212, 130, 0.05);
    }

    /* 手账风卡片与按钮 */
    .sketch-card {
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }

    .sketch-btn {
      background: var(--paper);
      border: 2px solid var(--ink);
      box-shadow: 2.5px 2.5px 0 var(--ink);
      color: var(--ink);
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s ease;
      cursor: pointer;
    }

    .sketch-btn:hover {
      background: #fffdf8;
      transform: translate(-1px, -1px);
      box-shadow: 3.5px 3.5px 0 var(--ink);
    }

    .sketch-btn:active {
      transform: translate(1.5px, 1.5px);
      box-shadow: 1px 1px 0 var(--ink);
    }

    .sketch-btn.active {
      background: #ffe8a3;
    }

    /* 按键提示胶囊高亮 */
    .key-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      transition: background-color 0.12s ease, transform 0.12s ease, border-color 0.12s ease;
    }

    .key-pill.pressed {
      background-color: #ffe28a;
      border-color: var(--ink);
      transform: translateY(-1px) scale(1.04);
    }

    .kbd-chip {
      display: inline-block;
      padding: 0 5px;
      font-size: 11px;
      font-weight: 700;
      line-height: 18px;
      background: #fff;
      border: 1.5px solid var(--ink);
      border-radius: 6px;
      box-shadow: 1px 1px 0 var(--ink);
    }

    /* 浮动绘本提示 Toast 动画 */
    @keyframes toastPop {
      0% {
        opacity: 0;
        transform: translate(-50%, 16px) scale(0.84) rotate(-2deg);
      }
      14% {
        opacity: 1;
        transform: translate(-50%, 0px) scale(1.04) rotate(0.8deg);
      }
      22% {
        transform: translate(-50%, 0px) scale(1) rotate(0deg);
      }
      84% {
        opacity: 1;
        transform: translate(-50%, -4px) scale(1) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -18px) scale(0.92);
      }
    }

    .toast-item {
      position: fixed;
      left: 50%;
      top: 78px;
      z-index: 30;
      pointer-events: none;
      animation: toastPop 2.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 屏幕外目标指引浮标 */
    #offscreen-indicator {
      position: fixed;
      z-index: 15;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s ease;
    }

    /* 燃料条条纹微动画 */
    .fuel-bar-fill {
      background: linear-gradient(90deg, #ff7b6b 0%, #ffb35c 52%, #ffd966 100%);
      transition: width 0.08s linear;
    }

    /* 触摸设备操作按钮 */
    .touch-pad {
      display: none;
    }
    @media (hover: none) and (pointer: coarse), (max-width: 768px) {
      .touch-pad {
        display: flex;
      }
      .desktop-key-guide {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <!-- 3D 画布容器 -->
  <div id="canvas-container"></div>

  <!-- 温暖绘本纸纹暗角层 -->
  <div id="paper-vignette" class="paper-vignette"></div>

  <!-- 动态 Toast 容器 -->
  <div id="toast-layer"></div>

  <!-- 目标星球屏幕外方向指示器 -->
  <div id="offscreen-indicator" class="hidden">
    <div class="sketch-card rounded-full px-2.5 py-1 flex items-center gap-1.5 text-xs font-bold whitespace-nowrap">
      <span id="offscreen-arrow" class="inline-block text-sm leading-none">➤</span>
      <span id="offscreen-label">目标</span>
    </div>
  </div>

  <!-- 左上角极简手账风 HUD -->
  <aside class="fixed top-3 left-3 sm:top-4 sm:left-4 z-20 flex flex-col gap-2 max-w-[248px] sm:max-w-[266px] pointer-events-none">
    <div class="sketch-card rounded-2xl px-3.5 py-2.5 pointer-events-auto">
      <!-- 标题与状态徽章 -->
      <div class="flex items-center justify-between gap-2 mb-2">
        <div class="flex items-center gap-1.5">
          <span class="text-lg leading-none">🚀</span>
          <h1 class="text-sm sm:text-[15px] font-black tracking-tight text-[#2b2436]">星际小快递</h1>
        </div>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-[#ffe8a3] border border-[#2b2436]">引力弹弓</span>
      </div>

      <!-- 快递目的地提示 -->
      <div class="flex items-center justify-between gap-2 bg-[#fff2d6] border-[1.5px] border-[#2b2436] rounded-xl px-2.5 py-1.5 mb-2">
        <div class="flex items-center gap-1.5 min-w-0">
          <span id="hud-target-dot" class="w-3 h-3 rounded-full border border-[#2b2436] shrink-0" style="background:#ffb58a;"></span>
          <span class="text-[11px] font-bold text-[#6e5e78] shrink-0">送往</span>
          <span id="hud-target-name" class="text-xs font-black truncate">蜜桃光环星</span>
        </div>
        <span id="hud-target-dist" class="text-[11px] font-bold text-[#9c5a2d] shrink-0">--</span>
      </div>

      <!-- 速度与当前引力场 -->
      <div class="grid grid-cols-2 gap-1.5 mb-2 text-xs">
        <div class="bg-white/80 border-[1.5px] border-[#2b2436] rounded-xl px-2 py-1">
          <div class="text-[10px] font-bold text-[#7a6d85]">飞行速度</div>
          <div class="font-black text-sm leading-tight"><span id="hud-speed">0.0</span> <span class="text-[10px] font-bold text-[#7a6d85]">km/s</span></div>
        </div>
        <div class="bg-white/80 border-[1.5px] border-[#2b2436] rounded-xl px-2 py-1 min-w-0">
          <div class="text-[10px] font-bold text-[#7a6d85]">当前引力场</div>
          <div id="hud-gravity-well" class="font-black text-xs leading-tight truncate pt-0.5 text-[#3c2f54]">暖阳太阳系</div>
        </div>
      </div>

      <!-- 推进燃料条 -->
      <div class="mb-2">
        <div class="flex items-center justify-between text-[11px] font-bold mb-1">
          <span class="text-[#5e516b]">推进燃料</span>
          <span id="hud-fuel-text" class="font-black">100%</span>
        </div>
        <div class="w-full h-3 bg-[#ede4d4] border-[1.5px] border-[#2b2436] rounded-full overflow-hidden p-[1px]">
          <div id="hud-fuel-bar" class="fuel-bar-fill h-full rounded-full" style="width: 100%;"></div>
        </div>
      </div>

      <!-- 快递与星星糖计数 -->
      <div class="flex items-center justify-between gap-2 pt-1 border-t border-dashed border-[#2b2436]/30 text-xs font-bold">
        <div class="flex items-center gap-1" title="已完成星际快递">
          <span>📦</span>
          <span class="text-[#6e5e78]">送达</span>
          <span id="hud-deliveries" class="font-black text-sm text-[#e05858]">0</span>
        </div>
        <div class="flex items-center gap-1" title="收集到的星星糖">
          <span>⭐</span>
          <span class="text-[#6e5e78]">星星糖</span>
          <span id="hud-stars" class="font-black text-sm text-[#d98a16]">0</span>
        </div>
        <div class="flex items-center gap-1" title="引力弹弓次数">
          <span>⚡</span>
          <span id="hud-slingshots" class="font-black text-sm text-[#2f9e73]">0</span>
        </div>
      </div>
    </div>

    <!-- 慢动作 / 暂停小徽章 -->
    <div id="status-pill" class="hidden self-start sketch-card rounded-full px-3 py-1 text-xs font-black items-center gap-1.5 bg-[#ffe599]">
      <span id="status-pill-icon">⏱</span>
      <span id="status-pill-text">慢动作瞄准 0.25×</span>
    </div>
  </aside>

  <!-- 右上角极简控制栏 -->
  <nav class="fixed top-3 right-3 sm:top-4 sm:right-4 z-20 flex flex-wrap justify-end gap-2 max-w-[52vw]">
    <button id="btn-camera" class="sketch-btn rounded-xl px-2.5 py-1.5 text-xs font-bold flex items-center gap-1.5" title="切换相机模式 (V)">
      <span>🎥</span>
      <span id="btn-camera-label">跟随</span>
      <span class="hidden sm:inline text-[10px] opacity-60">[V]</span>
    </button>
    <button id="btn-inf-fuel" class="sketch-btn rounded-xl px-2.5 py-1.5 text-xs font-bold flex items-center gap-1.5" title="切换无限燃料">
      <span>⛽</span>
      <span>无限燃料</span>
    </button>
    <button id="btn-sound" class="sketch-btn active rounded-xl px-2.5 py-1.5 text-xs font-bold flex items-center gap-1" title="开关音效">
      <span id="btn-sound-icon">🔊</span>
      <span class="hidden sm:inline" id="btn-sound-label">音效</span>
    </button>
    <button id="btn-reset" class="sketch-btn rounded-xl px-2.5 py-1.5 text-xs font-bold flex items-center gap-1" title="重新出发 (R)">
      <span>↺</span>
      <span>重置</span>
      <span class="hidden sm:inline text-[10px] opacity-60">[R]</span>
    </button>
  </nav>

  <!-- 底部居中极简按键指引栏（桌面端） -->
  <footer class="desktop-key-guide fixed bottom-4 left-1/2 -translate-x-1/2 z-20 pointer-events-none max-w-[96vw]">
    <div class="sketch-card rounded-full px-3.5 py-1.5 flex items-center gap-2 text-xs font-bold whitespace-nowrap pointer-events-auto">
      <span id="key-ws" class="key-pill"><span class="kbd-chip">W/S</span> 推进减速</span>
      <span class="opacity-30">·</span>
      <span id="key-ad" class="key-pill"><span class="kbd-chip">A/D</span> 转向</span>
      <span class="opacity-30">·</span>
      <span id="key-shift" class="key-pill"><span class="kbd-chip">Shift</span> 慢动作瞄准</span>
      <span class="opacity-30">·</span>
      <span id="key-qe" class="key-pill"><span class="kbd-chip">Q/E</span> 缩放</span>
      <span class="opacity-30">·</span>
      <span id="key-space" class="key-pill"><span class="kbd-chip">Space</span> 暂停</span>
      <span class="opacity-30">·</span>
      <span id="key-r" class="key-pill"><span class="kbd-chip">R</span> 重置</span>
    </div>
  </footer>

  <!-- 移动端/触屏精简操控条 -->
  <div class="touch-pad fixed bottom-4 inset-x-4 z-20 items-end justify-between pointer-events-none">
    <div class="flex gap-2 pointer-events-auto">
      <button data-touch="left" class="sketch-btn rounded-2xl w-14 h-14 text-xl font-black flex items-center justify-center">↺</button>
      <button data-touch="right" class="sketch-btn rounded-2xl w-14 h-14 text-xl font-black flex items-center justify-center">↻</button>
    </div>
    <div class="flex gap-2 pointer-events-auto">
      <button data-touch="slow" class="sketch-btn rounded-2xl px-3 h-14 text-xs font-black flex flex-col items-center justify-center">
        <span>⏱</span><span>慢动作</span>
      </button>
      <button data-touch="brake" class="sketch-btn rounded-2xl w-14 h-14 text-lg font-black flex items-center justify-center">🔻</button>
      <button data-touch="thrust" class="sketch-btn active rounded-2xl w-16 h-14 text-xl font-black flex items-center justify-center">🔥</button>
    </div>
  </div>

  <script>
    /**
     * ============================================================================
     * 星际小快递 · 引力弹弓 (Hand-Drawn Q-Version Gravity Slingshot Simulator)
     * ----------------------------------------------------------------------------
     * 架构概览：
     *  1. SoundEngine        : 纯 Web Audio API 程序化绘本风格音效（柔和喷射白噪、卡林巴琴星星音、弹弓和弦）
     *  2. ProceduralArt      : Canvas 水彩/彩铅贴图生成器 + 4阶 Toon 渐变贴图 + 反面墨线描边工具
     *  3. PhysicsWorld       : 太阳 + 4颗公转行星的多体引力模型 + 四阶龙格-库塔 (RK4) 积分与未来220步轨迹预测
     *  4. DioramaScene       : 暖阳、抹茶草地星、蜜桃光环星、芋泥陨石星、薄荷冰晶星、Q版小火箭、粒子与轨迹渲染
     *  5. GameplayLoop       : 星际快递送达、引力弹弓加速/偏转判定、星星糖收集、燃料回复与温和撞击重置
     * ============================================================================
     */

    (function () {
      'use strict';

      // =========================================================================
      // 1. 程序化 Web Audio 音效引擎（零外部音频资源）
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.enabled = true;
          this.unlocked = false;
          this.thrustGain = null;
          this.thrustFilter = null;
          this.retroGain = null;
          this.pentatonic = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
          this.starNoteIdx = 0;
        }

        unlock() {
          if (this.unlocked) {
            if (this.ctx && this.ctx.state === 'suspended') {
              this.ctx.resume().catch(() => {});
            }
            return;
          }
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            this.ctx = new AudioCtx();
            this.unlocked = true;
            this._setupThrusterNodes();
          } catch (e) {
            // 浏览器不支持或受限时静默降级
          }
        }

        _setupThrusterNodes() {
          if (!this.ctx) return;
          // 生成2秒循环的柔和噪声缓冲，用来合成温暖绵密的推进喷口声音
          const sampleRate = this.ctx.sampleRate;
          const length = sampleRate * 2;
          const buffer = this.ctx.createBuffer(1, length, sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0;
          for (let i = 0; i < length; i++) {
            const white = Math.random() * 2 - 1;
            data[i] = (lastOut + 0.06 * white) / 1.06;
            lastOut = data[i];
            data[i] *= 2.4;
          }

          // 主推进器低通柔和呼呼声
          const src1 = this.ctx.createBufferSource();
          src1.buffer = buffer;
          src1.loop = true;
          this.thrustFilter = this.ctx.createBiquadFilter();
          this.thrustFilter.type = 'lowpass';
          this.thrustFilter.frequency.value = 320;
          this.thrustGain = this.ctx.createGain();
          this.thrustGain.gain.value = 0.0001;
          src1.connect(this.thrustFilter);
          this.thrustFilter.connect(this.thrustGain);
          this.thrustGain.connect(this.ctx.destination);
          src1.start();

          // 反向制动器轻柔气喷声
          const src2 = this.ctx.createBufferSource();
          src2.buffer = buffer;
          src2.loop = true;
          const retroFilter = this.ctx.createBiquadFilter();
          retroFilter.type = 'bandpass';
          retroFilter.frequency.value = 820;
          retroFilter.Q.value = 1.4;
          this.retroGain = this.ctx.createGain();
          this.retroGain.gain.value = 0.0001;
          src2.connect(retroFilter);
          retroFilter.connect(this.retroGain);
          this.retroGain.connect(this.ctx.destination);
          src2.start();
        }

        setThruster(mainLevel, retroLevel, slowMo) {
          if (!this.ctx || !this.thrustGain || !this.retroGain) return;
          const now = this.ctx.currentTime;
          const targetMain = this.enabled ? mainLevel * 0.14 : 0.0001;
          const targetRetro = this.enabled ? retroLevel * 0.09 : 0.0001;
          this.thrustGain.gain.setTargetAtTime(Math.max(0.0001, targetMain), now, 0.05);
          this.retroGain.gain.setTargetAtTime(Math.max(0.0001, targetRetro), now, 0.04);
          this.thrustFilter.frequency.setTargetAtTime(slowMo ? 210 : 380, now, 0.08);
        }

        playStarPickup() {
          if (!this.enabled || !this.ctx) return;
          const freq = this.pentatonic[this.starNoteIdx % this.pentatonic.length];
          this.starNoteIdx++;
          this._playBell(freq, 0.0, 0.42, 0.12);
          this._playBell(freq * 1.5, 0.05, 0.35, 0.06);
        }

        playSlingshot() {
          if (!this.enabled || !this.ctx) return;
          // 轻快上扬的竖琴/风铃滑音和弦
          [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
            this._playBell(f, idx * 0.055, 0.55, 0.09);
          });
        }

        playDelivery() {
          if (!this.enabled || !this.ctx) return;
          // 温暖八音盒送达旋律
          const notes = [523.25, 659.25, 783.99, 987.77, 1046.5];
          notes.forEach((f, idx) => {
            this._playBell(f, idx * 0.075, 0.7, 0.11);
          });
        }

        playCuteCrash() {
          if (!this.enabled || !this.ctx) return;
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.28);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.34);
        }

        _playBell(freq, delay, duration, peakGain) {
          const now = this.ctx.currentTime + delay;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(peakGain, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.04);
        }
      }

      // =========================================================================
      // 2. 手绘 Q 版材质、程序化水彩贴图与墨线描边管线
      // =========================================================================
      const INK_COLOR = 0x262030;

      // 生成4阶柔和手绘卡通色阶 DataTexture (THREE.NearestFilter)
      function createToonGradientMap() {
        const steps = [128, 178, 224, 255];
        const data = new Uint8Array(steps.length * 4);
        for (let i = 0; i < steps.length; i++) {
          const v = steps[i];
          data[i * 4 + 0] = v;
          data[i * 4 + 1] = v;
          data[i * 4 + 2] = v;
          data[i * 4 + 3] = 255;
        }
        const tex = new THREE.DataTexture(data, steps.length, 1, THREE.RGBAFormat);
        tex.minFilter = THREE.NearestFilter;
        tex.magFilter = THREE.NearestFilter;
        tex.generateMipmaps = false;
        tex.needsUpdate = true;
        return tex;
      }

      // 为任意网格添加反面扩张墨线描边 (Inverted-Hull Ink Outline)
      function addInkOutline(mesh, scale = 1.055, color = INK_COLOR) {
        const outlineMat = new THREE.MeshBasicMaterial({
          color: color,
          side: THREE.BackSide
        });
        const outline = new THREE.Mesh(mesh.geometry, outlineMat);
        if (typeof scale === 'number') {
          outline.scale.setScalar(scale);
        } else {
          outline.scale.set(scale.x, scale.y, scale.z);
        }
        mesh.add(outline);
        return outline;
      }

      // 通用水彩/彩铅笔触贴图生成器
      function createWatercolorTexture(baseHex, patchColors, style = 'mottled') {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = baseHex;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 柔和渐变水彩晕染
        if (style === 'banded') {
          for (let i = 0; i < 16; i++) {
            const y = (i / 16) * canvas.height;
            const h = 14 + Math.random() * 24;
            ctx.fillStyle = patchColors[i % patchColors.length];
            ctx.globalAlpha = 0.28 + Math.random() * 0.25;
            ctx.beginPath();
            ctx.moveTo(0, y);
            for (let x = 0; x <= canvas.width; x += 32) {
              ctx.lineTo(x, y + Math.sin(x * 0.03 + i) * 6);
            }
            ctx.lineTo(canvas.width, y + h);
            ctx.lineTo(0, y + h);
            ctx.closePath();
            ctx.fill();
          }
        } else {
          const count = style === 'craters' ? 28 : 42;
          for (let i = 0; i < count; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const rx = 16 + Math.random() * 54;
            const ry = style === 'craters' ? rx * (0.7 + Math.random() * 0.35) : 12 + Math.random() * 34;
            ctx.fillStyle = patchColors[i % patchColors.length];
            ctx.globalAlpha = 0.24 + Math.random() * 0.24;
            ctx.beginPath();
            ctx.ellipse(x, y, rx, ry, Math.random() * Math.PI, 0, Math.PI * 2);
            ctx.fill();
            // 环绕无缝平铺补全
            if (x + rx > canvas.width) {
              ctx.beginPath();
              ctx.ellipse(x - canvas.width, y, rx, ry, 0, 0, Math.PI * 2);
              ctx.fill();
            }
          }
        }

        // 细微彩铅手绘短线条肌理
        ctx.globalAlpha = 0.14;
        ctx.lineWidth = 1.6;
        for (let i = 0; i < 240; i++) {
          ctx.strokeStyle = i % 2 === 0 ? '#ffffff' : '#3a2d4a';
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const len = 8 + Math.random() * 18;
          const ang = (Math.random() - 0.5) * 0.5;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + Math.cos(ang) * len, y + Math.sin(ang) * len);
          ctx.stroke();
        }

        ctx.globalAlpha = 1;
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 绘制午夜靛蓝水彩星云穹顶贴图
      function createWatercolorSkyTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');

        // 深邃温暖的午夜靛蓝渐变底色
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0.0, '#161830');
        grad.addColorStop(0.42, '#222246');
        grad.addColorStop(0.65, '#2b2448');
        grad.addColorStop(1.0, '#181832');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 柔和粉彩手绘星云团
        const nebulaPalette = [
          'rgba(182, 134, 226, 0.13)',
          'rgba(247, 162, 178, 0.11)',
          'rgba(116, 198, 214, 0.11)',
          'rgba(255, 206, 148, 0.09)',
          'rgba(148, 152, 238, 0.12)'
        ];
        for (let i = 0; i < 36; i++) {
          const x = Math.random() * canvas.width;
          const y = 70 + Math.random() * (canvas.height - 140);
          const r = 65 + Math.random() * 150;
          const rg = ctx.createRadialGradient(x, y, 4, x, y, r);
          rg.addColorStop(0, nebulaPalette[i % nebulaPalette.length]);
          rg.addColorStop(1, 'rgba(30, 26, 54, 0)');
          ctx.fillStyle = rg;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // 细碎绘本小星点
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const r = 0.6 + Math.random() * 1.4;
          ctx.fillStyle = i % 5 === 0 ? '#ffe7b3' : (i % 7 === 0 ? '#c4ecff' : '#fffaf0');
          ctx.globalAlpha = 0.3 + Math.random() * 0.65;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 手绘四角星光 Sprite 贴图
      function createFourPointStarTexture(color = '#fff8e2') {
        const canvas = document.createElement('canvas');
        canvas.width = 128;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        const c = 64;

        const glow = ctx.createRadialGradient(c, c, 2, c, c, 54);
        glow.addColorStop(0, 'rgba(255, 248, 226, 0.85)');
        glow.addColorStop(0.4, 'rgba(255, 230, 175, 0.25)');
        glow.addColorStop(1, 'rgba(255, 230, 175, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 128, 128);

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(c, 12);
        ctx.quadraticCurveTo(c + 6, c - 6, 116, c);
        ctx.quadraticCurveTo(c + 6, c + 6, c, 116);
        ctx.quadraticCurveTo(c - 6, c + 6, 12, c);
        ctx.quadraticCurveTo(c - 6, c - 6, c, 12);
        ctx.closePath();
        ctx.fill();

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 手绘太阳光芒圆环贴图
      function createSunbeamTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const c = 256;

        // 温暖中心光晕
        const g = ctx.createRadialGradient(c, c, 58, c, c, 245);
        g.addColorStop(0, 'rgba(255, 232, 165, 0.85)');
        g.addColorStop(0.45, 'rgba(255, 190, 115, 0.34)');
        g.addColorStop(0.75, 'rgba(255, 165, 120, 0.12)');
        g.addColorStop(1, 'rgba(255, 165, 120, 0)');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 512);

        // 手绘风波浪/短线光芒
        const rays = 20;
        for (let i = 0; i < rays; i++) {
          const ang = (i / rays) * Math.PI * 2;
          const r1 = 128 + (i % 2) * 10;
          const r2 = i % 2 === 0 ? 225 : 190;
          ctx.strokeStyle = i % 2 === 0 ? 'rgba(255, 236, 175, 0.85)' : 'rgba(255, 196, 130, 0.65)';
          ctx.lineWidth = i % 2 === 0 ? 8 : 5;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(c + Math.cos(ang) * r1, c + Math.sin(ang) * r1);
          ctx.lineTo(c + Math.cos(ang) * r2, c + Math.sin(ang) * r2);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 蜜桃光环星水彩半透明行星环贴图
      function createPeachRingTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const c = 256;

        const bands = [
          { r: 152, w: 20, color: 'rgba(255, 236, 206, 0.78)' },
          { r: 178, w: 28, color: 'rgba(255, 189, 152, 0.82)' },
          { r: 206, w: 16, color: 'rgba(247, 165, 182, 0.70)' },
          { r: 228, w: 14, color: 'rgba(255, 241, 214, 0.62)' }
        ];
        bands.forEach((b) => {
          ctx.strokeStyle = b.color;
          ctx.lineWidth = b.w;
          ctx.beginPath();
          ctx.arc(c, c, b.r, 0, Math.PI * 2);
          ctx.stroke();
        });

        // 手绘虚线墨边装饰
        ctx.strokeStyle = 'rgba(43, 36, 54, 0.55)';
        ctx.lineWidth = 3;
        ctx.setLineDash([16, 12]);
        ctx.beginPath();
        ctx.arc(c, c, 239, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(c, c, 139, 0, Math.PI * 2);
        ctx.stroke();

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 轨迹特殊标记贴图（Pe 近地点闪光 / 碰撞手绘× / 目标送达星）
      function createMarkerSpriteTexture(type) {
        const canvas = document.createElement('canvas');
        canvas.width = 160;
        canvas.height = 160;
        const ctx = canvas.getContext('2d');
        const c = 80;

        if (type === 'pe') {
          // 柔和薄荷金发光圆牌 + "Pe" 字样
          ctx.fillStyle = '#fff9e6';
          ctx.strokeStyle = '#2b2436';
          ctx.lineWidth = 6;
          ctx.beginPath();
          ctx.arc(c, c, 46, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#2f9e73';
          ctx.font = '900 38px Fredoka, sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('Pe', c, c + 2);
        } else if (type === 'crash') {
          // 珊瑚红手绘碰撞 X
          ctx.fillStyle = 'rgba(255, 115, 115, 0.28)';
          ctx.beginPath();
          ctx.arc(c, c, 54, 0, Math.PI * 2);
          ctx.fill();

          ctx.lineCap = 'round';
          // 墨线外框
          ctx.strokeStyle = '#2b2436';
          ctx.lineWidth = 20;
          ctx.beginPath();
          ctx.moveTo(46, 46); ctx.lineTo(114, 114);
          ctx.moveTo(114, 46); ctx.lineTo(46, 114);
          ctx.stroke();
          // 珊瑚红内芯
          ctx.strokeStyle = '#ff6b6b';
          ctx.lineWidth = 11;
          ctx.beginPath();
          ctx.moveTo(46, 46); ctx.lineTo(114, 114);
          ctx.moveTo(114, 46); ctx.lineTo(46, 114);
          ctx.stroke();
        } else if (type === 'deliver') {
          // 金色快递瞄准小星
          ctx.fillStyle = '#ffe57f';
          ctx.strokeStyle = '#2b2436';
          ctx.lineWidth = 6;
          ctx.beginPath();
          for (let i = 0; i < 10; i++) {
            const ang = (i * Math.PI) / 5 - Math.PI / 2;
            const r = i % 2 === 0 ? 50 : 24;
            const x = c + Math.cos(ang) * r;
            const y = c + Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(canvas);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // 创建 XZ 平面上的手绘风虚线圆环
      function createDashedCircle(radius, color, opacity, dashSize, gapSize, segments = 128) {
        const points = [];
        for (let i = 0; i <= segments; i++) {
          const theta = (i / segments) * Math.PI * 2;
          points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
        }
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineDashedMaterial({
          color: color,
          transparent: true,
          opacity: opacity,
          dashSize: dashSize,
          gapSize: gapSize
        });
        const line = new THREE.Line(geo, mat);
        line.computeLineDistances();
        return line;
      }

      // =========================================================================
      // 3. 主模拟应用初始化

      function initApp() {

        const starTex = createFourPointStarTexture('#fff8e0');

          scene.add(sp);
          twinkleStars.push({
            sprite: sp,
            baseScale,
            phase: Math.random() * Math.PI * 2,
            speed: 1.2 + Math.random() * 2.2
          });

        // ---------------------------------------------------------------------

        // ---------------------------------------------------------------------
        const SUN = {
          name: '暖阳太阳',
          radius: 5.0,
          gm: 280.0,
          color: '#ffd07b'

        const PLANET_DEFS = [

            name: '抹茶草地星',
            orbitR: 22.0,
            radius: 2.15,
            gm: 52.0,
            soiRadius: 7.4,
            deliveryRadius: 4.8,
            phase0: 0.7,
            colorHex: '#8ce0a8',
            ringColor: 0x8ce0a8
          },
          {
            id: 'peach',
            name: '蜜桃光环星',
            orbitR: 35.5,
            radius: 2.85,
            gm: 102.0,
            soiRadius: 10.6,
            deliveryRadius: 6.2,
            phase0: 2.6,
            colorHex: '#ffb38a',
            ringColor: 0xffb38a
          },
          {
            id: 'lavender',
            name: '芋泥陨石星',
            orbitR: 48.5,
            radius: 1.98,
            gm: 56.0,
            soiRadius: 7.6,
            deliveryRadius: 4.6,
            phase0: 4.5,

              break;
            }

          p.vel.copy(vel);
          p.startScale = opts.startScale || 0.55;
