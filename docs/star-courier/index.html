          camPitch: 0.94, // 约 54° 俯视手绘微缩沙盘感
          camLookAt: new THREE.Vector3(0, 0, 0)
        };

        // 键盘 & 触屏输入状态
        const keys = {
          up: false,
          down: false,
          left: false,
          right: false,
          zoomIn: false,
          zoomOut: false,
          shift: false
        };

        // 计算行星在任意时刻 t 的精确位置 (XZ 平面)
        function getPlanetPosAt(p, t, out) {
          const ang = p.phase0 + p.omega * t;
          out.x = Math.cos(ang) * p.orbitR;
          out.z = Math.sin(ang) * p.orbitR;
        }

        // 计算火箭在 (x, z, t) 处受到的多体总引力加速度 (太阳 + 4颗公转行星)
        const SOFTENING_SQ = 0.38;
        const _pPos = { x: 0, z: 0 };

        function computeGravityAccel(x, z, t, outAccel) {
          let ax = 0;
          let az = 0;

          // 1. 太阳引力
          const r2Sun = x * x + z * z + SOFTENING_SQ;
          const invR3Sun = 1.0 / (r2Sun * Math.sqrt(r2Sun));
          ax -= SUN.gm * x * invR3Sun;
          az -= SUN.gm * z * invR3Sun;

          // 2. 四颗公转行星引力
          for (let i = 0; i < planets.length; i++) {
            const p = planets[i];
            getPlanetPosAt(p, t, _pPos);
            const dx = _pPos.x - x;
            const dz = _pPos.z - z;
            const d2 = dx * dx + dz * dz + SOFTENING_SQ;
            const invD3 = 1.0 / (d2 * Math.sqrt(d2));
            ax += p.gm * dx * invD3;
            az += p.gm * dz * invD3;
          }

          outAccel.x = ax;
          outAccel.z = az;
        }

        // 四阶龙格-库塔 (RK4) 单步积分器（同时推进火箭与行星时间 t）
        const _k1a = { x: 0, z: 0 };
        const _k2a = { x: 0, z: 0 };
        const _k3a = { x: 0, z: 0 };
        const _k4a = { x: 0, z: 0 };

        function rk4Step(s, t, dt, thrustAx, thrustAz) {
          // k1
          computeGravityAccel(s.x, s.z, t, _k1a);
          const k1vx = _k1a.x + thrustAx;
          const k1vz = _k1a.z + thrustAz;
          const k1x = s.vx;
          const k1z = s.vz;

          // k2
          const halfDt = dt * 0.5;
          const x2 = s.x + k1x * halfDt;
          const z2 = s.z + k1z * halfDt;
          const vx2 = s.vx + k1vx * halfDt;
          const vz2 = s.vz + k1vz * halfDt;
          computeGravityAccel(x2, z2, t + halfDt, _k2a);
          const k2vx = _k2a.x + thrustAx;
          const k2vz = _k2a.z + thrustAz;
          const k2x = vx2;
          const k2z = vz2;

          // k3
          const x3 = s.x + k2x * halfDt;
          const z3 = s.z + k2z * halfDt;
          const vx3 = s.vx + k2vx * halfDt;
          const vz3 = s.vz + k2vz * halfDt;
          computeGravityAccel(x3, z3, t + halfDt, _k3a);
          const k3vx = _k3a.x + thrustAx;
          const k3vz = _k3a.z + thrustAz;
          const k3x = vx3;
          const k3z = vz3;

          // k4
          const x4 = s.x + k3x * dt;
          const z4 = s.z + k3z * dt;
          const vx4 = s.vx + k3vx * dt;
          const vz4 = s.vz + k3vz * dt;
          computeGravityAccel(x4, z4, t + dt, _k4a);
          const k4vx = _k4a.x + thrustAx;
          const k4vz = _k4a.z + thrustAz;
          const k4x = vx4;
          const k4z = vz4;

          const dt6 = dt / 6.0;
          s.x += (k1x + 2 * k2x + 2 * k3x + k4x) * dt6;
          s.z += (k1z + 2 * k2z + 2 * k3z + k4z) * dt6;
          s.vx += (k1vx + 2 * k2vx + 2 * k3vx + k4vx) * dt6;
          s.vz += (k1vz + 2 * k2vz + 2 * k3vz + k4vz) * dt6;
        }

        // 重置火箭到舒适、无碰撞风险的起始圆轨道
        function resetRocket(showMsg = false) {
          // 寻找抹茶草地星的对侧偏前相位作为起飞点，方便立刻向抹茶星或蜜桃星发起变轨
          const meadow = planets[0];
          const meadowAng = meadow.phase0 + meadow.omega * state.simTime;
          const startAng = meadowAng - 0.92;
          const startR = 27.5;
          const orbSpeed = Math.sqrt(SUN.gm / startR);

          state.rx = Math.cos(startAng) * startR;
          state.rz = Math.sin(startAng) * startR;
          // 逆时针切向速度
          state.vx = -Math.sin(startAng) * orbSpeed;
          state.vz = Math.cos(startAng) * orbSpeed;
          state.angle = Math.atan2(state.vx, state.vz);
          state.angVel = 0;
          state.bankAngle = 0;
          state.squash = 1.0;
          state.fuel = 100;
          state.crashed = false;
          state.crashTimer = 0;
          rocketRoot.visible = true;

          // 清空尾迹与弹弓追踪
          wakePoints.length = 0;
          state.slingshotTracker.activePlanetIdx = -1;
          state.slingshotTracker.triggered = false;

          if (showMsg) {
            showToast('🚀 小火箭已重新入轨，准备出发！', '#fff6dc');
          }
        }

        // ---------------------------------------------------------------------
        // 手账风浮动 Toast 提示
        // ---------------------------------------------------------------------
        const toastLayer = document.getElementById('toast-layer');
        function showToast(text, bgColor = '#fff7d6') {
          const el = document.createElement('div');
          el.className = 'toast-item sketch-card rounded-full px-4 py-2 text-sm font-black whitespace-nowrap flex items-center gap-1.5';
          el.style.backgroundColor = bgColor;
          el.textContent = text;
          toastLayer.appendChild(el);
          setTimeout(() => {
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 2500);
        }

        // ---------------------------------------------------------------------
        // 实时未来 220 步 RK4 轨道预测与可视化更新
        // ---------------------------------------------------------------------
        const predState = { x: 0, z: 0, vx: 0, vz: 0 };
        const predColorNormal = new THREE.Color(0xffe6a3);
        const predColorSlingshot = new THREE.Color(0x7ef7c8);
        const predColorCrash = new THREE.Color(0xff7878);
        const predColorDeliver = new THREE.Color(0xffd25a);

        function updateTrajectoryPrediction(visualTime) {
          if (state.crashed) {
            for (let i = 0; i < PRED_STEPS; i++) {
              dummyObj.position.set(0, -100, 0);
              dummyObj.scale.setScalar(0.001);
              dummyObj.updateMatrix();
              predInstanced.setMatrixAt(i, dummyObj.matrix);
            }
            predInstanced.instanceMatrix.needsUpdate = true;
            peSprite.visible = false;
            crashSprite.visible = false;
            deliverPredSprite.visible = false;
            return;
          }

          predState.x = state.rx;
          predState.z = state.rz;
          predState.vx = state.vx;
          predState.vz = state.vz;
          let t = state.simTime;

          let crashedAt = -1;
          let crashPosX = 0;
          let crashPosZ = 0;

          // 记录整个预测曲线上最具代表性的行星近地点 (Pe)
          let bestPeDistRatio = 1.0;
          let peFound = false;
          let peX = 0;
          let peZ = 0;
          const prevPlanetDist = planets.map(() => 999);
          const prevPrevDist = planets.map(() => 999);

          let deliverHitFound = false;
          let deliverX = 0;
          let deliverZ = 0;

          const stepPosX = new Float32Array(PRED_STEPS);
          const stepPosZ = new Float32Array(PRED_STEPS);
          const stepFlag = new Uint8Array(PRED_STEPS); // 0: normal, 1: slingshot SOI, 2: delivery halo

          for (let i = 0; i < PRED_STEPS; i++) {
            rk4Step(predState, t, PRED_DT, 0, 0);
            t += PRED_DT;

            stepPosX[i] = predState.x;
            stepPosZ[i] = predState.z;

            // 检测太阳碰撞
            const distSun = Math.hypot(predState.x, predState.z);
            if (distSun < SUN.radius + 0.55) {
              crashedAt = i;
              crashPosX = predState.x;
              crashPosZ = predState.z;
              break;
            }

            // 检测各行星碰撞、引力圈与近地点
            let flag = 0;
            for (let pIdx = 0; pIdx < planets.length; pIdx++) {
              const p = planets[pIdx];
              getPlanetPosAt(p, t, _pPos);
              const d = Math.hypot(predState.x - _pPos.x, predState.z - _pPos.z);

              if (d < p.radius + 0.52) {
                crashedAt = i;
                crashPosX = predState.x;
                crashPosZ = predState.z;
                break;
              }

              if (pIdx === state.targetPlanetIdx && d < p.deliveryRadius) {
                flag = 2;
                if (!deliverHitFound) {
                  deliverHitFound = true;
                  deliverX = predState.x;
                  deliverZ = predState.z;
                }
              } else if (d < p.soiRadius) {
                if (flag === 0) flag = 1;
              }

              // 检测局部极小值作为近地点 Pe
              if (i >= 2 && prevPlanetDist[pIdx] < p.soiRadius * 0.92 &&
                  prevPlanetDist[pIdx] < prevPrevDist[pIdx] && prevPlanetDist[pIdx] < d) {
                const ratio = prevPlanetDist[pIdx] / p.soiRadius;
                if (ratio < bestPeDistRatio) {
                  bestPeDistRatio = ratio;
                  peFound = true;
                  peX = stepPosX[i - 1];
                  peZ = stepPosZ[i - 1];
                }
              }
              prevPrevDist[pIdx] = prevPlanetDist[pIdx];
              prevPlanetDist[pIdx] = d;
            }

            if (crashedAt >= 0) break;
            stepFlag[i] = flag;
          }

          const validCount = crashedAt >= 0 ? crashedAt : PRED_STEPS;
          const marchPhase = visualTime * 5.2;

          for (let i = 0; i < PRED_STEPS; i++) {
            if (i < validCount) {
              const frac = i / PRED_STEPS;
              // 沿轨道轻轻前进的星尘脉动效果
              const pulse = 0.82 + 0.25 * Math.sin(i * 0.55 - marchPhase);
              const size = (1.15 - frac * 0.72) * pulse;
              dummyObj.position.set(stepPosX[i], 0.08, stepPosZ[i]);
              dummyObj.scale.setScalar(Math.max(0.18, size));
              dummyObj.updateMatrix();
              predInstanced.setMatrixAt(i, dummyObj.matrix);

              if (crashedAt >= 0) {
                // 碰撞航线：柔和珊瑚红渐变提示
                tmpColor.copy(predColorCrash).lerp(predColorNormal, (1 - frac) * 0.22);
              } else if (stepFlag[i] === 2) {
                tmpColor.copy(predColorDeliver);
              } else if (stepFlag[i] === 1) {
                tmpColor.copy(predColorSlingshot);
              } else {
                tmpColor.copy(predColorNormal);
              }
              predInstanced.setColorAt(i, tmpColor);
            } else {
              dummyObj.position.set(0, -100, 0);
              dummyObj.scale.setScalar(0.001);
              dummyObj.updateMatrix();
              predInstanced.setMatrixAt(i, dummyObj.matrix);
            }
          }

          predInstanced.instanceMatrix.needsUpdate = true;
          if (predInstanced.instanceColor) predInstanced.instanceColor.needsUpdate = true;

          // 更新 Pe / 碰撞 × / 送达星 浮标
          if (crashedAt >= 0) {
            crashSprite.visible = true;
            crashSprite.position.set(crashPosX, 1.4, crashPosZ);
            const s = 2.4 + Math.sin(visualTime * 8) * 0.22;
            crashSprite.scale.set(s, s, 1);
            peSprite.visible = false;
            deliverPredSprite.visible = false;
          } else {
            crashSprite.visible = false;
            if (deliverHitFound) {
              deliverPredSprite.visible = true;
              deliverPredSprite.position.set(deliverX, 1.5, deliverZ);
              const ds = 2.1 + Math.sin(visualTime * 6) * 0.2;
              deliverPredSprite.scale.set(ds, ds, 1);
            } else {
              deliverPredSprite.visible = false;
            }

            if (peFound) {
              peSprite.visible = true;
              peSprite.position.set(peX, 1.45, peZ);
              const ps = 2.15 + Math.sin(visualTime * 5) * 0.16;
              peSprite.scale.set(ps, ps, 1);
            } else {
              peSprite.visible = false;
            }
          }
        }

        // ---------------------------------------------------------------------
        // HUD DOM 引用与界面同步
        // ---------------------------------------------------------------------
        const hudTargetName = document.getElementById('hud-target-name');
        const hudTargetDot = document.getElementById('hud-target-dot');
        const hudTargetDist = document.getElementById('hud-target-dist');
        const hudSpeed = document.getElementById('hud-speed');
        const hudGravityWell = document.getElementById('hud-gravity-well');
        const hudFuelText = document.getElementById('hud-fuel-text');
        const hudFuelBar = document.getElementById('hud-fuel-bar');
        const hudDeliveries = document.getElementById('hud-deliveries');
        const hudStars = document.getElementById('hud-stars');
        const hudSlingshots = document.getElementById('hud-slingshots');
        const statusPill = document.getElementById('status-pill');
        const statusPillIcon = document.getElementById('status-pill-icon');
        const statusPillText = document.getElementById('status-pill-text');
        const paperVignette = document.getElementById('paper-vignette');
        const offscreenInd = document.getElementById('offscreen-indicator');
        const offscreenArrow = document.getElementById('offscreen-arrow');
        const offscreenLabel = document.getElementById('offscreen-label');

        const btnCamera = document.getElementById('btn-camera');
        const btnCameraLabel = document.getElementById('btn-camera-label');
        const btnInfFuel = document.getElementById('btn-inf-fuel');
        const btnSound = document.getElementById('btn-sound');
        const btnSoundIcon = document.getElementById('btn-sound-icon');
        const btnReset = document.getElementById('btn-reset');

        const keyPills = {
          ws: document.getElementById('key-ws'),
          ad: document.getElementById('key-ad'),
          shift: document.getElementById('key-shift'),
          qe: document.getElementById('key-qe'),
          space: document.getElementById('key-space'),
          r: document.getElementById('key-r')
        };

        function updateTargetUI() {
          const target = planets[state.targetPlanetIdx];
          hudTargetName.textContent = target.name;
          hudTargetDot.style.background = target.colorHex;
          offscreenLabel.textContent = target.name;
        }

        function pickNextDestination() {
          const prev = state.targetPlanetIdx;
          // 优先挑选离当前位置较远的其他行星，鼓励再次利用引力弹弓
          let candidates = [0, 1, 2, 3].filter((i) => i !== prev);
          candidates.sort((a, b) => {
            const da = Math.hypot(planets[a].pos.x - state.rx, planets[a].pos.z - state.rz);
            const db = Math.hypot(planets[b].pos.x - state.rx, planets[b].pos.z - state.rz);
            return db - da;
          });
          // 从最远的两颗里随机选一颗
          state.targetPlanetIdx = candidates[Math.floor(Math.random() * Math.min(2, candidates.length))];
          updateTargetUI();
        }

        // ---------------------------------------------------------------------
        // 按钮与键鼠/触控事件绑定
        // ---------------------------------------------------------------------
        function toggleCameraMode() {
          state.cameraMode = state.cameraMode === 'follow' ? 'overview' : 'follow';
          btnCameraLabel.textContent = state.cameraMode === 'follow' ? '跟随' : '全景';
          btnCamera.classList.toggle('active', state.cameraMode === 'overview');
          showToast(state.cameraMode === 'follow' ? '🎥 切换至火箭跟随视角' : '🌌 切换至星系全景视角', '#e6f5ff');
        }

        function togglePause() {
          state.paused = !state.paused;
          if (state.paused) {
            sound.setThruster(0, 0, false);
          }
          syncStatusPill();
        }

        function syncStatusPill() {
          if (state.paused) {
            statusPill.classList.remove('hidden');
            statusPill.classList.add('flex');
            statusPillIcon.textContent = '⏸';
            statusPillText.textContent = '已暂停 · 按 Space 继续';
            paperVignette.classList.remove('slowmo-active');
          } else if (state.slowMo) {
            statusPill.classList.remove('hidden');
            statusPill.classList.add('flex');
            statusPillIcon.textContent = '⏱';
            statusPillText.textContent = '慢动作瞄准 0.25×';
            paperVignette.classList.add('slowmo-active');
          } else {
            statusPill.classList.add('hidden');
            statusPill.classList.remove('flex');
            paperVignette.classList.remove('slowmo-active');
          }
        }

        btnCamera.addEventListener('click', () => {
          sound.unlock();
          toggleCameraMode();
        });

        btnInfFuel.addEventListener('click', () => {
          sound.unlock();
          state.infiniteFuel = !state.infiniteFuel;
          btnInfFuel.classList.toggle('active', state.infiniteFuel);
          if (state.infiniteFuel) state.fuel = 100;
          showToast(state.infiniteFuel ? '⛽ 已开启无限燃料模式' : '⛽ 已恢复标准燃料模式', '#fff2d6');
        });

        btnSound.addEventListener('click', () => {
          sound.unlock();
          sound.enabled = !sound.enabled;
          btnSound.classList.toggle('active', sound.enabled);
          btnSoundIcon.textContent = sound.enabled ? '🔊' : '🔇';
          if (!sound.enabled) sound.setThruster(0, 0, false);
        });

        btnReset.addEventListener('click', () => {
          sound.unlock();
          resetRocket(true);
        });

        // 键盘控制
        window.addEventListener('keydown', (e) => {
          sound.unlock();
          const code = e.code;
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) {
            e.preventDefault();
          }
          if (code === 'KeyW' || code === 'ArrowUp') keys.up = true;
          if (code === 'KeyS' || code === 'ArrowDown') keys.down = true;
          if (code === 'KeyA' || code === 'ArrowLeft') keys.left = true;
          if (code === 'KeyD' || code === 'ArrowRight') keys.right = true;
          if (code === 'KeyQ') keys.zoomOut = true;
          if (code === 'KeyE') keys.zoomIn = true;
          if (code === 'ShiftLeft' || code === 'ShiftRight') {
            keys.shift = true;
            state.slowMo = true;
            syncStatusPill();
          }
          if (code === 'Space' && !e.repeat) togglePause();
          if (code === 'KeyV' && !e.repeat) toggleCameraMode();
          if (code === 'KeyR' && !e.repeat) {
            if (keyPills.r) {
              keyPills.r.classList.add('pressed');
              setTimeout(() => keyPills.r.classList.remove('pressed'), 220);
            }
            resetRocket(true);
          }
        });

        window.addEventListener('keyup', (e) => {
          const code = e.code;
          if (code === 'KeyW' || code === 'ArrowUp') keys.up = false;
          if (code === 'KeyS' || code === 'ArrowDown') keys.down = false;
          if (code === 'KeyA' || code === 'ArrowLeft') keys.left = false;
          if (code === 'KeyD' || code === 'ArrowRight') keys.right = false;
          if (code === 'KeyQ') keys.zoomOut = false;
          if (code === 'KeyE') keys.zoomIn = false;
          if (code === 'ShiftLeft' || code === 'ShiftRight') {
            keys.shift = false;
            state.slowMo = false;
            syncStatusPill();
          }
        });

        // 窗口失焦时安全释放按键，防止卡键
        window.addEventListener('blur', () => {
          keys.up = keys.down = keys.left = keys.right = keys.zoomIn = keys.zoomOut = keys.shift = false;
          state.slowMo = false;
          syncStatusPill();
        });

        // 鼠标滚轮缩放 + 拖拽轻柔旋转俯仰观察 3D 立体微缩沙盘
        let isDragging = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        renderer.domElement.addEventListener('wheel', (e) => {
          e.preventDefault();
          state.camTargetZoom *= e.deltaY > 0 ? 1.1 : 0.91;
          state.camTargetZoom = Math.max(0.42, Math.min(2.35, state.camTargetZoom));
        }, { passive: false });

        renderer.domElement.addEventListener('mousedown', (e) => {
          sound.unlock();
          isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
          if (!isDragging) return;
          const dx = e.clientX - lastMouseX;
          const dy = e.clientY - lastMouseY;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          state.camYaw -= dx * 0.0065;
          state.camPitch = Math.max(0.45, Math.min(1.42, state.camPitch + dy * 0.0055));
        });

        window.addEventListener('mouseup', () => {
          isDragging = false;
        });

        // 移动端触屏按钮绑定
        document.querySelectorAll('[data-touch]').forEach((btn) => {
          const action = btn.getAttribute('data-touch');
          const setAction = (val) => {
            sound.unlock();
            if (action === 'left') keys.left = val;
            if (action === 'right') keys.right = val;
            if (action === 'thrust') keys.up = val;
            if (action === 'brake') keys.down = val;
            if (action === 'slow') {
              keys.shift = val;
              state.slowMo = val;
              syncStatusPill();
            }
          };
          btn.addEventListener('touchstart', (e) => { e.preventDefault(); setAction(true); }, { passive: false });
          btn.addEventListener('touchend', (e) => { e.preventDefault(); setAction(false); }, { passive: false });
          btn.addEventListener('touchcancel', () => setAction(false));
        });

        // 响应式画布尺寸自适应
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ---------------------------------------------------------------------
        // 初始化世界物体状态
        // ---------------------------------------------------------------------
        planets.forEach((p) => {
          getPlanetPosAt(p, 0, _pPos);
          p.pos.set(_pPos.x, 0, _pPos.z);
          p.group.position.copy(p.pos);
        });
        spawnStarCandies();
        resetRocket(false);
        updateTargetUI();

        // 开场友好提示
        setTimeout(() => {
          showToast('✨ 按 W 推进，借行星引力弹弓把快递送到目标星球！', '#fff7d6');
        }, 500);

        // ---------------------------------------------------------------------
        // 屏幕外目的地方向指示器更新
        // ---------------------------------------------------------------------
        const _projVec = new THREE.Vector3();
        function updateOffscreenIndicator() {
          const target = planets[state.targetPlanetIdx];
          _projVec.copy(target.pos);
          _projVec.y += 2.0;
          _projVec.project(camera);

          const inFront = _projVec.z < 1.0;
          const onScreen = inFront && Math.abs(_projVec.x) <= 0.92 && Math.abs(_projVec.y) <= 0.88;

          if (onScreen) {
            offscreenInd.classList.add('hidden');
            return;
          }

          offscreenInd.classList.remove('hidden');
          let sx = _projVec.x;
          let sy = _projVec.y;
          if (!inFront) {
            sx = -sx;
            sy = -sy;
          }
          const ang = Math.atan2(sy, sx);
          const padX = window.innerWidth * 0.43;
          const padY = window.innerHeight * 0.41;
          const cx = window.innerWidth * 0.5;
          const cy = window.innerHeight * 0.5;

          const cosA = Math.cos(ang);
          const sinA = Math.sin(ang);
          const scale = Math.min(
            Math.abs(padX / (cosA || 0.0001)),
            Math.abs(padY / (sinA || 0.0001))
          );

          const px = Math.max(76, Math.min(window.innerWidth - 76, cx + cosA * scale));
          const py = Math.max(66, Math.min(window.innerHeight - 66, cy - sinA * scale));
          offscreenInd.style.left = px + 'px';
          offscreenInd.style.top = py + 'px';
          offscreenArrow.style.transform = `rotate(${-ang}rad)`;
        }

        // ---------------------------------------------------------------------
        // 主动画循环 (60fps，带 clamped dt 保护)
        // ---------------------------------------------------------------------
        let lastFrameTime = performance.now();
        let visualTime = 0;
        let puffTimer = 0;
        let wakeTimer = 0;
        const liveState = { x: 0, z: 0, vx: 0, vz: 0 };

        function animate(now) {
          requestAnimationFrame(animate);

          const rawDt = Math.min(0.05, Math.max(0.001, (now - lastFrameTime) / 1000));
          lastFrameTime = now;
          visualTime += rawDt;

          // 底部按键指示胶囊实时高亮
          if (keyPills.ws) keyPills.ws.classList.toggle('pressed', keys.up || keys.down);
          if (keyPills.ad) keyPills.ad.classList.toggle('pressed', keys.left || keys.right);
          if (keyPills.shift) keyPills.shift.classList.toggle('pressed', keys.shift);
          if (keyPills.qe) keyPills.qe.classList.toggle('pressed', keys.zoomIn || keys.zoomOut);
          if (keyPills.space) keyPills.space.classList.toggle('pressed', state.paused);

          // 缩放输入（暂停时依然允许自由缩放观察）
          if (keys.zoomOut) state.camTargetZoom = Math.min(2.35, state.camTargetZoom * (1 + rawDt * 1.15));
          if (keys.zoomIn) state.camTargetZoom = Math.max(0.42, state.camTargetZoom * (1 - rawDt * 1.15));
          state.camZoom += (state.camTargetZoom - state.camZoom) * Math.min(1, rawDt * 7.5);

          // 背景星空闪烁 + 暖阳呼吸动画
          for (let i = 0; i < twinkleStars.length; i++) {
            const s = twinkleStars[i];
            const tw = 0.72 + 0.35 * Math.sin(visualTime * s.speed + s.phase);
            s.sprite.scale.set(s.baseScale * tw, s.baseScale * tw, 1);
            s.sprite.material.opacity = 0.52 + 0.42 * tw;
          }
          const sunPulse = 1.0 + Math.sin(visualTime * 2.1) * 0.025;
          sunMesh.scale.setScalar(sunPulse);
          sunMesh.rotation.y += rawDt * 0.14;
          sunbeamPlane.rotation.z -= rawDt * 0.16;

          // 计算模拟时间步长（支持暂停与 Shift 0.25× 慢动作）
          const timeScale = state.paused ? 0 : (state.slowMo ? 0.25 : 1.0);
          const simDt = rawDt * timeScale;

          if (simDt > 0) {
            state.simTime += simDt;

            // 更新 4 颗行星位置与自转、附属小云朵动画
            for (let i = 0; i < planets.length; i++) {
              const p = planets[i];
              const prevX = p.pos.x;
              const prevZ = p.pos.z;
              getPlanetPosAt(p, state.simTime, _pPos);
              p.pos.set(_pPos.x, 0, _pPos.z);
              p.vel.set((p.pos.x - prevX) / simDt, 0, (p.pos.z - prevZ) / simDt);
              p.group.position.copy(p.pos);
              p.spinGroup.rotation.y += simDt * 0.42;
              if (p._clouds) p._clouds.rotation.y -= simDt * 0.55;
              if (p._ring) p._ring.rotation.z += simDt * 0.18;

              // 弹弓冷却递减
              if (state.slingshotTracker.cooldowns[i] > 0) {
                state.slingshotTracker.cooldowns[i] = Math.max(0, state.slingshotTracker.cooldowns[i] - simDt);
              }
            }

            // 更新星星糖位置与旋转
            for (let i = 0; i < starCandies.length; i++) {
              const c = starCandies[i];
              if (c.collected) continue;
              const ang = c.phase0 + c.omega * state.simTime;
              c.pos.set(Math.cos(ang) * c.orbitR, Math.sin(visualTime * 2.8 + c.bobPhase) * 0.45, Math.sin(ang) * c.orbitR);
              c.mesh.position.copy(c.pos);
              c.mesh.rotation.y += simDt * 1.6;
            }

            // 撞击后的短暂自动重置倒计时
            if (state.crashed) {
              sound.setThruster(0, 0, false);
              state.crashTimer -= rawDt;
              if (state.crashTimer <= 0) {
                resetRocket(false);
              }
            } else {
              // ---------------- 火箭转向与推进控制 ----------------
              const turnInput = (keys.left ? 1 : 0) - (keys.right ? 1 : 0);
              const targetAngVel = turnInput * 2.85;
              // 慢动作时允许玩家按真实手感微调朝向，瞄准更丝滑
              const steerDt = state.slowMo ? rawDt * 0.55 : simDt;
              state.angVel += (targetAngVel - state.angVel) * Math.min(1, steerDt * 12.0);
              state.angle += state.angVel * steerDt;

              // 可爱滚转倾斜与天线摆动
              const targetBank = -turnInput * 0.48;
              state.bankAngle += (targetBank - state.bankAngle) * Math.min(1, rawDt * 10.0);
              state.antennaSway += (state.angVel * 0.18 - state.antennaSway) * Math.min(1, rawDt * 9.0);

              const hasFuel = state.infiniteFuel || state.fuel > 0.1;
              const thrusting = keys.up && hasFuel;
              const braking = keys.down && hasFuel && !thrusting;

              let thrustAx = 0;
              let thrustAz = 0;
              const fwdX = Math.sin(state.angle);
              const fwdZ = Math.cos(state.angle);

              if (thrusting) {
                const thrustAccel = 5.0;
                thrustAx = fwdX * thrustAccel;
                thrustAz = fwdZ * thrustAccel;
                if (!state.infiniteFuel) {
                  state.fuel = Math.max(0, state.fuel - simDt * 6.2);
                }
              } else if (braking) {
                const retroAccel = 3.0;
                thrustAx = -fwdX * retroAccel;
                thrustAz = -fwdZ * retroAccel;
                if (!state.infiniteFuel) {
                  state.fuel = Math.max(0, state.fuel - simDt * 3.8);
                }
              } else if (!state.infiniteFuel && state.fuel < 15) {
                // 贴心应急微弱太阳能回充，防止玩家完全失去动力卡死
                state.fuel = Math.min(15, state.fuel + simDt * 2.6);
              }

              // 推进挤压拉伸 + 尾焰 + 音效
              const targetSquash = thrusting ? 1.13 : (braking ? 0.92 : 1.0);
              state.squash += (targetSquash - state.squash) * Math.min(1, rawDt * 12.0);
              flameMesh.visible = thrusting;
              if (thrusting) {
                const fScale = 0.85 + Math.random() * 0.4;
                flameMesh.scale.set(0.95, 0.95, fScale);
              }
              sound.setThruster(thrusting ? 1 : 0, braking ? 1 : 0, state.slowMo);

              // 生成棉花云手绘推进尾烟
              puffTimer -= rawDt;
              if ((thrusting || braking) && puffTimer <= 0) {
                puffTimer = state.slowMo ? 0.08 : 0.036;
                if (thrusting) {
                  const backPos = new THREE.Vector3(
                    state.rx - fwdX * 1.15 + (Math.random() - 0.5) * 0.22,
                    (Math.random() - 0.5) * 0.18,
                    state.rz - fwdZ * 1.15 + (Math.random() - 0.5) * 0.22
                  );
                  const backVel = new THREE.Vector3(
                    state.vx - fwdX * (3.6 + Math.random() * 1.8) + (Math.random() - 0.5) * 0.9,
                    (Math.random() - 0.5) * 0.5,
                    state.vz - fwdZ * (3.6 + Math.random() * 1.8) + (Math.random() - 0.5) * 0.9
                  );
                  spawnPuff(backPos, backVel, {
                    life: 0.72,
                    startScale: 0.58,
                    endScale: 1.95,
                    startColor: 0xffa640,
                    endColor: 0xfff8eb
                  });
                } else if (braking) {
                  // 前侧两个反向喷口吐出轻柔白烟
                  const sideX = fwdZ;
                  const sideZ = -fwdX;
                  [-1, 1].forEach((side) => {
                    const pPos = new THREE.Vector3(
                      state.rx + fwdX * 0.65 + sideX * side * 0.45,
                      0,
                      state.rz + fwdZ * 0.65 + sideZ * side * 0.45
                    );
                    const pVel = new THREE.Vector3(
                      state.vx + fwdX * 2.8 + sideX * side * 1.1,
                      (Math.random() - 0.5) * 0.3,
                      state.vz + fwdZ * 2.8 + sideZ * side * 1.1
                    );
                    spawnPuff(pPos, pVel, {
                      life: 0.48,
                      startScale: 0.35,
                      endScale: 1.15,
                      startColor: 0xd9f2ff,
                      endColor: 0xffffff
                    });
                  });
                }
              }

              // RK4 物理步进（拆分为2个子步进一步提升极端近掠时的精度）
              liveState.x = state.rx;
              liveState.z = state.rz;
              liveState.vx = state.vx;
              liveState.vz = state.vz;
              const subDt = simDt * 0.5;
              rk4Step(liveState, state.simTime - simDt, subDt, thrustAx, thrustAz);
              rk4Step(liveState, state.simTime - subDt, subDt, thrustAx, thrustAz);
              state.rx = liveState.x;
              state.rz = liveState.z;
              state.vx = liveState.vx;
              state.vz = liveState.vz;

              // 记录小火箭手绘点状飞行尾迹
              wakeTimer -= simDt;
              if (wakeTimer <= 0) {
                wakeTimer = 0.09;
                wakePoints.unshift(new THREE.Vector3(state.rx, 0.02, state.rz));
                if (wakePoints.length > WAKE_COUNT) wakePoints.pop();
              }

              // ---------------- 碰撞、快递送达、星星糖与引力弹弓判定 ----------------
              const distSun = Math.hypot(state.rx, state.rz);
              if (distSun < SUN.radius + 0.58) {
                triggerCrash('哎呀，靠近太阳太烫啦！准备重新出发~');
              } else {
                let dominantWellName = '暖阳太阳系';
                let strongestPull = SUN.gm / (distSun * distSun + SOFTENING_SQ);
                let pullTargetPos = new THREE.Vector3(0, 0, 0);
                let insideAnyPlanetIdx = -1;

                for (let i = 0; i < planets.length; i++) {
                  const p = planets[i];
                  const d = Math.hypot(state.rx - p.pos.x, state.rz - p.pos.z);

                  // 撞到行星表面
                  if (d < p.radius + 0.55) {
                    triggerCrash(`哎呀，轻轻撞上了${p.name}！准备重新出发~`);
                    break;
                  }

                  // 判断引力场主导权
                  const pPull = p.gm / (d * d + SOFTENING_SQ);
                  if (d < p.soiRadius) {
                    dominantWellName = p.name;
                    insideAnyPlanetIdx = i;
                    p.insideSOI = true;
                  } else {
                    p.insideSOI = false;
                  }
                  if (pPull > strongestPull) {
                    strongestPull = pPull;
                    pullTargetPos.copy(p.pos);
                  }

                  // 判断快递送达目标行星
                  if (i === state.targetPlanetIdx && d < p.deliveryRadius) {
                    state.deliveries++;
                    state.fuel = 100;
                    hudDeliveries.textContent = state.deliveries;
                    sound.playDelivery();
                    spawnCelebrationBurst(
                      new THREE.Vector3(state.rx, 0.4, state.rz),
                      [0xffe066, 0xff8fab, 0x7ef7c8, 0x89d8f7],
                      28,
                      6.4
                    );
                    showToast(`📦 快递送达 ${p.name}！燃料已加满 ✨`, '#e6fff2');
                    pickNextDestination();
                    // 若星星糖收集得差不多则刷新一批
                    if (starCandies.filter((c) => !c.collected).length <= 1) {
                      spawnStarCandies();
                    }
                  }
                }

                if (!state.crashed) {
                  hudGravityWell.textContent = dominantWellName;

                  // 更新实时引力箭头与速度方向箭头
                  const pullDir = new THREE.Vector3(pullTargetPos.x - state.rx, 0, pullTargetPos.z - state.rz);
                  if (pullDir.lengthSq() > 0.001) {
                    pullDir.normalize();
                    gravityArrow.position.set(state.rx, 0.15, state.rz);
                    gravityArrow.setDirection(pullDir);
                    const gLen = Math.min(5.2, Math.max(1.5, strongestPull * 1.45));
                    gravityArrow.setLength(gLen, 0.72, 0.48);
                    gravityArrow.visible = true;
                  }

                  const speed = Math.hypot(state.vx, state.vz);
                  if (speed > 0.15) {
                    velocityArrow.position.set(state.rx, 0.22, state.rz);
                    velocityArrow.setDirection(new THREE.Vector3(state.vx / speed, 0, state.vz / speed));
                    velocityArrow.setLength(Math.min(4.6, Math.max(1.6, speed * 0.62)), 0.62, 0.38);
                    velocityArrow.visible = true;
                  } else {
                    velocityArrow.visible = false;
                  }

                  // 引力弹弓追踪逻辑（绕过非目标行星或高速甩尾偏转）
                  const tr = state.slingshotTracker;
                  if (insideAnyPlanetIdx !== -1 && insideAnyPlanetIdx !== state.targetPlanetIdx) {
                    const p = planets[insideAnyPlanetIdx];
                    const d = Math.hypot(state.rx - p.pos.x, state.rz - p.pos.z);

                    if (tr.activePlanetIdx !== insideAnyPlanetIdx) {
                      // 刚进入该行星引力圈
                      tr.activePlanetIdx = insideAnyPlanetIdx;
                      tr.entrySpeed = Math.max(0.5, speed);
                      tr.entryDirX = speed > 0.01 ? state.vx / speed : 0;
                      tr.entryDirZ = speed > 0.01 ? state.vz / speed : 1;
                      tr.minDist = d;
                      tr.triggered = false;
                    } else {
                      tr.minDist = Math.min(tr.minDist, d);
                      if (!tr.triggered && tr.cooldowns[insideAnyPlanetIdx] <= 0 && tr.minDist < p.soiRadius * 0.85) {
                        const speedGainRatio = (speed - tr.entrySpeed) / tr.entrySpeed;
                        const dot = Math.max(-1, Math.min(1, (state.vx / (speed || 1)) * tr.entryDirX + (state.vz / (speed || 1)) * tr.entryDirZ));
                        const deflectDeg = Math.round(Math.acos(dot) * (180 / Math.PI));

                        // 当速度提升超过 10% 或引力偏转超过 26° 时触发弹弓反馈
                        if (speedGainRatio >= 0.10 || deflectDeg >= 26) {
                          tr.triggered = true;
                          tr.cooldowns[insideAnyPlanetIdx] = 5.5;
                          state.slingshotCount++;
                          hudSlingshots.textContent = state.slingshotCount;
                          if (!state.infiniteFuel) {
                            state.fuel = Math.min(100, state.fuel + 15);
                          }
                          sound.playSlingshot();
                          spawnCelebrationBurst(
                            new THREE.Vector3(state.rx, 0.3, state.rz),
                            [0xffe066, 0x7ef7c8, 0xffffff],
                            22,
                            5.2
                          );
                          const pct = Math.max(8, Math.round(speedGainRatio * 100));
                          if (speedGainRatio >= 0.08) {
                            showToast(`⚡ 引力弹弓加速！+${pct}% (${p.name})`, '#e2fff0');
                          } else {
                            showToast(`🌀 引力弹弓变轨！偏转 ${deflectDeg}° (${p.name})`, '#e6f5ff');
                          }
                        }
                      }
                    }
                  } else if (tr.activePlanetIdx !== -1) {
                    tr.activePlanetIdx = -1;
                    tr.triggered = false;
                  }

                  // 星星糖拾取检测
                  for (let i = 0; i < starCandies.length; i++) {
                    const c = starCandies[i];
                    if (c.collected) continue;
                    const d = Math.hypot(state.rx - c.pos.x, state.rz - c.pos.z);
                    if (d < 2.2) {
                      c.collected = true;
                      c.mesh.visible = false;
                      state.starsCollected++;
                      hudStars.textContent = state.starsCollected;
                      if (!state.infiniteFuel) {
                        state.fuel = Math.min(100, state.fuel + 22);
                      }
                      sound.playStarPickup();
                      spawnCelebrationBurst(c.pos, [0xffe073, 0xffa6c9, 0xffffff], 14, 4.2);
                      showToast('⭐ 收集到一颗星星糖！燃料 +22%', '#fff4d1');
                    }
                  }
                }
              }
            }
          }

          // ---------------- 同步视觉网格、SOI 涟漪与目标信标 ----------------
          rocketRoot.position.set(state.rx, 0.25, state.rz);
          rocketRoot.rotation.y = state.angle;
          rocketModel.rotation.z = state.bankAngle;
          const invSq = 1 / Math.sqrt(state.squash);
          rocketModel.scale.set(invSq, invSq, state.squash);
          antennaPivot.rotation.y = -state.antennaSway;
          antennaPivot.rotation.x = Math.sin(visualTime * 9.0) * 0.06;

          // 更新行星引力圈发光涟漪
          for (let i = 0; i < planets.length; i++) {
            const p = planets[i];
            const targetOp = p.insideSOI ? 0.85 : 0.28;
            p.soiRing.material.opacity += (targetOp - p.soiRing.material.opacity) * Math.min(1, rawDt * 8);
            p.soiRing.rotation.y += rawDt * (p.insideSOI ? 0.55 : 0.1);

            if (p.insideSOI) {
              p.ripplePhase = (p.ripplePhase + rawDt * 0.95) % 1.0;
              const sc = 1.0 + p.ripplePhase * ((p.soiRadius / p.radius) - 1.0);
              p.rippleMesh.scale.setScalar(sc);
              p.rippleMesh.material.opacity = (1.0 - p.ripplePhase) * 0.55;
            } else {
              p.rippleMesh.material.opacity *= 0.88;
            }
          }

          // 更新目标星球浮空星星信标与脉动送达圆环
          const targetPlanet = planets[state.targetPlanetIdx];
          beaconGroup.position.copy(targetPlanet.pos);
          beaconStarMesh.position.y = targetPlanet.radius + 2.3 + Math.sin(visualTime * 3.2) * 0.42;
          beaconStarMesh.rotation.y = visualTime * 1.4;
          const haloPulse = 1.0 + Math.sin(visualTime * 3.6) * 0.045;
          deliveryHalo.scale.setScalar(targetPlanet.deliveryRadius * haloPulse);
          deliveryHalo.rotation.y = -visualTime * 0.45;
          deliverySoftFill.scale.setScalar(targetPlanet.deliveryRadius * haloPulse);

          // 更新飞行尾迹点阵
          for (let i = 0; i < WAKE_COUNT; i++) {
            if (i < wakePoints.length) {
              const frac = i / WAKE_COUNT;
              dummyObj.position.copy(wakePoints[i]);
              dummyObj.scale.setScalar(Math.max(0.1, (1 - frac) * 1.0));
              dummyObj.updateMatrix();
              wakeMesh.setMatrixAt(i, dummyObj.matrix);
            } else {
              dummyObj.position.set(0, -100, 0);
              dummyObj.scale.setScalar(0.001);
              dummyObj.updateMatrix();
              wakeMesh.setMatrixAt(i, dummyObj.matrix);
            }
          }
          wakeMesh.instanceMatrix.needsUpdate = true;

          // 更新棉花云粒子与庆祝粒子
          for (let i = 0; i < MAX_PUFFS; i++) {
            const p = puffPool[i];
            if (!p.active) continue;
            p.age += rawDt * (state.paused ? 0 : (state.slowMo ? 0.35 : 1.0));
            if (p.age >= p.life) {
              p.active = false;
              p.mesh.visible = false;
              continue;
            }
            const t = p.age / p.life;
            p.pos.addScaledVector(p.vel, rawDt * (state.paused ? 0 : (state.slowMo ? 0.35 : 1.0)));
            p.vel.multiplyScalar(0.965);
            p.mesh.position.copy(p.pos);
            const sc = p.startScale + (p.endScale - p.startScale) * t;
            p.mesh.scale.setScalar(Math.max(0.05, sc));
            p.mesh.material.color.copy(p.startColor).lerp(p.endColor, Math.min(1, t * 1.35));
            p.mesh.material.opacity = (1 - t) * 0.88;
          }

          // 每帧实时重算未来 220 步 RK4 预测轨迹
          updateTrajectoryPrediction(visualTime);

          // ---------------- 平滑镜头跟随 / 全景模式 ----------------
          const desiredTarget = new THREE.Vector3();
          let baseDist = 42;
          if (state.cameraMode === 'overview') {
            desiredTarget.set(0, 0, 0);
            baseDist = 112;
          } else {
            // 略微向火箭前方速度方向前瞻，构图更开阔
            desiredTarget.set(
              state.rx + state.vx * 0.9,
              0,
              state.rz + state.vz * 0.9
            );
            baseDist = 42;
          }

          state.camLookAt.lerp(desiredTarget, Math.min(1, rawDt * 5.2));
          const camDist = baseDist * state.camZoom;
          const horiz = Math.cos(state.camPitch) * camDist;
          const camX = state.camLookAt.x + Math.sin(state.camYaw) * horiz;
          const camY = Math.sin(state.camPitch) * camDist;
          const camZ = state.camLookAt.z + Math.cos(state.camYaw) * horiz;
          camera.position.lerp(new THREE.Vector3(camX, camY, camZ), Math.min(1, rawDt * 7.5));
          camera.lookAt(state.camLookAt);

          // ---------------- 更新 HUD 数值 ----------------
          const curSpeed = Math.hypot(state.vx, state.vz);
          hudSpeed.textContent = (curSpeed * 3.2).toFixed(1);
          const distToTarget = Math.hypot(state.rx - targetPlanet.pos.x, state.rz - targetPlanet.pos.z);
          hudTargetDist.textContent = Math.max(0, Math.round(distToTarget - targetPlanet.deliveryRadius)) + ' Mm';

          const fuelPct = state.infiniteFuel ? 100 : Math.round(state.fuel);
          hudFuelText.textContent = state.infiniteFuel ? '∞' : fuelPct + '%';
          hudFuelBar.style.width = fuelPct + '%';

          updateOffscreenIndicator();

          renderer.render(scene, camera);
        }

        function triggerCrash(msg) {
          if (state.crashed) return;
          state.crashed = true;
          state.crashTimer = 1.55;
          rocketRoot.visible = false;
          gravityArrow.visible = false;
          velocityArrow.visible = false;
          sound.playCuteCrash();
          spawnCelebrationBurst(
            new THREE.Vector3(state.rx, 0.3, state.rz),
            [0xffe066, 0xff8585, 0xfff7e8, 0xb794f4],
            26,
            5.8
          );
          showToast('💥 ' + msg, '#ffe3e3');
        }

        // 启动主循环
        requestAnimationFrame(animate);
      }

      // 页面加载完毕后安全启动
      window.addEventListener('load', () => {
        try {
          initApp();
        } catch (err) {
          console.error('初始化 3D 场景失败:', err);
          const fallback = document.createElement('div');
          fallback.className = 'fixed inset-0 flex items-center justify-center p-6 text-center';
          fallback.innerHTML = '<div class="sketch-card rounded-2xl p-6 max-w-md"><h2 class="text-lg font-black mb-2">小火箭启动遇到一点小波折</h2><p class="text-sm">请确认浏览器已开启 WebGL 支持并刷新页面重试。</p></div>';
          document.body.appendChild(fallback);
        }
      });
    })();
  </script>
</body>
</html>
