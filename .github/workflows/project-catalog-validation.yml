name: Project catalog validation

on:
  pull_request:
    paths:
      - "docs/projects.json"
      - "docs/projects.schema.json"
      - "docs/web-projects/**"
      - "docs/*/index.html"
      - "scripts/validate-project-catalog.mjs"
      - ".github/workflows/project-catalog-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/projects.json"
      - "docs/projects.schema.json"
      - "docs/web-projects/**"
      - "docs/*/index.html"
      - "scripts/validate-project-catalog.mjs"
      - ".github/workflows/project-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project-catalog:
    name: Validate public project catalog and local entries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog contract and local entry files
        run: node scripts/validate-project-catalog.mjs
