name: Project catalog validation

on:
  pull_request:
    paths:
      - "docs/projects.json"
      - "docs/projects.schema.json"
      - "docs/web-projects/**"
      - "docs/*/index.html"
      - "scripts/validate-project-catalog.mjs"
      - "scripts/smoke-gravity-mobile.mjs"
      - "scripts/check-gravity-mobile.mjs"
      - ".github/workflows/project-catalog-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/projects.json"
      - "docs/projects.schema.json"
      - "docs/web-projects/**"
      - "docs/*/index.html"
      - "scripts/validate-project-catalog.mjs"
      - ".github/workflows/project-catalog-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-project-catalog:
    name: Validate public project catalog and local entries
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog contract and local entry files
        run: node scripts/validate-project-catalog.mjs
      - name: Validate galaxy black-hole arrival contract
        run: node scripts/check-galaxy-arrival.mjs
      - name: Validate gravity-lens responsive controls
        run: node scripts/check-gravity-mobile.mjs
      - name: Smoke test gravity-lens mobile drawers
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          CHROME_BIN="$(command -v google-chrome || command -v chromium)" node scripts/smoke-gravity-mobile.mjs
      - name: Preserve mobile layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-mobile-layout
          path: screenshots/gravity/
          if-no-files-found: ignore
